<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widgie hero concepts</title>
<!-- Hero concepts with no widgets: the caret acts out each page. Open with ?c=home, ?c=partners or ?c=growth. -->
<style>
@font-face {
    font-family: "Bricolage";
    src: url("../../../Site/public/fonts/bricolage.woff2") format("woff2-variations");
    font-weight: 200 800;
    font-stretch: 75% 100%;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #121a2e; }
.hero { position: relative; width: 1440px; height: 900px; padding: 0 72px; }
.top { display: flex; align-items: center; justify-content: space-between; height: 96px; }
.mark { display: flex; align-items: center; gap: 12px; font: 800 32px/1 "Bricolage"; font-stretch: 85%; letter-spacing: -0.04em; }
.mark img { width: 46px; height: 46px; border: 3px solid #121a2e; border-radius: 13px; box-shadow: 0 4px 0 #121a2e; }
.top nav { display: flex; align-items: center; gap: 34px; font: 650 19px "Bricolage"; font-stretch: 90%; }
.key { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 26px; border: 3px solid #121a2e; border-radius: 16px; background: #121a2e; color: #fff; font: 700 21px "Bricolage"; font-stretch: 90%; box-shadow: 0 7px 0 #000a1f, 6px 13px 0 rgba(18, 26, 46, 0.25); }
.key::after { content: ""; width: 4px; height: 24px; border-radius: 2px; background: currentColor; opacity: 0.6; }
.top .key { height: 50px; font-size: 18px; padding: 0 20px; }
.copy { position: absolute; left: 72px; top: 190px; width: 620px; }
h1 { font: 800 150px/0.84 "Bricolage"; font-stretch: 80%; letter-spacing: -0.032em; }
.lede { margin-top: 40px; width: 520px; font-size: 22px; font-weight: 500; line-height: 1.4; }
.cta { display: flex; align-items: center; gap: 22px; margin-top: 36px; }
.cta small { font-size: 15px; font-weight: 600; opacity: 0.7; line-height: 1.3; }
.art { position: absolute; right: 40px; top: 110px; width: 680px; height: 680px; }
.art svg { width: 100%; height: 100%; overflow: visible; }
.ask { position: absolute; right: 96px; bottom: 70px; display: flex; gap: 12px; width: 560px; }
.ask input { flex: 1; height: 62px; padding: 0 20px; border: 3px solid #121a2e; border-radius: 16px; background: #fff; font: 600 19px -apple-system, sans-serif; box-shadow: 0 7px 0 #121a2e; }
.ask .key { height: 62px; background: #ffd23c; color: #121a2e; box-shadow: 0 7px 0 #121a2e; }
.label { position: absolute; left: 72px; bottom: 34px; font: 700 15px "Bricolage"; opacity: 0.55; }
</style>
</head>
<body>
<div class="hero" id="hero">
    <div class="top"><span class="mark"><img src="../../../Site/public/mark.svg" alt="">widgie</span><nav><span>For partners</span><span>For personal growth</span><span class="key">Get early access</span></nav></div>
    <div class="copy"><h1 id="h1"></h1><p class="lede" id="lede"></p><div class="cta"><span class="key">Get early access</span><small>For iPhone.<br>Free while it's early.</small></div></div>
    <div class="art" id="art"></div>
</div>
<script src="../../../Site/public/caret.js"></script>
<script>
const INK = "#121A2E";
const SKY = "#C4D8F3";
const CHEEK = "#FF7F8E";
const which = new URLSearchParams(location.search).get("c") || "home";

const HEART = (x, y, size, color = "#ff4f72") =>
    `<path transform="translate(${x} ${y}) scale(${size / 24})" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z" fill="${color}" stroke="${INK}" stroke-width="${24 / size * 1.6}"/>`;

/// Paper notes and the speech bubble share one card style: white, a thick ink edge, a solid bottom shadow.
const card = (x, y, w, h, rot, inner, r = 16) =>
    `<g transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"><rect x="${x}" y="${y + 7}" width="${w}" height="${h}" rx="${r}" fill="${INK}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="#fff" stroke="${INK}" stroke-width="4"/>${inner}</g>`;

const text = (x, y, size, content, opts = "") =>
    `<text x="${x}" y="${y}" font-family="Bricolage" font-weight="800" font-size="${size}" style="font-stretch: 85%" fill="${INK}" ${opts}>${content}</text>`;


/// Small finished widgets drawn as SVG, in the site's block style: a face, an ink edge, a solid bottom.
function mini(kind, x, y, size = 150, rot = 0) {
    const k = size / 150;
    const looks = {
        luna: { bg: "#2b1f14", edge: "#120c06", label: "#ffbe1a", fg: "#ffe9cf", title: "Luna", big: "2h 14m", small: "fed by Sam" },
        hearts: { bg: "#3a1830", edge: "#1c0a17", label: "#ff8fb0", fg: "#ffe3ec", title: "Sam", big: "5", small: "from Sam today" },
        water: { bg: "#0f3550", edge: "#061a28", label: "#5ac8fa", fg: "#e3f6ff", title: "Water", big: "5/8", small: "glasses today" },
        streak: { bg: "#e8dcff", edge: "#8f7ad8", label: "#5a3fc0", fg: INK, title: "Meditate", big: "12", small: "day streak" },
    };
    const l = looks[kind];
    const extra = {
        luna: `<g transform="translate(10 96) scale(.8)"><path d="M12 13 C2 17 2 37 11 41 C17 37 19 24 17 14Z" fill="#8a5527"/><path d="M52 13 C62 17 62 37 53 41 C47 37 45 24 47 14Z" fill="#8a5527"/><ellipse cx="32" cy="30" rx="20" ry="19" fill="#f2b46b"/><ellipse cx="32" cy="40" rx="11" ry="8.5" fill="#fff1dc"/><path d="M21.5 27.5 q3 -3.6 6 0M36.5 27.5 q3 -3.6 6 0" fill="none" stroke="#2b1f14" stroke-width="2" stroke-linecap="round"/><ellipse cx="32" cy="35.5" rx="4" ry="3" fill="#2b1f14"/></g><circle cx="118" cy="118" r="17" fill="#ffbe1a"/><path d="M110 118 l6 6 10 -11" fill="none" stroke="#2b1f14" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`,
        hearts: `<circle cx="118" cy="118" r="17" fill="#ff6f8c"/>${HEART(107, 107, 22, "#3a1830")}`,
        water: `<path d="M112 46h14v10l7 9v52a5 5 0 0 1-5 5h-18a5 5 0 0 1-5-5V65l7-9z" fill="#5ac8fa" stroke="#c9ecff" stroke-width="3"/><rect x="18" y="112" width="60" height="22" rx="8" fill="#5ac8fa"/><text x="26" y="128" font-family="-apple-system, sans-serif" font-weight="750" font-size="12" fill="#0f3550">+1 glass</text>`,
        streak: `<circle cx="112" cy="46" r="24" fill="#5a3fc0" opacity=".14"/><circle cx="112" cy="46" r="15" fill="#5a3fc0" opacity=".2"/><circle cx="118" cy="118" r="17" fill="#5a3fc0"/><path d="M110 118 l6 6 10 -11" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>`,
    }[kind];
    const face = `<rect x="0" y="9" width="150" height="150" rx="30" fill="${l.edge}" stroke="${INK}" stroke-width="3.5"/><rect x="0" y="0" width="150" height="150" rx="30" fill="${l.bg}" stroke="${INK}" stroke-width="3.5"/>` +
        `<text x="16" y="30" font-family="-apple-system, sans-serif" font-weight="750" font-size="14" fill="${l.label}">${l.title}</text>` +
        `<text x="15" y="68" font-family="Bricolage" font-weight="800" font-size="34" style="font-stretch: 85%" fill="${l.fg}">${l.big}</text>` +
        `<text x="16" y="88" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="${l.fg}" opacity=".8">${l.small}</text>` + extra;
    return `<g transform="translate(${x} ${y}) rotate(${rot} ${size / 2} ${size / 2}) scale(${k})">${face}</g>`;
}

const greyText = (x, y, size, lines, opacity = 0.42, anchor = "start") =>
    lines.map((line, i) => text(x, y + i * size * 1.18, size, line, `opacity="${opacity}" text-anchor="${anchor}"`)).join("");

const sparkle = (x, y, r) =>
    `<path d="M${x} ${y - r} Q${x + r * 0.22} ${y - r * 0.22} ${x + r} ${y} Q${x + r * 0.22} ${y + r * 0.22} ${x} ${y + r} Q${x - r * 0.22} ${y + r * 0.22} ${x - r} ${y} Q${x - r * 0.22} ${y - r * 0.22} ${x} ${y - r}Z" fill="#ffd23c" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;

const SCENES = {
    // Home: the prompt, in soft grey, points into a widget the caret is drawing. Behind the pencil the widget is
    // already real, in color; ahead of it, it is still a dotted sketch. Words in, widgets out, in one picture.
    home: {
        bg: "#9cc3f5",
        h1: "Words in.<br>Widgets out.",
        lede: "Say what you want on your home screen, in plain words. Widgie builds a widget that works, for the two of you or for your own goals.",
        art: () => {
            const edge = 392; // where the pencil is: color to the left, sketch to the right
            const box = { x: 70, y: 280, w: 470, h: 236, r: 50 };
            const prompt =
                text(60, 118, 42, "\u201cTell me when", `opacity=".42"`) +
                text(60, 168, 42, "Luna was fed\u201d", `opacity=".42"`) +
                `<path d="M300 186 C318 222 286 252 214 268" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 10"/><path d="M230 256 L210 270 L232 280" fill="none" stroke="${INK}" stroke-opacity=".4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
            const shadow = `<ellipse cx="305" cy="560" rx="230" ry="16" fill="${INK}" opacity=".1"/>`;
            const sketch =
                `<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="${box.r}" fill="#fff" fill-opacity=".18" stroke="${INK}" stroke-opacity=".3" stroke-width="6" stroke-dasharray="2 17" stroke-linecap="round"/>` +
                `<circle cx="478" cy="452" r="32" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="4" stroke-dasharray="3 8"/>` +
                `<rect x="420" y="330" width="80" height="16" rx="8" fill="${INK}" opacity=".18"/>`;
            const pup =
                `<g transform="translate(232 420) scale(1.25)"><path d="M12 13 C2 17 2 37 11 41 C17 37 19 24 17 14Z" fill="#8a5527"/><path d="M52 13 C62 17 62 37 53 41 C47 37 45 24 47 14Z" fill="#8a5527"/><ellipse cx="32" cy="30" rx="20" ry="19" fill="#f2b46b"/><ellipse cx="32" cy="40" rx="11" ry="8.5" fill="#fff1dc"/><path d="M21.5 27.5 q3 -3.6 6 0M36.5 27.5 q3 -3.6 6 0" fill="none" stroke="#2b1f14" stroke-width="2" stroke-linecap="round"/><ellipse cx="18.5" cy="34.5" rx="3" ry="2" fill="#ff9aa8"/><ellipse cx="45.5" cy="34.5" rx="3" ry="2" fill="#ff9aa8"/><ellipse cx="32" cy="35.5" rx="4" ry="3" fill="#2b1f14"/><path d="M29.6 42.4 q2.4 7 4.8 0z" fill="#ff7f8e" stroke="#2b1f14" stroke-width="1.2"/></g>`;
            const paw = `<g transform="translate(110 314) scale(1.15)" fill="#ffbe1a"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10" cy="5.8" rx="2.2" ry="2.8"/><ellipse cx="14.5" cy="5.8" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"/><path d="M12.2 11.2c-3 0-6.2 4.6-6.2 6.8 0 1.8 1.6 2.6 3 2.6 1.3 0 2-.6 3.2-.6s1.9.6 3.2.6c1.4 0 3-.8 3-2.6 0-2.2-3.2-6.8-6.2-6.8z"/></g>`;
            const real =
                `<defs><clipPath id="made"><rect x="0" y="0" width="${edge}" height="660"/></clipPath></defs><g clip-path="url(#made)">` +
                `<rect x="${box.x}" y="${box.y + 12}" width="${box.w}" height="${box.h}" rx="${box.r}" fill="#120c06" stroke="${INK}" stroke-width="5"/>` +
                `<rect x="${box.x}" y="${box.y}" width="${box.w}" height="${box.h}" rx="${box.r}" fill="#2b1f14" stroke="${INK}" stroke-width="5"/>` +
                paw +
                `<text x="146" y="338" font-family="-apple-system, sans-serif" font-weight="750" font-size="27" fill="#ffbe1a">Luna</text>` +
                `<text x="108" y="410" font-family="Bricolage" font-weight="800" font-size="70" style="font-stretch: 85%" fill="#ffe9cf">2h 14m</text>` +
                `<text x="110" y="450" font-family="-apple-system, sans-serif" font-weight="600" font-size="24" fill="#ffe9cf" opacity=".8">fed by Sam</text>` +
                pup +
                `</g>` +
                `<path d="M${edge} ${box.y + 8} L${edge} ${box.y + box.h + 10}" stroke="#ffe9cf" stroke-width="5" stroke-linecap="round" opacity=".55"/>` +
                `<path d="M${edge} ${box.y + 8} L${edge} ${box.y + box.h + 10}" stroke="#ffd23c" stroke-width="14" stroke-linecap="round" opacity=".18"/>`;
            const sparkle = (x, y, r) =>
                `<path d="M${x} ${y - r} Q${x + r * 0.22} ${y - r * 0.22} ${x + r} ${y} Q${x + r * 0.22} ${y + r * 0.22} ${x} ${y + r} Q${x - r * 0.22} ${y + r * 0.22} ${x - r} ${y} Q${x - r * 0.22} ${y - r * 0.22} ${x} ${y - r}Z" fill="#ffd23c" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`;
            const sparkles = sparkle(edge - 34, 238, 16) + sparkle(edge + 10, 330, 10) + sparkle(edge - 70, 270, 9);
            const caret = caretSVG({ pose: "draw", size: 300, x: edge - 66, y: box.y - 282, color: INK, eye: "#9cc3f5", cheek: CHEEK, eyes: "happy" });
            return prompt + shadow + sketch + real + caret + sparkles;
        },
    },

    // Variant: greyed-out widgets around the caret, each with its prompt; the one the caret just made is in color.
    ghost: {
        bg: "#9cc3f5",
        h1: "Words in.<br>Widgets out.",
        lede: "Say what you want on your home screen, in plain words. Widgie builds a widget that works, for the two of you or for your own goals.",
        art: () => {
            const defs = `<defs><filter id="grey"><feColorMatrix type="saturate" values="0"/></filter></defs>`;
            const ghost = (kind, x, y, size, rot) => `<g filter="url(#grey)" opacity=".32">${mini(kind, x, y, size, rot)}</g>`;
            const caret = caretSVG({ pose: "lean", size: 300, x: 190, y: 318, color: INK, eye: "#9cc3f5", cheek: CHEEK, eyes: "happy", cheeks: 1.3, shadow: INK, shadowOpacity: 0.14 });
            const pushups = ghost("streak", 96, 404, 108, -5).replace("Meditate", "Pushups").replace(">12<", ">86<").replace("day streak", "this week");
            return (
                defs +
                greyText(222, 92, 16, ["“Did I meditate today?”"], 0.5) + ghost("streak", 236, 108, 108, 3) +
                greyText(452, 120, 16, ["“8 glasses a day”"], 0.5) + ghost("water", 454, 136, 112, 6) +
                greyText(92, 188, 16, ["“A heart button", "for Sam”"], 0.5) + ghost("hearts", 92, 222, 112, -6) +
                greyText(96, 386, 16, ["“How many pushups", "this week?”"].slice(0, 1).concat([]), 0.5).replace("“How many pushups", "“Pushups this week?”") + pushups +
                greyText(420, 290, 18, ["“Tell me when", "Luna was fed”"], 0.6) + mini("luna", 418, 334, 160, 6) +
                caret + sparkle(406, 326, 12) + sparkle(594, 330, 8) + sparkle(392, 520, 7)
            );
        },
    },

    // Variant: the caret in the middle with finished widgets popping out around it, each captioned in grey.
    juggle: {
        bg: "#9cc3f5",
        h1: "Words in.<br>Widgets out.",
        lede: "Say what you want on your home screen, in plain words. Widgie builds a widget that works, for the two of you or for your own goals.",
        art: () => {
            // The caret juggles: arms up, a dotted loop from the left hand, over the top, into the right hand.
            const caret = caretSVG({ pose: "jump", size: 300, x: 180, y: 300, color: INK, eye: "#9cc3f5", cheek: CHEEK, eyes: "happy", cheeks: 1.3, shadow: INK, shadowOpacity: 0.14 });
            const arms =
                `<g fill="none" stroke="${INK}" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"><path d="M326 462 Q290 452 276 404"/><path d="M336 462 Q372 452 386 404"/></g>` +
                `<circle cx="275" cy="398" r="11" fill="${INK}"/><circle cx="387" cy="398" r="11" fill="${INK}"/>`;
            const loop = `M272 384 C110 300 110 70 331 64 C552 70 552 300 390 384`;
            const trail =
                `<path d="${loop}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>` +
                "";
            // Short whoosh marks behind each widget, pointing back along the loop.
            const whoosh = (d) => `<path d="${d}" fill="none" stroke="${INK}" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>`;
            const motion =
                whoosh("M136 292 q-6 -20 -6 -40") + whoosh("M158 304 q-4 -14 -4 -28") +
                whoosh("M236 70 q-22 4 -40 14") + whoosh("M244 92 q-16 4 -28 10") +
                whoosh("M598 96 q12 18 16 40") + whoosh("M578 82 q8 14 10 30");
            return (
                trail + motion +
                greyText(10, 330, 17, ["“Tell me when", "Luna was fed”"], 0.5) +
                mini("luna", 92, 116, 136, -12) +
                greyText(238, 26, 17, ["“A heart button for Sam”"], 0.5, "end") +
                mini("hearts", 266, 4, 128, -2) +
                greyText(412, 26, 17, ["“8 glasses a day”"], 0.5) +
                mini("water", 452, 100, 128, 11) +
                mini("streak", 416, 250, 96, 22) +
                greyText(526, 390, 17, ["“Did I meditate", "today?”"], 0.5) +
                arms + caret +
                sparkle(56, 96, 11) + sparkle(640, 260, 9) + sparkle(250, 470, 8)
            );
        },
    },

    // Variant: a big phone home screen; the caret pushes a new widget into the empty slot. The prompt sits faint above.
    phone: {
        bg: "#9cc3f5",
        h1: "Words in.<br>Widgets out.",
        lede: "Say what you want on your home screen, in plain words. Widgie builds a widget that works, for the two of you or for your own goals.",
        art: () => {
            const prompt = greyText(60, 70, 34, ["“Tell me when Luna was fed”"], 0.42);
            const frame = `<rect x="150" y="110" width="330" height="540" rx="62" fill="${INK}"/><rect x="164" y="124" width="302" height="512" rx="50" fill="#dbe8fb"/><rect x="270" y="138" width="90" height="26" rx="13" fill="${INK}"/>`;
            const icon = (x, y, c) => `<rect x="${x}" y="${y}" width="56" height="56" rx="15" fill="${c}" opacity=".85"/>`;
            const icons = icon(186, 188, "#ffc2ce") + icon(254, 188, "#a9e9cd") + icon(322, 188, "#ffe594") + icon(390, 188, "#d2c6ff") + icon(186, 452, "#d2c6ff") + icon(254, 452, "#ffe594");
            const slot = `<rect x="186" y="270" width="140" height="140" rx="28" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="4" stroke-dasharray="3 10" stroke-linecap="round"/>`;
            const placed = mini("hearts", 340, 270, 112, 0);
            const flying = mini("luna", 236, 290, 150, -10);
            const caret = caretSVG({ pose: "lean", size: 270, x: 380, y: 300, color: INK, eye: "#9cc3f5", cheek: CHEEK, mirror: true });
            const dock = `<rect x="182" y="560" width="266" height="58" rx="22" fill="#fff" opacity=".55"/>`;
            return prompt + frame + icons + slot + placed + dock + flying + caret + sparkle(230, 268, 12) + sparkle(400, 262, 9);
        },
    },

    // Variant: read left to right. A faint prompt, the caret as the magic in the middle, the finished widget.
    row: {
        bg: "#9cc3f5",
        h1: "Words in.<br>Widgets out.",
        lede: "Say what you want on your home screen, in plain words. Widgie builds a widget that works, for the two of you or for your own goals.",
        art: () => {
            const arrow = (x1, x2, y) => `<path d="M${x1} ${y} H${x2}" stroke="${INK}" stroke-opacity=".35" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 11"/><path d="M${x2 - 12} ${y - 10} L${x2} ${y} L${x2 - 12} ${y + 10}" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
            const main =
                greyText(20, 250, 30, ["“Tell me", "when Luna", "was fed”"], 0.45) +
                arrow(178, 228, 300) +
                caretSVG({ pose: "jump", size: 200, x: 220, y: 200, color: INK, eye: "#9cc3f5", cheek: CHEEK, eyes: "happy", cheeks: 1.3 }) +
                sparkle(262, 200, 12) + sparkle(380, 230, 9) +
                arrow(398, 444, 300) +
                mini("luna", 456, 220, 180, 4);
            const second =
                `<g opacity=".38">` +
                greyText(20, 520, 22, ["“A heart button", "for Sam”"], 0.6) +
                arrow(190, 236, 530) +
                caretSVG({ pose: "idle", size: 120, x: 262, y: 466, color: INK, eye: "#9cc3f5", cheek: CHEEK }) +
                arrow(390, 436, 530) +
                mini("hearts", 470, 466, 120, -3) +
                `</g>`;
            return main + second;
        },
    },

    // Partners: two carets on a couch under one blanket, phones glowing, a heart rising, Luna asleep on the rug.
    partners: {
        bg: "#ffd23c",
        h1: "Made<br>for two.",
        lede: "Who fed the dog, whose turn for the bins, a heart when you're thinking of them. Say it, Widgie builds the widget, and it's on both your phones.",
        art: () => {
            const purple = "#6b4fd8";
            const rug = `<ellipse cx="330" cy="616" rx="300" ry="34" fill="#ff8a72" stroke="${INK}" stroke-width="4"/><ellipse cx="330" cy="612" rx="250" ry="22" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 12" opacity=".7"/>`;
            const back = `<rect x="70" y="250" width="520" height="230" rx="46" fill="${purple}" stroke="${INK}" stroke-width="5"/>`;
            const left = caretSVG({ pose: "lean", size: 250, x: 160, y: 180, color: INK, eye: "#ffd23c", cheek: CHEEK, eyes: "happy" });
            const right = caretSVG({ pose: "lean", size: 250, x: 245, y: 180, color: INK, eye: "#ffd23c", cheek: CHEEK, mirror: true });
            const seat = `<rect x="50" y="410" width="560" height="140" rx="34" fill="#8a6ff0" stroke="${INK}" stroke-width="5"/><path d="M330 418 v124" stroke="${INK}" stroke-width="4" opacity=".35"/>`;
            const arms = `<rect x="22" y="340" width="96" height="220" rx="40" fill="${purple}" stroke="${INK}" stroke-width="5"/><rect x="542" y="340" width="96" height="220" rx="40" fill="${purple}" stroke="${INK}" stroke-width="5"/>`;
            const legs = `<rect x="70" y="548" width="26" height="40" rx="8" fill="${INK}"/><rect x="564" y="548" width="26" height="40" rx="8" fill="${INK}"/>`;
            const blanket =
                `<path d="M150 392 C210 372 260 404 330 388 C400 372 450 400 510 386 L530 560 C450 578 400 560 330 574 C260 588 210 566 132 572 Z" fill="${CHEEK}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>` +
                `<g stroke="#fff" stroke-width="10" opacity=".8" stroke-linecap="round"><path d="M170 430 C240 416 280 440 330 428 C390 414 440 438 500 424"/><path d="M160 500 C230 488 280 512 330 500 C390 486 440 510 515 496"/></g>`;
            const phone = (x, y, rot) =>
                `<g transform="rotate(${rot} ${x + 24} ${y + 40})"><rect x="${x}" y="${y}" width="48" height="82" rx="10" fill="${INK}"/><rect x="${x + 5}" y="${y + 7}" width="38" height="66" rx="6" fill="#c4d8f3"/>${HEART(x + 13, y + 26, 22)}</g>`;
            const glow = `<circle cx="252" cy="372" r="46" fill="#fff" opacity=".22"/><circle cx="412" cy="372" r="46" fill="#fff" opacity=".22"/>`;
            const heart = HEART(298, 104, 60) + HEART(250, 66, 26) + HEART(374, 50, 20);
            const pupBody = `<ellipse cx="520" cy="590" rx="72" ry="34" fill="#f2b46b" stroke="${INK}" stroke-width="4"/><path d="M586 584 q30 -10 22 -34" fill="none" stroke="${INK}" stroke-width="10" stroke-linecap="round"/><path d="M586 584 q30 -10 22 -34" fill="none" stroke="#f2b46b" stroke-width="5" stroke-linecap="round"/>`;
            const pupHead =
                `<g transform="translate(408 528) scale(1.5)"><path d="M12 13 C2 17 2 37 11 41 C17 37 19 24 17 14Z" fill="#8a5527"/><path d="M52 13 C62 17 62 37 53 41 C47 37 45 24 47 14Z" fill="#8a5527"/><ellipse cx="32" cy="30" rx="20" ry="19" fill="#f2b46b" stroke="${INK}" stroke-width="2"/><ellipse cx="32" cy="40" rx="11" ry="8.5" fill="#fff1dc"/><path d="M21.5 28 q3 3 6 0M36.5 28 q3 3 6 0" fill="none" stroke="${INK}" stroke-width="2" stroke-linecap="round"/><ellipse cx="32" cy="35.5" rx="4" ry="3" fill="${INK}"/></g>` +
                text(560, 520, 30, "z", `opacity=".5"`) + text(586, 494, 22, "z", `opacity=".4"`);
            return rug + back + left + right + arms + seat + legs + blanket + glow + phone(228, 330, -8) + phone(388, 330, 8) + heart + pupBody + pupHead;
        },
    },

    // Growth: the caret in a sweatband curls a dumbbell with its flexed arm, a water bottle in the other hand.
    growth: {
        bg: "#8fe3bd",
        h1: "Track<br>anything.",
        lede: "Water, workouts, days alcohol-free, a savings goal. Say how you want to track it, Widgie builds the widget, and today's progress is one glance away.",
        art: () => {
            const mat = `<ellipse cx="330" cy="604" rx="230" ry="20" fill="${INK}" opacity=".12"/><rect x="110" y="580" width="440" height="30" rx="15" fill="#5a3fc0" stroke="${INK}" stroke-width="4"/><path d="M140 595 h380" stroke="#fff" stroke-width="3" stroke-dasharray="14 12" opacity=".5"/>`;
            const body = caretSVG({ pose: "idle", size: 440, x: 110, y: 170, color: INK, eye: "#8fe3bd", cheek: CHEEK });
            // The head sits near the top of the stroke: x 330, y about 170 + 0.16 * 440.
            const band = `<rect x="288" y="222" width="84" height="22" rx="9" fill="#ff4f5e" stroke="${INK}" stroke-width="3.5"/><path d="M366 230 q30 -6 44 -24" fill="none" stroke="#ff4f5e" stroke-width="9" stroke-linecap="round"/><path d="M366 236 q34 6 48 -6" fill="none" stroke="#ff4f5e" stroke-width="9" stroke-linecap="round"/>`;
            const curl =
                `<g stroke="${INK}" stroke-linecap="round" fill="${INK}"><path d="M370 420 L460 414" stroke-width="30" fill="none"/><ellipse cx="410" cy="392" rx="40" ry="31" stroke="none"/><path d="M460 414 L476 322" stroke-width="27" fill="none"/><circle cx="478" cy="306" r="22" stroke="none"/></g>` +
                `<path d="M392 378 Q410 362 430 378" fill="none" stroke="#8fe3bd" stroke-width="4" stroke-linecap="round" opacity=".8"/>` +
                `<g fill="#3e4c6b" stroke="${INK}" stroke-width="4"><rect x="424" y="298" width="110" height="16" rx="6"/><rect x="410" y="270" width="24" height="72" rx="8" fill="#ff9447"/><rect x="524" y="270" width="24" height="72" rx="8" fill="#ff9447"/></g>`;
            const holdBottle =
                `<path d="M292 450 L232 512" stroke="${INK}" stroke-width="26" stroke-linecap="round"/><rect x="186" y="430" width="48" height="104" rx="14" fill="#5ac8fa" stroke="${INK}" stroke-width="4"/><rect x="198" y="416" width="24" height="18" rx="5" fill="#ff4f5e" stroke="${INK}" stroke-width="3.5"/><rect x="186" y="470" width="48" height="10" fill="#fff" opacity=".6"/><circle cx="230" cy="512" r="19" fill="${INK}"/>`;
            const effort = `<g stroke="${INK}" stroke-width="5" stroke-linecap="round"><path d="M500 250 l14 -22"/><path d="M528 268 l24 -10"/><path d="M470 236 l2 -26"/></g><path d="M262 300 c-8 12 -10 20 -2 26 c8 4 14 -4 10 -12 z" fill="#5ac8fa" stroke="${INK}" stroke-width="3"/>`;
            const reps = card(470, 120, 150, 84, 7, text(498, 180, 52, "12!"), 24) + `<path d="M500 200 L486 238 L530 204" fill="#fff" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
            return mat + holdBottle + body + band + curl + effort + reps;
        },
    },
};

const scene = SCENES[which];
document.getElementById("hero").style.background = scene.bg;
document.getElementById("h1").innerHTML = scene.h1;
document.getElementById("lede").textContent = scene.lede;
document.getElementById("art").innerHTML = `<svg viewBox="0 0 660 660">${scene.art()}</svg>`;
if (scene.extra) document.getElementById("hero").insertAdjacentHTML("beforeend", scene.extra);
</script>
