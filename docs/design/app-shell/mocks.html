<!doctype html>
<html><head><meta charset="utf-8"><title>Widgie app shell</title>
<style>
:root{--ink:#121A2E;--sec:#3E4C6B;--ground:#C4D8F3;--card:#D6E4F7;--mint:#A9E9CD;--butter:#FFE594;--pink:#FFC2CE;--lilac:#D9CCFF;--peach:#FFD3B0;--cheek:#FF7F8E;--glass:rgba(255,255,255,.55);--bubble:#121A2E;--bubbleText:#fff;--soft:rgba(18,26,46,.07);--shadow:0 10px 22px rgba(26,52,96,.22)}
.dark{--ink:#F4F7FF;--sec:#BFD0EE;--ground:#2B4E82;--card:#33598F;--glass:rgba(20,38,70,.55);--bubble:#F4F7FF;--bubbleText:#121A2E;--soft:rgba(255,255,255,.09);--shadow:0 10px 24px rgba(5,14,32,.5)}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;padding:8px}
.row{display:flex;gap:18px;flex-wrap:nowrap;margin-bottom:22px}
.cell{display:flex;flex-direction:column;gap:8px;align-items:center}
.lab{font:600 13px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--foreground,#888)}
.phone{width:402px;height:874px;zoom:.555;border-radius:56px;overflow:hidden;position:relative;background:var(--ground);color:var(--ink);box-shadow:0 0 0 10px #0d1220}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(18,26,46,.13) 1.4px,transparent 1.6px);background-size:24px 24px;background-position:11px -1px}
.dark .dots{background-image:radial-gradient(circle,rgba(255,255,255,.10) 1.4px,transparent 1.6px)}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:8px 34px 0 46px;font:600 17px -apple-system,system-ui,Helvetica,Arial,sans-serif;z-index:5}
.scroll{position:absolute;inset:54px 0 0 0;padding:6px 16px 120px;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 6px 14px}
.title{font:800 34px/1 -apple-system,system-ui,Helvetica,Arial,sans-serif;letter-spacing:-1.2px;display:flex;align-items:center;gap:4px}
.title i{display:inline-block;width:4px;height:30px;border-radius:2px;background:var(--ink);margin-left:3px}
.sub{font:500 15px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec);margin-top:6px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--glass);backdrop-filter:blur(12px);display:grid;place-items:center}
.masonry{display:flex;gap:12px}
.col{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.pin{display:flex;flex-direction:column;gap:7px}
.face{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.cap{display:flex;align-items:center;gap:6px;padding:0 4px;font:600 14px -apple-system,system-ui,Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.cap small{font:500 12.5px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec);margin-left:auto}
.dot{width:7px;height:7px;border-radius:2px;background:#3BC48A}
.dot.off{background:transparent;border:1.6px solid var(--sec)}
/* widget faces (sizes in points, as on the home screen) */
.w{width:158px;height:158px;padding:15px;color:#fff;font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;position:relative}
.w.m{width:338px}
.scaled{transform-origin:0 0}
.wl{font:600 13px -apple-system,system-ui,Helvetica,Arial,sans-serif;opacity:.85;display:flex;align-items:center;gap:5px}
.wb{font:800 34px/1.05 -apple-system,system-ui,Helvetica,Arial,sans-serif;letter-spacing:-1px;margin-top:8px}
.ws{font:500 12.5px/1.25 -apple-system,system-ui,Helvetica,Arial,sans-serif;opacity:.8;margin-top:3px}
.tap{position:absolute;right:13px;bottom:13px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:11px;display:inline-flex;align-items:center;font:600 15px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:#121A2E;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--ground)}
.chip.out{box-shadow:inset 0 0 0 2px var(--soft);color:var(--ink)}
.tabbar{position:absolute;left:22px;right:22px;bottom:26px;height:64px;border-radius:32px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 8px 30px rgba(18,26,46,.18),inset 0 0 0 1px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:space-around;z-index:6}
.dark .tabbar{box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec);width:96px;padding:6px 0;border-radius:24px}
.tab.on{color:var(--ink);background:var(--soft)}
.tab svg{width:26px;height:26px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:7}
/* chat */
.msg{display:flex;margin:10px 0}
.me{justify-content:flex-end}
.bub{max-width:270px;padding:11px 15px;border-radius:20px;font:500 16.5px/1.3 -apple-system,system-ui,Helvetica,Arial,sans-serif;letter-spacing:-.2px}
.me .bub{background:var(--bubble);color:var(--bubbleText);border-bottom-right-radius:6px}
.it{display:flex;gap:10px;align-items:flex-start}
.it .bub{background:var(--glass);border-bottom-left-radius:6px}
.composer{position:absolute;left:16px;right:16px;bottom:104px;display:flex;gap:10px;align-items:flex-end;z-index:6}
.field{flex:1;min-height:52px;border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);display:flex;align-items:center;padding:0 8px 0 16px;font:500 17px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec);gap:8px;box-shadow:inset 0 0 0 1.5px var(--soft)}
.send{width:40px;height:40px;border-radius:13px;background:var(--ink);display:grid;place-items:center;margin-left:auto}
.cardw{background:var(--glass);border-radius:26px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 16px -apple-system,system-ui,Helvetica,Arial,sans-serif}
.btn.p{background:var(--ink);color:var(--ground)}
.btn.s{box-shadow:inset 0 0 0 2px var(--soft)}
.bar{width:3px;height:18px;border-radius:2px;background:currentColor}
.sect{font:700 20px -apple-system,system-ui,Helvetica,Arial,sans-serif;letter-spacing:-.5px;margin:20px 6px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sect small{font:600 14px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec)}
.hero{border-radius:28px;padding:18px;position:relative;overflow:hidden;height:190px;color:#121A2E}
.tname{font:650 14px -apple-system,system-ui,Helvetica,Arial,sans-serif;padding:0 4px;letter-spacing:-.2px}
.tsub{font:500 12.5px -apple-system,system-ui,Helvetica,Arial,sans-serif;color:var(--sec);padding:0 4px;margin-top:-4px}
</style></head><body>
<div id="out"></div>
<script>
const INK="#121A2E";
const caret=(h,eyes=true,cheek=true,tilt=0,color="currentColor")=>`<svg width="${h*.36}" height="${h}" viewBox="0 0 36 100" style="transform:rotate(${tilt}deg);overflow:visible"><path d="M18 92 C18 60 18 34 21 10" stroke="${color}" stroke-width="15" stroke-linecap="round" fill="none"/>${eyes?`<ellipse cx="15.5" cy="17" rx="2.3" ry="2.9" fill="var(--ground)"/><ellipse cx="23.5" cy="17.5" rx="2.3" ry="2.9" fill="var(--ground)"/>`:""}${cheek?`<ellipse cx="12.5" cy="25" rx="2.6" ry="1.7" fill="#FF7F8E"/><ellipse cx="25" cy="25.5" rx="2.6" ry="1.7" fill="#FF7F8E"/>`:""}</svg>`;
const I={paw:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="10" rx="2.2" ry="2.8"/><ellipse cx="10" cy="5.8" rx="2.2" ry="2.8"/><ellipse cx="14.5" cy="5.8" rx="2.2" ry="2.8"/><ellipse cx="18.5" cy="10" rx="2.2" ry="2.8"/><path d="M12.2 11.2c-3 0-6.2 4.6-6.2 6.8 0 1.8 1.6 2.6 3 2.6 1.3 0 2-.6 3.2-.6s1.9.6 3.2.6c1.4 0 3-.8 3-2.6 0-2.2-3.2-6.8-6.2-6.8z"/></svg>',
check:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>',
heart:(s=13)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>`,
drop:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s-7 7.6-7 12.3a7 7 0 0 0 14 0C19 10.1 12 2.5 12 2.5z"/></svg>',
plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
up:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg>',
photo:'<svg width="22" height="22" viewBox="0 0 26 22"><rect x="1.3" y="1.3" width="23.4" height="19.4" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M5 17l6-6 4.5 4.5 2.8-2.8 3.7 3.7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><circle cx="17.5" cy="7.3" r="2.1" fill="currentColor"/></svg>',
plane:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0v4.7l-8 5v2l8-2.5v5l-2 1.5V21l3.5-1 3.5 1v-1.5l-2-1.5v-5z"/></svg>',
leaf:'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5C12 3.5 5 7.6 5 14.2c0 1.8.6 3.4 1.6 4.6L4 21.4l1.4 1.4 2.6-2.6c1.2 1 2.8 1.6 4.6 1.6 6.6 0 7.9-9.8 7.9-18.3z"/></svg>',
cart:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 11h10.6L20.5 7H7"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>'};
const tabIcons={
 mine:'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="9" height="12" rx="3"/><rect x="14" y="3" width="9" height="7" rx="3"/><rect x="3" y="17" width="9" height="6" rx="3"/><rect x="14" y="12" width="9" height="11" rx="3"/></svg>',
 make:'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 6.5A3.5 3.5 0 0 1 7.5 3h11A3.5 3.5 0 0 1 22 6.5v8a3.5 3.5 0 0 1-3.5 3.5H11l-5 4.5V18H7.5A3.5 3.5 0 0 1 4 14.5z"/><path d="M13 7.5v6.5" stroke-width="2.6" stroke-linecap="round"/></svg>',
 tpl:'<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 3l2.6 6.1L22 10l-4.9 4.3L18.4 21 13 17.6 7.6 21l1.3-6.7L4 10l6.4-.9z"/></svg>'};
const tabbar=on=>`<div class="tabbar">${[["mine","Widgets"],["make","Make"],["tpl","Templates"]].map(([k,n])=>`<div class="tab ${k===on?"on":""}">${tabIcons[k]}${n}</div>`).join("")}</div><div class="home"></div>`;
const status=`<div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2.5" y="2.5" width="16" height="7" rx="2" fill="currentColor"/></svg></span></div>`;

// widget faces, home-screen sized
const F={
 luna:()=>`<div class="w" style="background:linear-gradient(160deg,#3a2614,#22160b)"><div class="wl">${I.paw}Luna</div><div class="wb">2h 14m</div><div class="ws">fed by Sam</div><div style="position:absolute;left:14px;bottom:14px;font-size:30px">🐶</div><div class="tap" style="background:#F2B46B;color:#22160b">${I.check}</div></div>`,
 hearts:()=>`<div class="w" style="background:linear-gradient(160deg,#ff8fa3,#e5486a)"><div class="wl">${I.heart()}Sam</div><div class="wb" style="font-size:44px">5</div><div class="ws">from Sam today<br>you sent 3</div><div class="tap" style="background:#fff;color:#e5486a">${I.heart(20)}</div></div>`,
 water:()=>`<div class="w m" style="background:linear-gradient(160deg,#0A2636,#082130)"><div class="wl" style="color:#5ac8fa">${I.drop}<span style="color:#fff">Water</span></div><div class="wb">5 / 8</div><div class="ws">glasses today</div><div class="tap" style="left:15px;right:auto;background:#5ac8fa;color:#082130;border-radius:20px">${I.plus}</div><div style="position:absolute;right:18px;bottom:16px;display:flex;gap:9px;align-items:flex-end">${[40,62,30,70,55,48,36].map((h,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:12px;height:${h}px;border-radius:6px;background:${i==6?"#5ac8fa":"#1d4e66"}"></div><span style="font:600 10px -apple-system,system-ui,Helvetica,Arial,sans-serif;opacity:.7">${"FSSMTWT"[i]}</span></div>`).join("")}</div></div>`,
 streak:()=>`<div class="w" style="background:linear-gradient(170deg,#1f2a44,#121a2e)"><div class="wl">🪷 Meditate</div><div class="wb" style="font-size:44px">12</div><div class="ws">day streak</div><div style="position:absolute;left:14px;right:14px;bottom:14px;height:36px;border-radius:12px;background:#7BE495;color:#0f2a18;display:flex;align-items:center;justify-content:center;font:700 14px -apple-system,system-ui,Helvetica,Arial,sans-serif">I meditated</div></div>`,
 count:()=>`<div class="w m" style="background:linear-gradient(160deg,#ffd76a,#ffb547);color:#2b1d00"><div class="wl">${I.plane}Lisbon</div><div class="wb" style="font-size:58px;margin-top:4px">12</div><div class="ws" style="opacity:.75">days until our trip</div><div style="position:absolute;right:20px;top:22px;width:130px;height:112px;background:#fff;border-radius:12px;transform:rotate(6deg);box-shadow:0 6px 14px rgba(0,0,0,.18);padding:12px;color:#121A2E"><div style="display:flex;justify-content:space-between;font:800 18px -apple-system,system-ui,Helvetica,Arial,sans-serif">SFO<span style="opacity:.4">✈</span>LIS</div><div style="font:600 11px -apple-system,system-ui,Helvetica,Arial,sans-serif;opacity:.6;margin-top:8px">Seats 4A 4B</div><div style="margin-top:14px;height:22px;background:repeating-linear-gradient(90deg,#121A2E 0 2px,transparent 2px 5px)"></div></div></div>`,
 plant:()=>`<div class="w" style="background:linear-gradient(160deg,#2f6b45,#1d4a2f)"><div class="wl">${I.leaf}Monstera</div><div class="wb">6 days</div><div class="ws">since watering,<br>last by Sam</div><div class="tap" style="background:#9be7b0;color:#1d4a2f">${I.check}</div></div>`,
 groc:()=>`<div class="w m" style="background:#fff;color:#121A2E"><div class="wl" style="opacity:1">${I.cart}Groceries<span style="margin-left:auto;opacity:.5">4 left</span></div><div style="columns:2;margin-top:12px;font:500 14px/2 -apple-system,system-ui,Helvetica,Arial,sans-serif">${[["Oat milk",1],["Nappies, size 3",0],["Eggs",0],["Basil",1],["Dog food",0],["Lemons",0]].map(([n,d])=>`<div style="display:flex;align-items:center;gap:8px;${d?"opacity:.4;text-decoration:line-through":""}"><span style="width:15px;height:15px;border-radius:5px;border:2px solid #121A2E;${d?"background:#121A2E":""}"></span>${n}</div>`).join("")}</div></div>`,
 word:()=>`<div class="w m" style="background:linear-gradient(160deg,#2a5bd7,#1a3a9a)"><div class="wl">📖 Palabra del día<span style="margin-left:auto;opacity:.7">48 learned</span></div><div class="wb" style="font-size:36px">madrugar</div><div class="ws">to get up early. "Mañana tengo que madrugar."</div><div style="position:absolute;left:15px;bottom:14px;display:flex;gap:8px"><span style="padding:7px 12px;border-radius:10px;background:#fff;color:#1a3a9a;font:700 13px -apple-system,system-ui,Helvetica,Arial,sans-serif">Know it</span><span style="padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.18);font:700 13px -apple-system,system-ui,Helvetica,Arial,sans-serif">Again</span></div></div>`,
 grid:()=>`<div class="w m" style="background:#F4F1FF;color:#121A2E"><div class="wl" style="opacity:1">▦ Last two weeks<span style="margin-left:auto;opacity:.5">today</span></div><div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">${[["Gym","10110101101100"],["Read","11111011111110"],["No sugar","01101110111010"]].map(([n,d])=>`<div style="display:flex;align-items:center;gap:8px;font:600 13px -apple-system,system-ui,Helvetica,Arial,sans-serif"><span style="width:62px">${n}</span>${[...d].map((c,j)=>`<span style="width:14px;height:14px;border-radius:4px;background:${c=="1"?"#7c5cff":"#e2dbff"};${j==13?"outline:2px solid #121A2E;outline-offset:1px":""}"></span>`).join("")}</div>`).join("")}</div><div class="ws" style="opacity:.6;margin-top:10px">Reading: 6 days in a row</div></div>`,
 savings:()=>`<div class="w" style="background:linear-gradient(170deg,#fde7e7,#f7c9c9);color:#4a1d1d"><div class="wl">🗻 Japan fund</div><div class="wb">$1,240</div><div class="ws">of $2,000</div><div style="position:absolute;left:15px;right:15px;bottom:18px;height:10px;border-radius:5px;background:rgba(74,29,29,.15)"><div style="width:62%;height:100%;border-radius:5px;background:#e5484d"></div></div></div>`,
};
// a face, sized to fit `width`
const face=(k,width)=>{const html=F[k]();const nat=html.includes('class="w m"')?338:158;const s=width/nat;const h=158*s;return `<div class="face" style="width:${width}px;height:${h}px"><div class="scaled" style="transform:scale(${s})">${html}</div></div>`};
const pin=(k,name,meta,on=true)=>`<div class="pin">${face(k,179)}<div class="cap"><span class="dot ${on?"":"off"}"></span>${name}<small>${meta}</small></div></div>`;

const feed=dark=>`<div class="phone ${dark?"dark":""}"><div class="dots"></div>${status}<div class="scroll">
 <div class="head"><div><div class="title">widgie<i></i></div><div class="sub">7 widgets, 5 on your home screen</div></div><div style="margin-bottom:-6px;margin-right:-4px">${caret(70,true,true,-14)}</div></div>
 <div class="masonry"><div class="col">${pin("luna","Luna","2m ago")}${pin("water","Water","now")}${pin("plant","Monstera","1h ago")}${pin("word","Palabra","today",false)}</div>
 <div class="col">${pin("count","Lisbon trip","")}${pin("hearts","Hearts","3m ago")}${pin("streak","Meditate","",false)}${pin("savings","Japan fund","")}</div></div>
 </div>${tabbar("mine")}</div>`;

const make=dark=>`<div class="phone ${dark?"dark":""}"><div class="dots"></div>${status}<div class="scroll" style="padding-top:0">
 <div class="head" style="padding-bottom:4px"><div class="title" style="font-size:28px">New widget</div><div class="btn p" style="flex:none;height:40px;padding:0 18px;font-size:16px">Save</div></div>
 <div class="msg me"><div class="bub">tell me when Luna was fed, and who fed her</div></div>
 <div class="it"><div style="margin-top:6px">${caret(44,true,true,-8)}</div><div style="flex:1">
   <div class="cardw">${face("luna",158).replace('class="face"','class="face" style="display:inline-block;margin-right:10px"')}<div style="display:inline-flex;flex-direction:column;vertical-align:top;gap:8px;font:500 14.5px/1.3 -apple-system,system-ui,Helvetica,Arial,sans-serif;width:120px;color:var(--sec)">Tap the check to try it. It counts up from the last feed.</div>
   </div>
 </div></div>
 <div class="msg me"><div class="bub">turn it red after 4 hours</div></div>
 <div class="it" style="margin-top:6px"><div>${caret(44,true,true,18)}</div><div class="bub" style="display:flex;align-items:center;gap:10px"><span>Changing the colors</span><span style="display:flex;gap:4px">${[1,.6,.3].map(o=>`<i style="width:6px;height:6px;border-radius:2px;background:var(--ink);opacity:${o}"></i>`).join("")}</span></div></div>

 row(false,[["Widgets A: one column each",feed],["Widgets B: wide ones span",feedB],["Make",makeEmpty]])+
