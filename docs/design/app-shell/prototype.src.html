<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widgie app prototype</title>
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,/*FONT*/) format("woff2-variations");font-weight:200 800;font-stretch:75% 100%}
:root{
 --ink:#121a2e;--ink-2:rgba(18,26,46,.62);--ink-3:rgba(18,26,46,.42);
 --sky-top:#b4d4fb;--sky:#9cc3f5;--sky-bottom:#8ab6f0;--sky-shade:#7aa6e2;
 --coral:#ff6b5c;--coral-shade:#e04a3d;--sun:#ffd23c;--sun-shade:#ecb514;--grape:#3b1f6e;--grape-shade:#2a1452;--moon:#e9f2ff;--blush:#ff7f8e;
 --surface:rgba(255,255,255,.86);--surface-strong:#fff;--glass:rgba(255,255,255,.62);
 --rest:0 1px 2px rgba(20,45,90,.06),0 4px 14px -4px rgba(20,45,90,.14);
 --lift:0 2px 6px rgba(20,45,90,.06),0 18px 36px -14px rgba(20,45,90,.38);
 --spring:cubic-bezier(.32,1.42,.48,1);--soft:cubic-bezier(.22,.8,.26,1);
 --display:"Bricolage",-apple-system,system-ui,sans-serif;--text:-apple-system,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
 --unit:1px;--u:1px;--m:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);color:var(--foreground,#121a2e);-webkit-font-smoothing:antialiased}
/*SITE_CSS*/
/* ---------- the site's tiles, softened: no outline, no lip, a soft lifted shadow ---------- */
.blk::before{display:none}
.blk::after{transform:none!important;background:transparent;box-shadow:0 2px 6px rgba(20,45,90,.10),0 18px 32px -14px rgba(20,45,90,.48)}
.w{border:0!important}
.w-tap{border:0!important;box-shadow:0 4px 12px -2px rgba(0,0,0,.3)!important;transition:transform .3s var(--spring)!important}
.w-tap:active{transform:scale(.88)!important}
.w button,.w .pass,.w .who,.w .did,.w .in{box-shadow:none!important;border-width:0!important}
/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{font:600 13px var(--text);padding:7px 12px;border-radius:9px;border:1.5px solid var(--border,#ccd);background:var(--card,#fff);color:var(--foreground,#123);cursor:pointer}
.controls button.on{background:var(--foreground,#123);color:var(--background,#fff)}
.phone{--shade:var(--sky-shade);width:402px;height:874px;border-radius:58px;overflow:hidden;position:relative;color:var(--ink);font-family:var(--text);box-shadow:0 0 0 11px #0b0f1a,0 30px 60px rgba(0,0,0,.25);isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 45%,var(--sky-bottom) 100%);transition:opacity .9s var(--soft);z-index:-3}
.sky.night{background:radial-gradient(90% 40% at 78% 4%,rgba(233,242,255,.16),transparent 70%),linear-gradient(180deg,#14284f 0%,#223f72 50%,#2b4e82 100%);opacity:0}
.phone.night .sky.night{opacity:1}
.clouds{position:absolute;inset:0;z-index:-2;pointer-events:none;transition:opacity .9s}
.clouds svg{position:absolute;filter:blur(1.5px);animation:drift linear infinite}
.phone.night .clouds{opacity:.18}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(600px)}}
.stars{position:absolute;inset:0 0 45% 0;opacity:0;transition:opacity .9s;pointer-events:none;z-index:-2}
.phone.night .stars{opacity:1}
.stars i{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#e9f2ff;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:10px 32px 0 50px;font:600 17px var(--text);letter-spacing:-.2px;z-index:20;color:var(--ink);transition:color .6s}
.status svg{display:block}
.night .status,.night .page{color:#fff}
.night{--ink-2:rgba(255,255,255,.7);--ink-3:rgba(255,255,255,.45);--surface:rgba(255,255,255,.92);--glass:rgba(24,44,84,.55);--rest:0 1px 2px rgba(0,6,20,.2),0 4px 14px -4px rgba(0,6,20,.4);--lift:0 2px 6px rgba(0,6,20,.2),0 18px 36px -14px rgba(0,6,20,.7)}
.night .blk::after{box-shadow:0 2px 6px rgba(0,6,20,.3),0 18px 32px -12px rgba(0,6,20,.75)}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:54px var(--m) 140px;transition:opacity .4s var(--soft),transform .55s var(--soft)}
.page::-webkit-scrollbar{display:none}
.page.hidden{opacity:0;pointer-events:none}
.page.hidden.to-left{transform:translateX(-28px)}
.page.hidden.to-right{transform:translateX(28px)}
.display{font-family:var(--display);font-weight:800;font-stretch:82%;letter-spacing:-.025em;line-height:.98}
.eyebrow{font:600 14px var(--text);color:var(--ink-2);letter-spacing:-.1px}
/* ---------- Widgie ---------- */
.widgie{position:absolute;transform-origin:50% 92%}
.widgie .caret{position:static;display:block;width:100%}
.widgie.hop{animation:hop .7s var(--soft)}
@keyframes hop{0%{transform:none}12%{transform:scale(1.1,.88)}38%{transform:translateY(-30px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.06,.93)}78%{transform:scale(.98,1.02)}100%{transform:none}}
.widgie.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.widgie .eyes{transform-box:fill-box;transform-origin:center;animation:blinkeyes 4.6s infinite}
@keyframes blinkeyes{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.avatar{position:relative;flex:none;width:34px;height:34px;border-radius:12px;background:linear-gradient(160deg,#cfe3fc,#a9cbf6);overflow:hidden;box-shadow:var(--rest)}
.avatar .widgie{width:76px;height:76px;left:-24px;top:-6px}
.night .avatar{background:linear-gradient(160deg,#36588f,#24436f)}
/* ---------- speech ---------- */
.bubble{position:absolute;background:var(--surface-strong);color:var(--ink);border-radius:20px;padding:12px 15px;font:600 15px/1.32 var(--text);letter-spacing:-.15px;box-shadow:var(--lift);transform-origin:var(--tail-x,85%) 110%;transition:transform .45s var(--spring),opacity .25s}
.bubble::after{content:"";position:absolute;bottom:-6px;left:var(--tail-x,85%);width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-bottom-right-radius:4px}
.bubble.gone{transform:scale(.6);opacity:0}
.bubble.pop{animation:bubblepop .5s var(--spring)}
@keyframes bubblepop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---------- Widgets ---------- */
.top{position:relative;height:196px}
.top .eyebrow{position:absolute;left:0;top:14px}
.top h1{position:absolute;left:0;top:38px;font-size:40px}
.top .sub{position:absolute;left:0;top:88px;font:500 15px var(--text);color:var(--ink-2)}
.top .sub b{font-weight:650;color:var(--ink)}
.night .top .sub b{color:#fff}
.feed{display:flex;flex-direction:column;gap:24px}
.row{display:flex;gap:14px}
.pin{display:flex;flex-direction:column;gap:12px}
.pin .blk{position:relative;flex:none;transition:transform .35s var(--spring)}
.pin .blk.press{transform:scale(.965)}
.cap{display:flex;align-items:center;gap:6px;padding:0 4px;min-height:22px}
.cap .name{font:600 15px var(--text);letter-spacing:-.2px}
.cap .home{margin-left:auto;width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:var(--glass);color:var(--ink-2)}
.cap .home svg{width:12px;height:12px}
.rise{animation:rise .8s var(--spring) both}
@keyframes rise{0%{opacity:0;transform:translateY(34px) scale(.96)}100%{opacity:1;transform:none}}
/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:18px;right:18px;bottom:28px;height:70px;border-radius:26px;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 1px 0 rgba(255,255,255,.6);display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:0 8px;z-index:30;transition:background .6s}
.night .tabbar{box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.12)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:56px;padding-bottom:6px;font:600 11px var(--text);letter-spacing:-.05px;color:var(--ink-3);cursor:pointer;transition:color .25s}
.tab.on{color:var(--ink)}
.night .tab.on{color:#fff}
.tab > svg{width:24px;height:24px;transition:transform .45s var(--spring)}
.tab.on > svg{transform:scale(1.1)}
.tab:active > svg{transform:scale(.85)}
.tabpill{position:absolute;top:7px;height:56px;border-radius:18px;background:rgba(255,255,255,.75);box-shadow:0 1px 3px rgba(20,45,90,.1);transition:left .55s var(--spring),width .55s var(--spring),opacity .3s}
.night .tabpill{background:rgba(255,255,255,.14);box-shadow:none}
.makekey{position:relative;width:46px;height:30px;margin-bottom:0;border-radius:11px;background:linear-gradient(165deg,#ffe479,#ffc532);box-shadow:0 6px 14px -4px rgba(214,150,0,.6),inset 0 1px 0 rgba(255,255,255,.7);overflow:hidden;transition:transform .45s var(--spring),box-shadow .3s}
.tab.on .makekey{transform:scale(1.12) translateY(-2px);background:linear-gradient(165deg,#ffa4b1,#ff7a90);box-shadow:0 8px 16px -4px rgba(230,70,100,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.makekey .widgie{width:70px;height:70px;left:-14px;top:-4px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font:700 11px var(--text);display:grid;place-items:center;box-shadow:0 3px 8px rgba(224,74,61,.5);transform:scale(0);transition:transform .5s var(--spring)}
.badge.show{transform:scale(1)}
/* ---------- controls ---------- */
.chip{height:40px;padding:0 15px;border-radius:13px;display:inline-flex;align-items:center;gap:7px;font:600 14.5px var(--text);letter-spacing:-.15px;color:var(--ink);background:var(--surface);box-shadow:var(--rest);cursor:pointer;transition:transform .35s var(--spring),background .25s,color .25s;white-space:nowrap}
.chip:active{transform:scale(.93)}
.key{height:52px;padding:0 24px;border-radius:16px;background:var(--ink);color:#fff;font:700 17px var(--display);font-stretch:92%;letter-spacing:-.01em;box-shadow:0 12px 24px -10px rgba(18,26,46,.65);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .35s var(--spring)}
.key::after{content:"";width:3px;height:19px;border-radius:2px;background:#9cc3f5;animation:blink 1.06s steps(1) infinite}
.key:active{transform:scale(.95)}
.key.light{background:var(--surface);color:var(--ink);box-shadow:var(--rest)}
.key.light::after{display:none}
.night .key:not(.light){background:#fff;color:var(--ink)}
.night .key:not(.light)::after{background:var(--ink)}
/* ---------- Make ---------- */
.make-hello{position:relative;height:300px}
.make-hello .ground{position:absolute;left:228px;top:262px;width:120px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,26,46,.22),transparent)}
.night .make-hello .ground{background:radial-gradient(closest-side,rgba(0,6,20,.45),transparent)}
.ideas{display:flex;flex-direction:column;gap:10px}
.ideas .eyebrow{margin:0 4px 2px}
.idea{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);box-shadow:var(--rest);cursor:pointer;transition:transform .35s var(--spring);color:var(--ink);animation:rise .7s var(--spring) both}
.idea:active{transform:scale(.97)}
.idea .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.idea .t{font:600 16px var(--text);letter-spacing:-.2px}
.idea .s{font:500 13px var(--text);color:rgba(18,26,46,.55);margin-top:1px}
.idea .chev{margin-left:auto;color:rgba(18,26,46,.35)}
.composer{position:absolute;left:var(--m);right:var(--m);bottom:112px;z-index:25;height:56px;border-radius:20px;background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--lift);display:flex;align-items:center;gap:8px;padding:0 8px;transition:opacity .35s var(--soft),transform .45s var(--spring)}
.composer.hidden{opacity:0;transform:translateY(16px);pointer-events:none}
.composer .icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--ink);background:rgba(18,26,46,.05)}
.composer .ph{font:500 16px var(--text);color:rgba(18,26,46,.45);display:flex;align-items:center;gap:2px}
.composer .ph b{width:2.5px;height:21px;border-radius:2px;background:var(--ink);margin-right:3px;animation:blink 1.06s steps(1) infinite}
.composer .send{margin-left:auto;width:40px;height:40px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;opacity:.25}
.thread{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.me{align-self:flex-end;max-width:262px;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 15px;font:600 15.5px/1.32 var(--text);letter-spacing:-.15px;box-shadow:0 10px 20px -10px rgba(18,26,46,.6);animation:slidein .55s var(--spring) both}
.night .me{background:#fff;color:var(--ink)}
@keyframes slidein{0%{opacity:0;transform:translateY(22px) scale(.92)}100%{opacity:1;transform:none}}
.them{display:flex;gap:9px;align-items:flex-end;animation:slidein .55s var(--spring) both}
.them .bubble{position:relative;max-width:262px;--tail-x:0;border-bottom-left-radius:6px}
.them .bubble::after{display:none}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.made{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 0 0 43px}
.sketchbox{position:relative;width:178px;height:190px}
.sketchbox svg{width:100%;height:100%}
.sketchbox .edge{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:trace 2.4s var(--soft) forwards}
.sketchbox .lines{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trace 1.4s .9s var(--soft) forwards}
.night .sketchbox .edge,.night .sketchbox .lines{stroke:#e9f2ff}
@keyframes trace{to{stroke-dashoffset:0}}
.popin{animation:popin .75s var(--spring) both}
@keyframes popin{0%{transform:scale(.7);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
.refine{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;width:7px;height:20px;border-radius:4px;animation:burst 1.2s cubic-bezier(.15,.75,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6);opacity:0}}
.flyer{position:absolute;z-index:70;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.2,.55,1),opacity .8s}
/* ---------- Templates ---------- */
.tpl-head{padding:14px 0 16px}
.tpl-head h1{font-size:40px;margin-top:6px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--m));padding:2px var(--m) 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none}
.cat.on{background:var(--ink);color:#fff;box-shadow:0 10px 18px -10px rgba(18,26,46,.7)}
.night .cat.on{background:#fff;color:var(--ink)}
.banner{position:relative;height:176px;border-radius:28px;margin:6px 0 28px;overflow:hidden;color:#fff;padding:20px 22px;box-shadow:var(--lift);transition:background .5s var(--soft)}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 85% 100%,rgba(255,255,255,.28),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.14),transparent 50%);pointer-events:none}
.banner h2{position:relative;font-size:40px}
.banner p{position:relative;font:600 14.5px/1.32 var(--text);margin-top:8px;max-width:168px;opacity:.92}
.banner .count{position:absolute;left:22px;bottom:18px;font:650 13px var(--text);padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.22)}
.banner .actors{position:absolute;right:4px;bottom:-6px;width:196px;height:176px}
.pile{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:30px}
.pile .item{display:flex;flex-direction:column;gap:16px;cursor:pointer}
.pile .item.wide{grid-column:span 2}
.pile .blk{position:relative;transition:transform .45s var(--spring)}
.pile .item:active .blk{transform:rotate(0deg) scale(.97)}
.tname{font:600 15px var(--text);letter-spacing:-.2px;padding:0 4px}
.tsub{font:500 13px var(--text);color:var(--ink-2);padding:0 4px;margin-top:-13px}
.pop-out{animation:popout .25s var(--soft) forwards}
@keyframes popout{to{opacity:0;transform:translateY(12px) scale(.96)}}
/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(10,18,36,.32);opacity:0;pointer-events:none;transition:opacity .4s var(--soft);z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#eef5ff,#e2edfc);color:var(--ink);border-radius:36px 36px 0 0;z-index:50;transform:translateY(105%);transition:transform .6s cubic-bezier(.22,1.12,.36,1);padding:10px 22px 40px;box-shadow:0 -12px 40px rgba(10,20,40,.22)}
.night .sheet{background:linear-gradient(180deg,#2d4f85,#24426f);color:#fff}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:currentColor;opacity:.22;margin:0 auto 16px}
.sheet h3{font-size:34px}
.sheet .line{font:500 15px/1.35 var(--text);color:var(--ink-2);margin-top:6px}
.spot{position:relative;height:246px;display:flex;align-items:center;justify-content:center;margin:10px -22px 0}
.spot::before{content:"";position:absolute;width:300px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(156,195,245,.55),transparent);filter:blur(4px)}
.night .spot::before{background:radial-gradient(closest-side,rgba(156,195,245,.25),transparent)}
.hint{text-align:center;font:500 13px var(--text);color:var(--ink-3);margin-top:-2px}
.namefield{margin-top:18px;height:62px;border-radius:18px;background:#fff;box-shadow:var(--rest);padding:10px 16px;display:flex;flex-direction:column;justify-content:center}
.night .namefield{background:rgba(255,255,255,.1)}
.namefield label{font:600 12.5px var(--text);color:var(--ink-2)}
.namefield .v{font:600 17px var(--text);display:flex;align-items:center;gap:2px;margin-top:2px}
.namefield .v b{width:2.5px;height:20px;border-radius:2px;background:currentColor;margin-left:2px;animation:blink 1.06s steps(1) infinite}
.sheet .keys{display:flex;gap:10px;margin-top:18px}
.sheet .keys > *{flex:1}
.night .sheet .key.light{background:rgba(255,255,255,.12);color:#fff}
.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-130px);background:#fff;color:var(--ink);border-radius:18px;box-shadow:var(--lift);padding:8px 16px 8px 8px;font:600 15px var(--text);letter-spacing:-.15px;display:flex;align-items:center;gap:10px;z-index:80;transition:transform .6s var(--spring);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="stage">
 <div class="controls"><button data-time="day" class="on">Day</button><button data-time="night">Night (dark mode)</button><button data-go="widgets">Widgets</button><button data-go="make">Make</button><button data-go="tpl">Templates</button></div>
 <div class="phone" id="phone" style="zoom:.8">
  <div class="sky"></div><div class="sky night"></div><div class="stars" id="stars"></div>
  <div class="clouds" id="clouds"></div>
  <div class="status"><span>9:41</span><span style="display:flex;gap:7px;align-items:center"><svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><rect y="8" width="3.2" height="4" rx="1"/><rect x="5.2" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10.4" y="3" width="3.2" height="9" rx="1"/><rect x="15.6" width="3.2" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.6c2.4 0 4.6.9 6.2 2.5l1.2-1.2A10.4 10.4 0 0 0 8.5.9 10.4 10.4 0 0 0 1.1 3.9l1.2 1.2A8.7 8.7 0 0 1 8.5 2.6zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2a7 7 0 0 0-10 0l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.5 7 10c.4-.4.9-.6 1.5-.6z"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="19" height="8" rx="2.2" fill="currentColor"/><rect x="25" y="4.2" width="1.6" height="4.6" rx=".8" fill="currentColor" opacity=".4"/></svg></span></div>

  <section class="page" id="p-widgets">
   <div class="top">
    <div class="eyebrow" id="w-date">Thursday, November 26</div>
    <h1 class="display" id="w-hello">Good morning</h1>
    <div class="sub"><b>7 widgets</b>, 5 on your home screen</div>
    <div class="bubble gone" id="w-bubble" style="right:112px;top:118px;width:186px;--tail-x:92%"></div>
    <div class="widgie sway" id="w-widgie" style="right:-14px;top:52px;width:150px"></div>
   </div>
   <div class="feed" id="feed"></div>
  </section>

  <section class="page hidden to-right" id="p-make" style="padding-bottom:220px"><div id="thread"></div></section>
  <div class="composer hidden" id="composer"><span class="icon"><svg width="22" height="20" viewBox="0 0 26 22"><rect x="1.3" y="1.3" width="23.4" height="19.4" rx="5" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M5 17l6-6 4.5 4.5 2.8-2.8 3.7 3.7" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><circle cx="17.5" cy="7.3" r="2.1" fill="currentColor"/></svg></span><span class="ph"><b></b>Describe a widget</span><span class="send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg></span></div>

  <section class="page hidden to-right" id="p-tpl">
   <div class="tpl-head"><div class="eyebrow">Ready in a tap, yours in a word</div><h1 class="display">Templates</h1></div>
   <div class="cats" id="cats"></div>
   <div class="banner" id="banner"><h2 class="display" id="b-title"></h2><p id="b-line"></p><span class="count" id="b-count"></span><div class="actors" id="actors"></div></div>
   <div class="pile" id="pile"></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><h3 class="display" id="s-title"></h3><div class="line" id="s-line"></div>
   <div class="spot" id="s-stage"></div>
   <div class="hint">It works. Give it a tap.</div>
   <div class="namefield"><label id="s-label"></label><div class="v"><span id="s-name"></span><b></b></div></div>
   <div class="keys"><span class="key light" id="s-chat">Change in chat</span><span class="key" id="s-add">Add widget</span></div>
  </div>
  <div class="toast" id="toast"><div class="avatar"><div class="widgie" id="t-widgie"></div></div><span id="t-text"></span></div>
  <div class="confetti" id="confetti"></div>

  <nav class="tabbar" id="tabbar">
   <div class="tabpill" id="pill"></div>
   <div class="tab on" data-tab="widgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="3" y="3" width="8" height="11" rx="2.6"/><rect x="13" y="3" width="8" height="6.5" rx="2.6"/><rect x="3" y="16" width="8" height="5" rx="2.4"/><rect x="13" y="11.5" width="8" height="9.5" rx="2.6"/></svg>Widgets<span class="badge" id="badge">1</span></div>
   <div class="tab" data-tab="make"><div class="makekey"><div class="widgie" id="tab-widgie"></div></div>Make</div>
   <div class="tab" data-tab="tpl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><rect x="3.5" y="5" width="12" height="15" rx="3" transform="rotate(-8 9.5 12.5)"/><rect x="9" y="4" width="11.5" height="15" rx="3" transform="rotate(7 14.75 11.5)" fill="var(--glass)"/></svg>Templates</div>
  </nav>
 </div>
</div>
<script>
/*SITE_JS*/
</script>
<script>
(() => {
const $ = (s) => document.querySelector(s);
const phone = $("#phone");
const ZOOM = 0.8;
let night = false, tab = "widgets";
const ORDER = ["widgets", "make", "tpl"];

// ---------- Widgie: the site's caret, wrapped so it can hop, sway and change pose ----------
function drawWidgie(el, pose = "idle", extra = {}) {
  el.innerHTML = `<span class="caret" data-pose="${pose}"></span>`;
  const c = el.firstChild;
  Object.assign(c.dataset, extra);
  if (night) c.dataset.moon = "1";
  mountCaret(c);
}
function hop(el) { el.classList.remove("hop", "sway"); void el.offsetWidth; el.classList.add("hop"); setTimeout(() => { el.classList.remove("hop"); el.classList.add("sway"); }, 720); }
let bubbleTimer;
function say(el, words, stay = 2600) {
  el.textContent = words;
  el.classList.remove("gone", "pop"); void el.offsetWidth; el.classList.add("pop");
  clearTimeout(bubbleTimer);
  if (stay) bubbleTimer = setTimeout(() => el.classList.add("gone"), stay);
}

// sky: soft clouds and stars
const cloud = (w) => `<svg width="${w}" height="${w * .42}" viewBox="0 0 100 42"><g fill="#fff" opacity=".7"><ellipse cx="30" cy="30" rx="26" ry="12"/><ellipse cx="52" cy="22" rx="22" ry="17"/><ellipse cx="72" cy="30" rx="22" ry="11"/></g></svg>`;
$("#clouds").innerHTML = [[110, 140, 70, -20], [80, 380, 90, -55], [130, 610, 110, -10], [70, 250, 80, -70]].map(([w, top, dur, del]) => cloud(w).replace("<svg", `<svg style="top:${top}px;animation-duration:${dur}s;animation-delay:${del}s"`)).join("");
$("#stars").innerHTML = Array.from({ length: 30 }, (_, i) => `<i style="left:${(i * 47) % 392 + 5}px;top:${(i * 61) % 420 + 58}px;animation-delay:-${(i % 9) * .38}s;opacity:${.5 + (i % 4) * .15}"></i>`).join("");

// ---------- tiles ----------
function tile(w, rot = 0, size) {
  const wide = MEDIUM.has(w);
  const k = size ?? (wide ? 362 / 364 : 174 / 170);
  return `<div class="blk ${wide ? "m" : ""}" data-widget="${w}" style="--u:${k}px;--rot:${rot}deg"></div>`;
}
function live(root, onTap) {
  for (const el of root.querySelectorAll("[data-widget]")) {
    mountWidget(el);
    el.addEventListener("pointerdown", () => el.classList.add("press"));
    for (const e of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(e, () => el.classList.remove("press"));
    if (onTap) el.addEventListener("click", (e) => { if (e.target.closest("[data-tap]")) onTap(el); });
  }
}

// ---------- Widgets ----------
const HOME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 11h2.7v9.3h5V15h3v5.3h5V11h2.7z"/></svg>';
const FEED = [["count", "Lisbon trip", 1], ["luna", "Luna", 1, "hearts", "Hearts", 1], ["groc", "Groceries", 1], ["streak", "Meditate", 0, "water", "Water", 1], ["savings", "Japan fund", 0], ["plant", "Monstera", 1, "sober", "Alcohol-free", 0]];
const pin = (w, name, placed) => `<div class="pin">${tile(w)}<div class="cap"><span class="name">${name}</span>${placed ? `<span class="home" title="On your home screen">${HOME}</span>` : ""}</div></div>`;
const CHEERS = ["Logged! Your home screen has it too.", "Nice one. That's saved.", "Done. Tap again if you slipped.", "Got it. Look at you go."];
let cheer = 0;
function renderFeed() {
  $("#feed").innerHTML = FEED.map((r, i) => `<div class="row rise" style="animation-delay:${.06 + i * .06}s">${pin(r[0], r[1], r[2])}${r[3] ? pin(r[3], r[4], r[5]) : ""}</div>`).join("");
  live($("#feed"), () => { hop($("#w-widgie")); say($("#w-bubble"), CHEERS[cheer++ % CHEERS.length]); });
}

// ---------- Make ----------
const IDEAS = [["🐶", "#ffe7c2", "When was the dog fed?", "Who fed them, and how long ago", "luna", "Here's Luna's. Tap the check to try it."], ["✈️", "#ffd8d2", "Days until our trip", "A countdown with the date", "count", "Counting down to Lisbon. Want a different date?"], ["💗", "#ffd6e0", "A heart button for Sam", "One tap sends a heart", "hearts", "One tap sends Sam a heart. Try it!"]];
function makeReset() {
  $("#thread").innerHTML = `<div class="make-hello"><div class="ground"></div><div class="widgie sway" id="m-widgie" style="left:212px;top:96px;width:176px"></div><div class="bubble" id="m-bubble" style="left:0;top:58px;width:214px;--tail-x:90%">Hi! What should we make? Say it your way.</div></div>
   <div class="ideas"><div class="eyebrow">Or start from one of these</div>${IDEAS.map(([ic, bg, t, s], i) => `<div class="idea" data-i="${i}" style="animation-delay:${.15 + i * .07}s"><span class="ic" style="background:${bg}">${ic}</span><span><div class="t">${t}</div><div class="s">${s}</div></span><svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg></div>`).join("")}</div>`;
  drawWidgie($("#m-widgie"), "lean", { mirror: "1" });
  say($("#m-bubble"), $("#m-bubble").textContent, 0);
  for (const el of document.querySelectorAll(".idea")) el.onclick = () => ask(IDEAS[el.dataset.i]);
}
function avatarRow(text, cls = "") { return `<div class="them ${cls}"><div class="avatar"><div class="widgie"></div></div><div class="bubble">${text}</div></div>`; }
function ask([, , words, , w, reply]) {
  const thread = $("#thread");
  thread.innerHTML = `<div class="thread"><div class="me">${words}</div></div>`;
  const list = thread.firstChild;
  setTimeout(() => {
    list.insertAdjacentHTML("beforeend", avatarRow(`Writing your widget<span class="dots"><i></i><i></i><i></i></span>`));
    const row = list.lastChild;
    drawWidgie(row.querySelector(".widgie"), "draw");
    row.querySelector(".widgie").classList.add("sway");
    list.insertAdjacentHTML("beforeend", `<div class="made"><div class="sketchbox">${SKETCH}</div></div>`);
    const made = list.lastChild;
    setTimeout(() => {
      made.innerHTML = tile(w);
      const blk = made.firstChild;
      blk.style.position = "relative";
      blk.classList.add("popin");
      live(made);
      const av = row.querySelector(".widgie");
      drawWidgie(av, "jump", { eyes: "happy" }); hop(av);
      const b = row.querySelector(".bubble"); b.textContent = reply; b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
      made.insertAdjacentHTML("beforeend", `<div class="refine"><span class="chip">Make it greener</span><span class="chip">Red after 4 hours</span></div><span class="key">Save it</span>`);
      made.lastChild.onclick = () => saved(blk, av);
    }, 3100);
  }, 420);
}
function saved(blk, av) {
  burst(blk); hop(av);
  setTimeout(() => flyToTab(blk, () => { $("#badge").classList.add("show"); hop($("#tab-widgie")); toast("Saved. It's in your widgets."); }), 360);
}

// ---------- confetti, the flight into the tab bar, the toast ----------
const POPS = ["#3ecf8e", "#ffd23c", "#ff7f8e", "#a78bfa", "#ff9f5a", "#5ac8fa"];
function local(r) { const p = phone.getBoundingClientRect(); return { x: (r.left - p.left) / ZOOM, y: (r.top - p.top) / ZOOM, w: r.width / ZOOM, h: r.height / ZOOM }; }
function burst(el) {
  const r = local(el.getBoundingClientRect()), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const box = $("#confetti");
  box.innerHTML = Array.from({ length: 28 }, (_, i) => { const a = (i / 28) * Math.PI * 2; const d = 110 + (i % 5) * 24; return `<i style="left:${cx}px;top:${cy}px;background:${POPS[i % 6]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 70}px;--r:${(i % 2 ? 1 : -1) * (200 + i * 18)}deg"></i>`; }).join("");
  setTimeout(() => (box.innerHTML = ""), 1300);
}
function flyToTab(el, done) {
  const r = local(el.getBoundingClientRect()), t = local(document.querySelector('[data-tab="widgets"]').getBoundingClientRect());
  const copy = el.cloneNode(true);
  copy.classList.remove("popin", "press"); copy.classList.add("flyer");
  Object.assign(copy.style, { position: "absolute", left: r.x + "px", top: r.y + "px", margin: 0 });
  phone.appendChild(copy);
  el.style.visibility = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    copy.style.transform = `translate(${t.x + t.w / 2 - r.x - r.w / 2}px,${t.y + t.h / 2 - r.y - r.h / 2}px) scale(.1) rotate(-10deg)`;
    copy.style.opacity = ".2";
  }));
  setTimeout(() => { copy.remove(); done && done(); }, 820);
}
let toastTimer;
function toast(text) { $("#t-text").textContent = text; drawWidgie($("#t-widgie"), "jump", { eyes: "happy" }); const t = $("#toast"); t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400); }

// ---------- Templates: the landing page's widgets, by category ----------
const CATS = {
  two: { name: "For two", icon: "💞", bg: "linear-gradient(150deg,#ff8fa0,#f0607c)", line: "Little signals between the two of you.", actors: () => couple(), items: [["hearts", "Thinking of you", "A heart in one tap", -4], ["mood", "Our moods", "Swap faces through the day", 5], ["count", "Trip countdown", "Days until the big one", -2], ["days", "Days together", "Since your first date", 6], ["quest", "Today's question", "One a day, both answer", -3]] },
  home: { name: "Home", icon: "🏡", bg: "linear-gradient(150deg,#ff8a6b,#f05a48)", line: "Who fed the dog, whose turn, what's left to buy.", actors: () => single("lean", { mirror: "1" }, "🐶"), items: [["luna", "Pet fed", "Who fed them, and when", 4], ["bins", "Bins night", "Pass the turn along", -5], ["groc", "Shared groceries", "Cross it off for both", 2], ["plant", "Plant care", "Goes red when thirsty", -4], ["baby", "Baby feeds", "Red after three hours", 3], ["chores", "Chores scoreboard", "Winner picks the movie", -2]] },
  habits: { name: "Habits", icon: "🌱", bg: "linear-gradient(150deg,#5a3c98,#38206a)", line: "Tap today's square. That's the whole log.", actors: () => single("lean", { arm: "flex", mirror: "1" }), items: [["grid", "Habit squares", "Two weeks at a glance", -3], ["streak", "Streak", "Don't break the chain", 5], ["water", "Water", "Glasses toward a goal", -5], ["pushups", "Pushups", "A ring that fills up", 4]] },
  goals: { name: "Goals", icon: "🏅", bg: "linear-gradient(150deg,#ffd95a,#f6b820)", dark: 1, line: "Watch the jar fill and the days add up.", actors: () => single("jump", { eyes: "happy" }, "🏅"), items: [["savings", "Savings jar", "Every $50 counts", -2], ["sober", "Days free", "A medal at 60", 5], ["word", "Word of the day", "A new one each morning", -3]] },
};
let cat = "two";
const couple = () => `<div class="widgie sway" style="left:30px;top:40px;width:112px" data-a="lean" data-eyes="happy"></div><div class="widgie sway" style="left:82px;top:40px;width:112px;animation-delay:-2s" data-a="lean" data-mirror="1"></div><div style="position:absolute;left:100px;top:12px;font-size:28px;animation:twinkle 1.8s ease-in-out infinite">💗</div>`;
const single = (pose, extra, prop = "") => `<div class="widgie sway" style="left:50px;top:24px;width:140px" data-a="${pose}" ${Object.entries(extra).map(([k, v]) => `data-${k}="${v}"`).join(" ")}></div>${prop ? `<div style="position:absolute;left:26px;bottom:26px;font-size:34px">${prop}</div>` : ""}`;
function renderCats() {
  $("#cats").innerHTML = Object.entries(CATS).map(([k, c]) => `<span class="chip cat ${k === cat ? "on" : ""}" data-cat="${k}">${c.icon} ${c.name}</span>`).join("");
  for (const el of document.querySelectorAll(".cat")) el.onclick = () => { if (el.dataset.cat !== cat) { cat = el.dataset.cat; renderCats(); renderPile(true); } };
}
function renderPile(swap) {
  const c = CATS[cat];
  const fill = () => {
    const banner = $("#banner");
    banner.style.background = c.bg;
    banner.style.color = c.dark ? "#121a2e" : "#fff";
    $("#b-title").textContent = c.name;
    $("#b-line").textContent = c.line;
    $("#b-count").textContent = `${c.items.length} templates`;
    $("#actors").innerHTML = c.actors();
    for (const w of document.querySelectorAll("#actors .widgie")) { const extra = {}; for (const k of ["eyes", "mirror", "arm"]) if (w.dataset[k]) extra[k] = w.dataset[k]; drawWidgie(w, w.dataset.a, extra); }
    $("#pile").innerHTML = c.items.map(([w, name, sub, rot], i) => `<div class="item ${MEDIUM.has(w) ? "wide" : ""} rise" style="animation-delay:${.04 + i * .06}s" data-i="${i}">${tile(w, rot)}<div class="tname">${name}</div><div class="tsub">${sub}</div></div>`).join("");
    live($("#pile"));
    for (const it of document.querySelectorAll("#pile .item")) it.addEventListener("click", (e) => { if (!e.target.closest("[data-tap]")) openSheet(c.items[it.dataset.i]); });
  };
  if (!swap) return fill();
  for (const it of document.querySelectorAll("#pile .item")) it.classList.add("pop-out");
  setTimeout(fill, 200);
}
const BLANKS = { luna: ["Your pet's name", "Luna"], hearts: ["Who gets the hearts?", "Sam"], count: ["Where are you going?", "Lisbon"], plant: ["Your plant", "Monstera"], savings: ["Saving for", "Japan"], bins: ["Who's in the rota?", "Sam and you"], baby: ["Baby's name", "Mila"], mood: ["Your partner's name", "Sam"], days: ["Since when?", "June 4, 2023"], streak: ["The habit", "Meditate"], water: ["Glasses a day", "8"] };
function openSheet([w, name, sub]) {
  $("#s-title").textContent = name;
  $("#s-line").textContent = sub + ".";
  const [label, value] = BLANKS[w] || ["Call it", name];
  $("#s-label").textContent = label;
  $("#s-name").textContent = value;
  $("#s-stage").innerHTML = tile(w, 0, MEDIUM.has(w) ? 350 / 364 : 1.18);
  $("#s-stage").firstChild.style.position = "relative";
  live($("#s-stage"));
  $("#scrim").classList.add("show");
  $("#sheet").classList.add("show");
}
function closeSheet() { $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); }
$("#scrim").onclick = closeSheet;
$("#s-chat").onclick = () => { closeSheet(); setTimeout(() => go("make"), 260); };
$("#s-add").onclick = () => {
  const blk = $("#s-stage").firstChild;
  burst(blk);
  setTimeout(() => {
    flyToTab(blk, () => { $("#badge").classList.add("show"); toast(`${$("#s-title").textContent} is in your widgets.`); });
    setTimeout(closeSheet, 180);
  }, 240);
};

// ---------- tabs: pages slide toward the tab you picked ----------
function placePill() {
  const t = document.querySelector(`.tab[data-tab="${tab}"]`);
  const pill = $("#pill");
  pill.style.left = t.offsetLeft + 6 + "px";
  pill.style.width = t.offsetWidth - 12 + "px";
}
function go(next) {
  const to = ORDER.indexOf(next);
  if (next === "widgets") $("#badge").classList.remove("show");
  tab = next;
  for (const k of ORDER) {
    const page = $(`#p-${k}`);
    const i = ORDER.indexOf(k);
    page.classList.toggle("hidden", k !== next);
    page.classList.toggle("to-left", i < to);
    page.classList.toggle("to-right", i > to);
  }
  $("#composer").classList.toggle("hidden", next !== "make");
  for (const t of document.querySelectorAll(".tab")) t.classList.toggle("on", t.dataset.tab === next);
  placePill();
  if (next === "widgets") renderFeed();
  if (next === "tpl") renderPile(false);
  if (next === "make") { hop($("#tab-widgie")); makeReset(); }
}
for (const t of document.querySelectorAll("[data-tab]")) t.onclick = () => go(t.dataset.tab);
for (const b of document.querySelectorAll("[data-go]")) b.onclick = () => go(b.dataset.go);
for (const b of document.querySelectorAll("[data-time]")) b.onclick = () => {
  night = b.dataset.time === "night";
  for (const x of document.querySelectorAll("[data-time]")) x.classList.toggle("on", x === b);
  phone.classList.toggle("night", night);
  $("#w-hello").textContent = night ? "Good night" : "Good morning";
  drawWidgie($("#w-widgie"), "lean", { mirror: "1", shadow: "1" });
  drawWidgie($("#tab-widgie"), "lean");
  say($("#w-bubble"), night ? "I'll keep an eye on them while you sleep." : "Morning! Luna's waiting on breakfast.");
  if (tab === "tpl") renderPile(false);
  if (tab === "make") makeReset();
};

drawWidgie($("#w-widgie"), "lean", { mirror: "1", shadow: "1" });
drawWidgie($("#tab-widgie"), "lean");
renderCats();
go("widgets");
setTimeout(() => say($("#w-bubble"), "Morning! Luna's waiting on breakfast.", 3600), 900);
window.proto = { go, ask: (i) => ask(IDEAS[i]), openSheet: (i) => openSheet(CATS[cat].items[i]), setNight: (n) => document.querySelector(`[data-time="${n ? "night" : "day"}"]`).click(), say: () => say($("#w-bubble"), night ? "I'll keep an eye on them while you sleep." : "Morning! Luna's waiting on breakfast.", 0) };
})();
</script>
</body></html>
