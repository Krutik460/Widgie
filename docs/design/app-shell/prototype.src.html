<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widgie app prototype</title>
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,/*FONT*/) format("woff2-variations");font-weight:200 800;font-stretch:75% 100%}
:root{
 --ink:#121a2e;--ink-2:rgba(18,26,46,.64);--ink-3:rgba(18,26,46,.56);
 --sky-top:#b4d4fb;--sky:#9cc3f5;--sky-bottom:#8ab6f0;--sky-shade:#7aa6e2;
 --coral:#ff6b5c;--coral-shade:#e04a3d;--sun:#ffd23c;--sun-shade:#ecb514;--grape:#3b1f6e;--grape-shade:#2a1452;--moon:#e9f2ff;--blush:#ff7f8e;
 --surface:rgba(255,255,255,.88);--surface-text:#121a2e;--bubble:#fff;--bar:rgba(242,248,255,.84);
 --rest:0 1px 2px rgba(20,45,90,.06),0 4px 14px -4px rgba(20,45,90,.14);
 --lift:0 2px 6px rgba(20,45,90,.06),0 18px 36px -14px rgba(20,45,90,.38);
 --spring-ui:cubic-bezier(.22,1.06,.36,1);--spring-play:cubic-bezier(.32,1.38,.48,1);--soft:cubic-bezier(.22,.8,.26,1);
 --display:"Bricolage",-apple-system,system-ui,sans-serif;--text:-apple-system,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
 --unit:1px;--u:1px;--m:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);color:var(--foreground,#121a2e);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
/*SITE_CSS*/
/* ---------- the site's tiles, softened: no outline, no lip, a soft lifted shadow ---------- */
.blk::before{display:none}
.blk::after{transform:none!important;background:transparent;box-shadow:0 2px 6px rgba(20,45,90,.10),0 18px 32px -14px rgba(20,45,90,.48)}
.w{border:0!important}
.w-tap{border:0!important;box-shadow:0 4px 12px -2px rgba(0,0,0,.3)!important;transition:transform .28s var(--spring-play)!important}
.w-tap:active{transform:scale(.88)!important}
.w button,.w .pass,.w .who,.w .did,.w .in{box-shadow:none!important;border-width:0!important}
.count .w{background:linear-gradient(160deg,#f06f4c,#dc3e66)}
.count .w-small,.count .w-label{color:#fff;opacity:1}
/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{font:600 13px var(--text);padding:7px 12px;border-radius:9px;border:1.5px solid var(--border,#ccd);background:var(--card,#fff);color:var(--foreground,#123)}
.controls button.on{background:var(--foreground,#123);color:var(--background,#fff)}
.phone{--shade:var(--sky-shade);width:402px;height:874px;border-radius:58px;overflow:hidden;position:relative;color:var(--ink);font-family:var(--text);box-shadow:0 0 0 11px #0b0f1a,0 30px 60px rgba(0,0,0,.25);isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 45%,var(--sky-bottom) 100%);z-index:-3}
.sky.night{background:radial-gradient(90% 40% at 78% 4%,rgba(233,242,255,.16),transparent 70%),linear-gradient(180deg,#14284f 0%,#223f72 50%,#2b4e82 100%);opacity:0;transition:opacity .45s var(--soft)}
.phone.night .sky.night{opacity:1}
.clouds{position:absolute;inset:0 0 auto;height:260px;z-index:-2;pointer-events:none;transition:opacity .45s}
.clouds svg{position:absolute;filter:blur(4px);opacity:.5;animation:drift linear infinite}
.phone.night .clouds{opacity:.15}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(600px)}}
.stars{position:absolute;inset:0 0 60% 0;opacity:0;transition:opacity .45s;pointer-events:none;z-index:-2;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent);mask-image:linear-gradient(180deg,#000 50%,transparent)}
.phone.night .stars{opacity:1}
.stars i{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#e9f2ff;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
.topfade{position:absolute;inset:0 0 auto;height:66px;z-index:15;pointer-events:none;background:linear-gradient(180deg,var(--sky-top) 62%,rgba(180,212,251,0));transition:opacity .45s}
.topfade.night{background:none;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent);opacity:0}
.phone.night .topfade:not(.night){opacity:0}
.phone.night .topfade.night{opacity:1}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:10px 32px 0 50px;font:600 17px var(--text);letter-spacing:-.2px;z-index:20;color:var(--ink);transition:color .45s}
.status svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.3;z-index:35}
.night .homebar{background:#fff}
.night .status,.night .page{color:#fff}
.night{--ink-2:rgba(233,242,255,.74);--ink-3:rgba(233,242,255,.6);--surface:rgba(255,255,255,.11);--surface-text:#fff;--bubble:#eef4ff;--bar:rgba(18,34,66,.84);--rest:0 1px 2px rgba(0,6,20,.2),0 4px 14px -4px rgba(0,6,20,.4),inset 0 0 0 .5px rgba(255,255,255,.14);--lift:0 2px 6px rgba(0,6,20,.2),0 18px 36px -14px rgba(0,6,20,.7)}
.night .blk::after{box-shadow:0 2px 6px rgba(0,6,20,.3),0 18px 32px -12px rgba(0,6,20,.75),0 0 0 .5px rgba(255,255,255,.12)}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:62px var(--m) 140px;transition:opacity .22s ease-out,transform .28s var(--soft)}
.page::-webkit-scrollbar{display:none}
.page.hidden{opacity:0;pointer-events:none}
.page.hidden.to-left{transform:translateX(-14px)}
.page.hidden.to-right{transform:translateX(14px)}
.display{font-family:var(--display);font-weight:800;font-stretch:82%;letter-spacing:-.025em;line-height:.98}
.eyebrow{font:600 14px var(--text);color:var(--ink-2);letter-spacing:-.1px}
svg.i{width:15px;height:15px;flex:none}
/* ---------- Widgie ---------- */
.widgie{position:absolute;transform-origin:50% 92%}
.widgie .caret{position:static;display:block;width:100%}
.widgie.hop{animation:hop .72s}
@keyframes hop{0%{transform:none;animation-timing-function:cubic-bezier(.2,.85,.3,1)}12%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.2,.8,.4,1)}40%{transform:translateY(-30px) scale(.94,1.08);animation-timing-function:cubic-bezier(.6,0,.85,.45)}62%{transform:translateY(0) scale(1.06,.93);animation-timing-function:cubic-bezier(.3,.7,.4,1)}80%{transform:scale(.98,1.02)}100%{transform:none}}
.widgie.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.widgie.glance{animation:glance 1.4s var(--soft)}
@keyframes glance{30%,70%{transform:rotate(-7deg)}}
.widgie .eyes{transform-box:fill-box;transform-origin:center;animation:blinkeyes 4.6s infinite}
.widgie.blink2 .eyes{animation:blink2 .6s}
@keyframes blinkeyes{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes blink2{0%,40%,100%{transform:scaleY(1)}20%,60%{transform:scaleY(.08)}}
/* face crops: upright Widgie, the head peeking up from the bottom edge */
.avatar{position:relative;flex:none;width:36px;height:36px;border-radius:12px;background:linear-gradient(160deg,#d8e8fd,#b0cff7);overflow:hidden;box-shadow:var(--rest)}
.avatar .widgie{width:104px;height:104px;left:-34px;top:-4px}
.night .avatar{background:linear-gradient(160deg,#3a5d96,#284a7c)}
.fadeswap{animation:fadeswap .32s var(--soft)}
@keyframes fadeswap{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
/* ---------- speech ---------- */
.bubble{position:absolute;background:var(--bubble);color:#121a2e;border-radius:20px;padding:11px 15px;font:600 15px/1.32 var(--text);letter-spacing:-.15px;box-shadow:var(--lift);transform-origin:100% 30%;transition:transform .4s var(--spring-play),opacity .2s}
.bubble.right::after{content:"";position:absolute;right:-5px;top:16px;width:13px;height:13px;background:inherit;transform:rotate(45deg);border-radius:0 3px 0 0}
.bubble.gone{transform:scale(.7);opacity:0}
.bubble.pop{animation:bubblepop .45s var(--spring-play)}
@keyframes bubblepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
/* ---------- Widgets ---------- */
.top{position:relative;height:198px}
.top .eyebrow{position:absolute;left:0;top:6px}
.top h1{position:absolute;left:0;top:30px;font-size:40px}
.top .sub{position:absolute;left:0;top:80px;font:500 15px var(--text);color:var(--ink-2)}
.top .sub b{font-weight:650;color:var(--ink)}
.night .top .sub b{color:#fff}
.top .contact{position:absolute;right:30px;bottom:-6px;width:84px;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,26,46,.32),transparent);z-index:3}
.night .top .contact{background:radial-gradient(closest-side,rgba(0,6,20,.55),transparent)}
#w-widgie{right:8px;top:62px;width:142px;z-index:4}
#w-bubble{right:126px;top:118px;max-width:200px;z-index:4}
.feed{display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.row{display:flex;gap:14px}
.pin{display:flex;flex-direction:column;gap:9px}
.pin .blk{position:relative;flex:none;transition:transform .3s var(--spring-play)}
.pin .blk.press{transform:scale(.965)}
.cap{display:flex;align-items:center;gap:6px;padding:0 4px;min-height:20px}
.cap .name{font:600 14px var(--text);letter-spacing:-.15px}
.cap .home{margin-left:auto;height:20px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;gap:4px;font:600 11px var(--text);color:var(--ink-2);background:rgba(18,26,46,.07)}
.night .cap .home{background:rgba(255,255,255,.1)}
.cap .home svg{width:10px;height:10px}
.rise{animation:rise .42s var(--spring-ui) both}
@keyframes rise{0%{opacity:0;transform:translateY(18px) scale(.98)}100%{opacity:1;transform:none}}
.fresh .blk{animation:settle .9s var(--spring-play) both}
@keyframes settle{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
.fresh .cap .name::after{content:"New";margin-left:7px;font:700 11px var(--text);color:#fff;background:var(--coral);padding:2px 6px;border-radius:6px}
/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:26px;background:var(--bar);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.7);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;z-index:30;transition:background .45s}
.night .tabbar{box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.16)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px var(--text);letter-spacing:-.1px;color:var(--ink-3);transition:color .2s}
.tab.on{color:var(--ink)}
.night .tab.on{color:#fff}
.tab > svg{width:24px;height:24px;transition:transform .32s var(--spring-play)}
.tab:active > svg,.tab:active .makekey{transform:scale(.86)}
.tabpill{position:absolute;top:6px;height:56px;border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 1px 3px rgba(20,45,90,.1);transition:left .32s var(--spring-ui),width .32s var(--spring-ui)}
.night .tabpill{background:rgba(255,255,255,.14);box-shadow:none}
.makekey{position:relative;width:44px;height:28px;border-radius:10px;background:linear-gradient(165deg,#ffe479,#ffc532);box-shadow:0 5px 12px -4px rgba(214,150,0,.6),inset 0 1px 0 rgba(255,255,255,.7);overflow:hidden;transition:transform .32s var(--spring-play)}
.tab.on .makekey{transform:scale(1.04) translateY(-1px)}
.makekey .widgie{width:78px;height:78px;left:-17px;top:0}
.badge{position:absolute;top:2px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font:700 11px var(--text);display:grid;place-items:center;box-shadow:0 3px 8px rgba(224,74,61,.5);transform:scale(0);transition:transform .45s var(--spring-play)}
.badge.show{transform:scale(1)}
/* ---------- controls ---------- */
.chip{height:40px;padding:0 14px;border-radius:13px;display:inline-flex;align-items:center;gap:6px;font:600 14px var(--text);letter-spacing:-.15px;color:var(--surface-text);background:var(--surface);box-shadow:var(--rest);transition:transform .3s var(--spring-play),background .2s,color .2s;white-space:nowrap}
.chip:active{transform:scale(.94)}
.key{height:52px;padding:0 22px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:700 17px var(--display);font-stretch:92%;letter-spacing:-.01em;box-shadow:0 12px 24px -10px rgba(18,26,46,.65);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease-out,box-shadow .12s}
.key::after{content:"";width:3px;height:19px;border-radius:2px;background:#9cc3f5;animation:blink 1.06s steps(1) infinite}
.key:hover{border:0;transform:none;box-shadow:0 12px 24px -10px rgba(18,26,46,.65)}
.key:active{border:0;transform:scale(.97);box-shadow:0 6px 14px -6px rgba(18,26,46,.5)}
.key.quiet{background:rgba(18,26,46,.07);color:var(--ink);box-shadow:none;font:600 15px var(--text);letter-spacing:-.15px}
.key.quiet::after{display:none}
.night .key:not(.quiet){background:#fff;color:#121a2e}
.night .key:not(.quiet)::after{background:#121a2e}
.night .key.quiet{background:rgba(255,255,255,.12);color:#fff}
/* ---------- Make ---------- */
#p-make{display:flex;flex-direction:column;padding-bottom:196px}
.hello{margin-top:auto;display:flex;flex-direction:column}
.make-hello{position:relative;height:236px}
.make-hello .ground{position:absolute;left:236px;top:214px;width:110px;height:13px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,26,46,.22),transparent)}
.night .make-hello .ground{background:radial-gradient(closest-side,rgba(0,6,20,.45),transparent)}
#m-widgie{left:218px;top:52px;width:170px}
#m-bubble{left:0;top:64px;width:208px}
.ideas{display:flex;flex-direction:column;gap:10px}
.ideas .eyebrow{margin:0 4px 2px}
.idea{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);color:var(--surface-text);box-shadow:var(--rest);transition:transform .3s var(--spring-play);text-align:left;width:100%}
.idea:active{transform:scale(.97)}
.idea .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.idea .ic svg{width:20px;height:20px}
.idea .t{font:600 16px var(--text);letter-spacing:-.2px}
.idea .s{font:500 13px var(--text);color:var(--ink-2);margin-top:1px}
.idea .chev{margin-left:auto;color:var(--ink-3)}
.composer{position:absolute;left:var(--m);right:var(--m);bottom:108px;z-index:25;min-height:60px;border-radius:20px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--lift);display:flex;align-items:center;gap:8px;padding:8px;transition:opacity .22s ease-out,transform .32s var(--spring-ui)}
.night .composer{background:rgba(20,38,72,.78)}
.composer.hidden{opacity:0;transform:translateY(14px);pointer-events:none}
.composer .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:rgba(18,26,46,.06);flex:none}
.night .composer .icon{background:rgba(255,255,255,.1);color:#fff}
.composer input{flex:1;min-width:0;height:44px;font:500 17px var(--text);letter-spacing:-.2px;color:var(--ink);caret-color:var(--ink);cursor:text}
.night .composer input{color:#fff;caret-color:#fff}
.composer input::placeholder{color:var(--ink-3)}
.composer .send{width:44px;height:44px;border-radius:14px;background:rgba(18,26,46,.12);color:#fff;display:grid;place-items:center;flex:none;transition:background .2s,transform .3s var(--spring-play)}
.composer .send.ready{background:var(--ink)}
.composer .send:active{transform:scale(.9)}
.night .composer .send{background:rgba(255,255,255,.16)}
.night .composer .send.ready{background:#fff;color:#121a2e}
.thread{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.me{align-self:flex-end;max-width:262px;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 15px;font:600 15.5px/1.32 var(--text);letter-spacing:-.15px;box-shadow:0 10px 20px -10px rgba(18,26,46,.6);animation:slidein .45s var(--spring-ui) both}
.night .me{background:#fff;color:#121a2e}
@keyframes slidein{0%{opacity:0;transform:translateY(18px) scale(.94)}100%{opacity:1;transform:none}}
.them{display:flex;gap:9px;align-items:flex-end;animation:slidein .45s var(--spring-ui) both}
.them .bubble{position:relative;max-width:262px;border-bottom-left-radius:6px;transform-origin:0 100%}
.dots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:#121a2e;animation:dot 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.studio{position:relative;align-self:center;margin:56px 0 4px}
.studio svg.sk{position:absolute;inset:0;overflow:visible}
.studio .edge{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:trace 2.6s var(--soft) forwards}
.studio .part{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 5;opacity:.45;animation:solid .4s var(--soft) forwards}
.night .studio .edge,.night .studio .part{stroke:#e9f2ff}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes solid{to{fill:currentColor;stroke-dasharray:none;opacity:.9}}
.studio .art{color:var(--ink)}
.night .studio .art{color:#e9f2ff}
.studio .pen{position:absolute;left:0;top:0;width:104px;z-index:3;offset-anchor:22% 94%;offset-rotate:0deg;animation:ride 2.6s var(--soft) forwards}
@keyframes ride{from{offset-distance:0%}to{offset-distance:100%}}
.studio .blk{position:absolute!important;left:0;top:0}
.studio .perch{position:absolute;width:104px;z-index:3;transition:left .5s var(--spring-play),top .5s var(--spring-play)}
.popin{animation:popin .7s var(--spring-play) both}
@keyframes popin{0%{transform:scale(.86);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
.after{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:22px;animation:rise .42s .2s var(--spring-ui) both}
.refine{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;width:7px;height:20px;border-radius:4px;animation:burst 1.1s cubic-bezier(.15,.75,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6);opacity:0}}
.flyer{position:absolute;z-index:70;pointer-events:none;transition:transform .48s cubic-bezier(.5,-.15,.6,1),opacity .48s}
/* ---------- Templates ---------- */
.tpl-head{padding:6px 0 14px}
.tpl-head h1{font-size:40px;margin-top:6px}
.cats{display:flex;gap:6px;padding:2px 0 16px}
.cat{height:40px;padding:0 11px;font-size:13.5px;border-radius:12px}
.cat svg{width:15px;height:15px}
.cat.on{background:var(--ink);color:#fff;box-shadow:0 10px 18px -10px rgba(18,26,46,.7)}
.night .cat.on{background:#fff;color:#121a2e}
.banner{position:relative;height:166px;border-radius:28px;margin-bottom:26px;overflow:hidden;color:#fff;padding:20px 22px;box-shadow:var(--lift);transition:background .4s var(--soft)}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 85% 100%,rgba(255,255,255,.22),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%);pointer-events:none}
.banner h2{position:relative;font-size:40px}
.banner p{position:relative;font:600 15px/1.32 var(--text);margin-top:8px;max-width:172px}
.banner .count{position:absolute;left:22px;bottom:18px;font:650 13px var(--text);padding:5px 10px;border-radius:9px;background:rgba(18,26,46,.22)}
.banner.dark .count{background:rgba(18,26,46,.12)}
.banner .actors{position:absolute;right:4px;bottom:-6px;width:196px;height:166px}
.beat{animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}}
.pile{display:grid;grid-template-columns:1fr 1fr;column-gap:14px;row-gap:28px}
.pile .item{display:flex;flex-direction:column;gap:12px;text-align:left}
.pile .item.wide{grid-column:span 2}
.pile .blk{position:relative;transform:rotate(var(--rot,0deg)) scale(.97);transition:transform .16s ease-out}

<script>
(() => {
const $ = (s) => document.querySelector(s);
const phone = $("#phone");
const ZOOM = 0.8;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let night = false, tab = "widgets";
const ORDER = ["widgets", "make", "tpl"];

// ---------- Widgie: the site's caret, wrapped so it can hop, sway and change pose ----------
// `moon: "0"` keeps the ink Widgie at night, for the sun key and the yellow banner.
function drawWidgie(el, pose = "idle", extra = {}) {
  el.innerHTML = `<span class="caret" data-pose="${pose}"></span>`;
  const c = el.firstChild;
  Object.assign(c.dataset, extra);
  if (night && extra.moon !== "0") c.dataset.moon = "1";
  mountCaret(c);
}
function play(el, cls, ms) { el.classList.remove("hop", "sway", "glance", "blink2"); void el.offsetWidth; el.classList.add(cls); setTimeout(() => { el.classList.remove(cls); el.classList.add("sway"); }, ms); }
const hop = (el) => play(el, "hop", 740);
function say(el, words, stay = 0) {
  el.textContent = words;
  el.classList.remove("gone", "pop"); void el.offsetWidth; el.classList.add("pop");
  clearTimeout(el._t);
  if (stay) el._t = setTimeout(() => el.classList.add("gone"), stay);
}

// sky: two soft clouds up high, and stars at night
const cloud = (w) => `<svg width="${w}" height="${w * .42}" viewBox="0 0 100 42"><g fill="#fff"><ellipse cx="30" cy="30" rx="26" ry="12"/><ellipse cx="52" cy="22" rx="22" ry="17"/><ellipse cx="72" cy="30" rx="22" ry="11"/></g></svg>`;
$("#clouds").innerHTML = [[150, 56, 90, -30], [110, 150, 120, -80]].map(([w, top, dur, del]) => cloud(w).replace("<svg", `<svg style="top:${top}px;animation-duration:${dur}s;animation-delay:${del}s"`)).join("");
$("#stars").innerHTML = Array.from({ length: 26 }, (_, i) => `<i style="left:${(i * 47) % 392 + 5}px;top:${(i * 61) % 320 + 48}px;animation-delay:-${(i % 9) * .38}s;opacity:${.5 + (i % 4) * .15}"></i>`).join("");

// ---------- tiles ----------
const SMALL = 174 / 170, WIDE = 362 / 364;
function tile(w, rot = 0, k) {
  const wide = MEDIUM.has(w);
  return `<div class="blk ${wide ? "m" : ""}" data-widget="${w}" style="--u:${k ?? (wide ? WIDE : SMALL)}px;--rot:${rot}deg"></div>`;
}
function live(root, onTap) {
  for (const el of root.querySelectorAll("[data-widget]:not([data-live])")) {
    el.dataset.live = "1";
    mountWidget(el);
    el.addEventListener("pointerdown", () => el.classList.add("press"));
    for (const e of ["pointerup", "pointerleave", "pointercancel"]) el.addEventListener(e, () => el.classList.remove("press"));
    if (onTap) el.addEventListener("click", (e) => { if (e.target.closest("[data-tap]")) onTap(el); });
  }
}
const svg = (s, cls = "i") => s.replace("<svg", `<svg class="${cls}"`);

// ---------- Widgets: wide ones fill a row, smalls pair up (the app's FeedRow rule) ----------
const HOME = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.8 11h2.7v9.3h5V15h3v5.3h5V11h2.7z"/></svg>';
const items = [["count", "Lisbon trip", 1], ["luna", "Luna", 1], ["hearts", "Hearts", 1], ["groc", "Groceries", 1], ["streak", "Meditate", 0], ["water", "Water", 1], ["savings", "Japan fund", 0], ["plant", "Monstera", 1], ["sober", "Alcohol-free", 0]].map(([w, name, placed]) => ({ w, name, placed, id: w }));
function rows(list) {
  const out = []; let wait = null;
  for (const it of list) {
    if (MEDIUM.has(it.w)) {
      if (wait) { if (wait.passed === 1) { out.splice(wait.at, 0, [wait.it]); wait = null; } else wait.passed++; }
      out.push([it]);
    } else if (wait) { out.push([wait.it, it]); wait = null; }
    else wait = { it, at: out.length, passed: 0 };
  }
  if (wait) out.splice(wait.at, 0, [wait.it]);
  return out;
}
const pin = (it) => `<div class="pin ${it.fresh ? "fresh" : ""}">${tile(it.w)}<div class="cap"><span class="name">${it.name}</span>${it.placed ? `<span class="home">${HOME}Home</span>` : ""}</div></div>`;
const NOTES = { luna: "Luna's fed. Good girl.", hearts: "Heart sent. Sam will see it.", groc: "Crossed off, for both of you.", water: "One more glass. Nice.", streak: "Day 13. Keep it going!", plant: "Watered. Monstera says thanks.", savings: "$50 closer to Japan." };
function subline() { $("#w-sub").innerHTML = `<b>${items.length} widgets</b>, ${items.filter((i) => i.placed).length} on your home screen`; }
let feedDrawn = false;
function renderFeed() {
  const first = !feedDrawn; feedDrawn = true;
  $("#feed").innerHTML = rows(items).map((r, i) => `<div class="row ${first ? "rise" : ""}" style="animation-delay:${i * .05}s">${r.map(pin).join("")}</div>`).join("");
  live($("#feed"), (el) => {
    const note = NOTES[el.dataset.widget];
    if ($("#p-widgets").scrollTop > 140 || !note) return;
    hop($("#w-widgie")); say($("#w-bubble"), note, 3200);
  });
  subline();
  for (const it of items) it.fresh = false;
}
function addToFeed(w, name) {
  items.unshift({ w, name, placed: 0, id: w + Math.random(), fresh: true });
  renderFeed();
}

// ---------- Make: Widgie draws your widget with its tip ----------
const IDEAS = [[svg(icon.paw), "#ffe7c2", "#9a5500", "When was the dog fed?", "Who fed them, and how long ago", "luna", "Luna", "Here's Luna's. Tap the check to try it."], [svg(icon.plane), "#ffd8d2", "#b83226", "Days until our trip", "A countdown with the date", "count", "Lisbon trip", "Counting down to Lisbon. Want another date?"], [svg(icon.heart), "#ffd6e0", "#b82552", "A heart button for Sam", "One tap sends a heart", "hearts", "Hearts", "One tap sends Sam a heart. Try it!"]];
function makeReset() {
  $("#p-make").innerHTML = `<div class="hello"><div class="make-hello"><div class="ground"></div><div class="widgie sway" id="m-widgie"></div><div class="bubble right pop" id="m-bubble">Hi! What should we make? Say it your way.</div></div>
   <div class="ideas"><div class="eyebrow">Or start from one of these</div>${IDEAS.map(([ic, bg, fg, t, s], i) => `<button class="idea rise" data-i="${i}" style="animation-delay:${.08 + i * .05}s"><span class="ic" style="background:${bg};color:${fg}">${ic}</span><span><div class="t">${t}</div><div class="s">${s}</div></span><svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5l6 6-6 6"/></svg></button>`).join("")}</div></div>`;
  drawWidgie($("#m-widgie"), "lean", { mirror: "1" });
  for (const el of document.querySelectorAll(".idea")) el.onclick = () => ask(IDEAS[el.dataset.i]);
}
function pick(words) {
  const t = words.toLowerCase();
  if (/trip|days|until|countdown|holiday/.test(t)) return IDEAS[1];
  if (/heart|love|miss|partner/.test(t)) return IDEAS[2];
  return IDEAS[0];
}
$("#say").addEventListener("input", () => $("#send").classList.toggle("ready", $("#say").value.trim() !== ""));
$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const words = $("#say").value.trim();
  if (!words) return;
  $("#say").value = ""; $("#send").classList.remove("ready");
  const idea = pick(words);
  ask([...idea.slice(0, 3), words, ...idea.slice(4)]);
});
// The outline Widgie traces: from the bottom of the left side, up and clockwise, so most of the ride is on top.
function outline(w, h, r = 24) {
  return `M0 ${h - r} L0 ${r} A${r} ${r} 0 0 1 ${r} 0 L${w - r} 0 A${r} ${r} 0 0 1 ${w} ${r} L${w} ${h - r} A${r} ${r} 0 0 1 ${w - r} ${h} L${r} ${h} A${r} ${r} 0 0 1 0 ${h - r}`;
}
let building = false;
function ask([, , , words, , w, name, reply]) {
  if (building) return;
  building = true;
  const wide = MEDIUM.has(w), W = wide ? 362 : 174, H = 174;
  const page = $("#p-make");
  page.innerHTML = `<div class="thread"><div class="me">${words}</div></div>`;
  const list = page.firstChild;
  setTimeout(() => {
    list.insertAdjacentHTML("beforeend", `<div class="them"><div class="avatar"><div class="widgie"></div></div><div class="bubble">Writing your widget<span class="dots"><i></i><i></i><i></i></span></div></div>`);
    const row = list.lastChild, av = row.querySelector(".widgie"), bubble = row.querySelector(".bubble");
    drawWidgie(av, "idle");
    const d = outline(W, H);
    const parts = [[18, 22, 64, 12, 6, .55], [18, 50, wide ? 118 : 96, 40, 10, .7], [18, H - 52, 34, 34, 17, 1.05], [W - 60, H - 60, 42, 42, 21, 1.6]];
    list.insertAdjacentHTML("beforeend", `<div class="studio" style="width:${W}px;height:${H}px"><svg class="sk" viewBox="0 0 ${W} ${H}"><path class="edge" d="${d}" pathLength="1"/><g class="art">${parts.map(([x, y, pw, ph, rr, delay]) => `<rect class="part" x="${x}" y="${y}" width="${pw}" height="${ph}" rx="${rr}" style="animation-delay:${delay}s"/>`).join("")}</g></svg><div class="widgie pen" style="offset-path:path('${d}')"></div></div>`);
    const studio = list.lastChild, pen = studio.querySelector(".pen");
    drawWidgie(pen, "draw");
    const reveal = () => {
      studio.querySelector("svg").remove();
      studio.insertAdjacentHTML("afterbegin", tile(w));
      const blk = studio.firstChild;
      blk.classList.add("popin");
      live(studio);
      // Off the pen's path and onto the widget's top edge, happy.
      const perch = document.createElement("div");
      perch.className = "widgie perch";
      perch.style.left = -22 + "px"; perch.style.top = H - 98 + "px";
      pen.replaceWith(perch);
      drawWidgie(perch, "jump", { eyes: "happy" });
      requestAnimationFrame(() => requestAnimationFrame(() => { perch.style.left = W - 84 + "px"; perch.style.top = -94 + "px"; }));
      setTimeout(() => hop(perch), 420);
      drawWidgie(av, "idle", { eyes: "happy" });
      bubble.textContent = reply; bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
      list.insertAdjacentHTML("beforeend", `<div class="after"><div class="refine"><button class="chip">Make it greener</button><button class="chip">Red after 4 hours</button></div><button class="key">Save it</button></div>`);
      list.lastChild.querySelector(".key").onclick = () => saved(blk, perch, w, name);
      page.scrollTo({ top: page.scrollHeight, behavior: calm ? "auto" : "smooth" });
    };
    setTimeout(reveal, calm ? 300 : 2750);
  }, 380);
}
function saved(blk, perch, w, name) {
  burst(blk); hop(perch);
  setTimeout(() => flyToTab(blk, () => {
    $("#badge").classList.add("show"); hop($("#tab-widgie"));
    addToFeed(w, name);
    toast(`${name} is in your widgets.`);
    building = false;
    setTimeout(makeReset, 600);
  }), calm ? 0 : 260);
}

// ---------- confetti, the flight into the tab bar, the toast ----------
const POPS = ["#3ecf8e", "#ffd23c", "#ff7f8e", "#a78bfa", "#ff9f5a", "#5ac8fa"];
function local(r) { const p = phone.getBoundingClientRect(); return { x: (r.left - p.left) / ZOOM, y: (r.top - p.top) / ZOOM, w: r.width / ZOOM, h: r.height / ZOOM }; }
function burst(el) {
  if (calm) return;
  const r = local(el.getBoundingClientRect()), cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const box = $("#confetti");
  box.innerHTML = Array.from({ length: 26 }, (_, i) => { const a = (i / 26) * Math.PI * 2; const d = 100 + (i % 5) * 22; return `<i style="left:${cx}px;top:${cy}px;background:${POPS[i % 6]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 60}px;--r:${(i % 2 ? 1 : -1) * (200 + i * 18)}deg"></i>`; }).join("");
  setTimeout(() => (box.innerHTML = ""), 1200);
}
function flyToTab(el, done) {
  if (calm) { el.style.opacity = ".4"; return done(); }
  const r = local(el.getBoundingClientRect()), t = local(document.querySelector('[data-tab="widgets"]').getBoundingClientRect());
  const copy = el.cloneNode(true);
  copy.classList.remove("popin", "press"); copy.classList.add("flyer");
  Object.assign(copy.style, { position: "absolute", left: r.x + "px", top: r.y + "px", margin: 0, transform: "none" });
  phone.appendChild(copy);
  el.style.visibility = "hidden";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    copy.style.transform = `translate(${t.x + t.w / 2 - r.x - r.w / 2}px,${t.y + t.h / 2 - r.y - r.h / 2}px) scale(.1) rotate(-10deg)`;
    copy.style.opacity = ".2";
  }));
  setTimeout(() => { copy.remove(); done && done(); }, 500);
}
function toast(text) { $("#t-text").textContent = text; drawWidgie($("#t-widgie"), "idle", { eyes: "happy" }); const t = $("#toast"); t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2400); }

// ---------- Templates: the landing page's widgets, by category ----------
const CATS = {
  two: { name: "For two", icon: icon.heart, bg: "linear-gradient(150deg,#f2587c,#d63a62)", line: "Little signals between the two of you.", actors: () => couple(), items: [["hearts", "Thinking of you", "A heart in one tap"], ["mood", "Our moods", "Swap faces all day"], ["count", "Trip countdown", "Days until the big one"], ["days", "Days together", "Since your first date"], ["quest", "Today's question", "One a day, both answer"]] },
  home: { name: "Home", icon: HOME, bg: "linear-gradient(150deg,#f0644f,#d9452f)", line: "Who fed the dog, whose turn, what's left to buy.", actors: () => single("lean", { mirror: "1" }, `<div style="position:absolute;left:10px;bottom:14px;width:70px">${puppy(false)}</div>`), items: [["luna", "Pet fed", "Who fed them, and when"], ["bins", "Bins night", "Pass the turn along"], ["groc", "Shared groceries", "Cross it off for both"], ["plant", "Plant care", "Goes red when thirsty"], ["baby", "Baby feeds", "Red after three hours"], ["chores", "Chores scoreboard", "Winner picks the movie"]] },
  habits: { name: "Habits", icon: icon.leaf, bg: "linear-gradient(150deg,#5a3c98,#38206a)", line: "Tap today's square. That's the whole log.", actors: () => single("lean", { arm: "flex", mirror: "1" }), items: [["grid", "Habit squares", "Two weeks at a glance"], ["streak", "Streak", "Don't break the chain"], ["water", "Water", "Glasses toward a goal"], ["pushups", "Pushups", "A ring that fills up"]] },
  goals: { name: "Goals", icon: icon.spark, bg: "linear-gradient(150deg,#ffd95a,#f6b820)", dark: 1, line: "Watch the jar fill and the days add up.", actors: () => single("jump", { eyes: "happy", moon: "0" }, `<div style="position:absolute;left:18px;bottom:20px;width:44px">${MEDAL}</div>`), items: [["savings", "Savings jar", "Every $50 counts"], ["sober", "Days free", "A medal at 60"], ["word", "Word of the day", "A new one each morning"]] },
};
let cat = "two";
const couple = () => `<div class="widgie sway" style="left:30px;top:36px;width:112px" data-a="lean" data-eyes="happy"></div><div class="widgie sway" style="left:82px;top:36px;width:112px;animation-delay:-2s" data-a="lean" data-mirror="1"></div><div class="beat" style="position:absolute;left:104px;top:14px;width:24px;height:24px;color:#fff">${icon.heart}</div>`;
const single = (pose, extra, prop = "") => `<div class="widgie sway" style="left:56px;top:20px;width:140px" data-a="${pose}" ${Object.entries(extra).map(([k, v]) => `data-${k}="${v}"`).join(" ")}></div>${prop}`;
function renderCats() {
  $("#cats").innerHTML = Object.entries(CATS).map(([k, c]) => `<button class="chip cat ${k === cat ? "on" : ""}" data-cat="${k}">${svg(c.icon)}${c.name}</button>`).join("");
  for (const el of document.querySelectorAll(".cat")) el.onclick = () => { if (el.dataset.cat !== cat) { cat = el.dataset.cat; renderCats(); renderPile(true); } };
}
function renderPile(swap) {
  const c = CATS[cat];
  const fill = () => {
    const banner = $("#banner");
    banner.style.background = c.bg;
    banner.style.color = c.dark ? "#121a2e" : "#fff";
    banner.classList.toggle("dark", !!c.dark);
    $("#b-title").textContent = c.name;
    $("#b-line").textContent = c.line;
    $("#b-count").textContent = `${c.items.length} templates`;
    $("#actors").innerHTML = c.actors();
    for (const w of document.querySelectorAll("#actors .widgie")) { const extra = {}; for (const k of ["eyes", "mirror", "arm", "moon"]) if (w.dataset[k]) extra[k] = w.dataset[k]; drawWidgie(w, w.dataset.a, extra); }
    // Small tiles lean up to 2.5 degrees, wide ones 1, alternating, so the pile reads as handled but stays in the gutters.
    $("#pile").innerHTML = c.items.map(([w, name, sub], i) => { const rot = (i % 2 ? 1 : -1) * (MEDIUM.has(w) ? 1 : [2.5, 2, 1.5][i % 3]); return `<button class="item ${MEDIUM.has(w) ? "wide" : ""} rise" style="animation-delay:${i * .05}s" data-i="${i}">${tile(w, rot)}<div class="tmeta"><div class="tname">${name}</div><div class="tsub">${sub}</div></div></button>`; }).join("");
    live($("#pile"));
    for (const it of document.querySelectorAll("#pile .item")) it.onclick = () => openSheet(c.items[it.dataset.i]);
  };
  if (!swap) return fill();
  for (const it of document.querySelectorAll("#pile .item")) it.classList.add("pop-out");
  setTimeout(fill, 180);
}
const BLANKS = { luna: ["Your pet's name", "Luna"], hearts: ["Who gets the hearts?", "Sam"], count: ["Where are you going?", "Lisbon"], plant: ["Your plant", "Monstera"], savings: ["Saving for", "Japan"], bins: ["Who's in the rota?", "Sam"], baby: ["Who's on feeds with you?", "Sam"], mood: ["Your partner's name", "Sam"], streak: ["The habit", "Meditate"], chores: ["Who are you up against?", "Sam"], quest: ["Your partner's name", "Sam"] };
let sheetItem = null, shownName = "";
// The name in the live preview follows the field, by swapping the text it shows.
function rename(root, from, to) {
  if (!from || from === to) return;
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.nodeValue.includes(from)) n.nodeValue = n.nodeValue.split(from).join(to);
}
function openSheet(item) {
  sheetItem = item;
  const [w, name, sub] = item;
  $("#s-title").textContent = name;
  $("#s-line").textContent = sub + ".";
  const [label, value] = BLANKS[w] || ["Call it", name];
  $("#s-label").textContent = label;
  $("#s-name").value = value; shownName = value;
  $("#s-stage").innerHTML = tile(w, 0, MEDIUM.has(w) ? 350 / 364 : 1.16);
  $("#s-stage").firstChild.style.position = "relative";
  live($("#s-stage"));
  $("#scrim").classList.add("show");
  $("#sheet").classList.add("show");
}
$("#s-name").addEventListener("input", () => { const v = $("#s-name").value.trim() || (BLANKS[sheetItem[0]] || [, sheetItem[1]])[1]; rename($("#s-stage"), shownName, v); shownName = v; });
function closeSheet() { $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); $("#s-name").blur(); }
$("#scrim").onclick = closeSheet;
$("#s-close").onclick = closeSheet;
$("#s-chat").onclick = () => { closeSheet(); setTimeout(() => { go("make"); $("#say").value = `Change my ${sheetItem[1].toLowerCase()} widget: `; $("#send").classList.add("ready"); $("#say").focus(); }, 240); };
$("#s-add").onclick = () => {
  const blk = $("#s-stage").firstChild, [w, name] = sheetItem;
  const label = BLANKS[w] ? shownName : name;
  burst(blk);
  setTimeout(() => {
    flyToTab(blk, () => { $("#badge").classList.add("show"); addToFeed(w, w === "luna" ? shownName : name); toast(`${name} is in your widgets.`); });
    setTimeout(closeSheet, 160);
  }, calm ? 0 : 200);
  void label;
};

// ---------- tabs: each page renders once and keeps its state; switching is a quick slide ----------
function placePill() {
  const t = document.querySelector(`.tab[data-tab="${tab}"]`);
  const pill = $("#pill");
  pill.style.left = t.offsetLeft + "px";
  pill.style.width = t.offsetWidth + "px";
}
function go(next) {
  const to = ORDER.indexOf(next);
  if (next === "widgets") $("#badge").classList.remove("show");
  if (next === "make" && tab !== "make") hop($("#tab-widgie"));
  tab = next;
  for (const k of ORDER) {
    const page = $(`#p-${k}`), i = ORDER.indexOf(k);
    page.classList.toggle("hidden", k !== next);
    page.classList.toggle("to-left", i < to);
    page.classList.toggle("to-right", i > to);
  }
  $("#composer").classList.toggle("hidden", next !== "make");
  for (const t of document.querySelectorAll(".tab")) t.classList.toggle("on", t.dataset.tab === next);
  placePill();
}
for (const t of document.querySelectorAll("[data-tab]")) t.onclick = () => go(t.dataset.tab);
for (const b of document.querySelectorAll("[data-go]")) b.onclick = () => go(b.dataset.go);
function redrawCast() {
  for (const el of [$("#w-widgie"), $("#m-widgie")].filter(Boolean)) { el.classList.remove("fadeswap"); void el.offsetWidth; el.classList.add("fadeswap"); }
  drawWidgie($("#w-widgie"), "lean", { mirror: "1" });
  if ($("#m-widgie")) drawWidgie($("#m-widgie"), "lean", { mirror: "1" });
  drawWidgie($("#tab-widgie"), "idle", { moon: "0" });
  for (const a of document.querySelectorAll(".avatar .widgie")) drawWidgie(a, "idle", { eyes: "happy" });
}
for (const b of document.querySelectorAll("[data-time]")) b.onclick = () => {
  night = b.dataset.time === "night";
  for (const x of document.querySelectorAll("[data-time]")) x.classList.toggle("on", x === b);
  phone.classList.toggle("night", night);
  $("#w-hello").textContent = night ? "Good evening" : "Good morning";
  redrawCast();
  say($("#w-bubble"), night ? "I'll keep an eye on them tonight." : "Morning! Luna's waiting on breakfast.");
  renderPile(false);
};

// Widgie's idle life on Widgets: a double blink, a glance at your widgets, or a little hop, every 8 to 11 seconds.
function idle() {
  const w = $("#w-widgie");
  if (tab === "widgets" && !calm) { const n = Math.floor(Date.now() / 1000) % 3; if (n === 0) play(w, "blink2", 640); else if (n === 1) play(w, "glance", 1420); else hop(w); }
  setTimeout(idle, 8000 + (Date.now() % 3000));
}

redrawCast();
renderFeed();
makeReset();
renderCats();
renderPile(false);
go("widgets");
setTimeout(() => say($("#w-bubble"), "Morning! Luna's waiting on breakfast."), 700);
setTimeout(idle, 9000);
window.proto = {
  go, ask: (i) => ask(IDEAS[i]), openSheet: (i) => openSheet(CATS[cat].items[i]),
  setNight: (n) => document.querySelector(`[data-time="${n ? "night" : "day"}"]`).click(),
  say: () => say($("#w-bubble"), night ? "I'll keep an eye on them tonight." : "Morning! Luna's waiting on breakfast."),
  cat: (k) => document.querySelector(`.cat[data-cat="${k}"]`).click(),
  add: (w, n) => addToFeed(w, n),
};
})();
</script>
</body></html>
