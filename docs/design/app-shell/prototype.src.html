<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widgie app prototype</title>
<style>
@font-face{font-family:"Bricolage";src:url(data:font/woff2;base64,/*FONT*/) format("woff2-variations");font-weight:200 800;font-stretch:75% 100%}
:root{
 --ink:#121a2e;--ink-2:rgba(18,26,46,.74);--ink-3:rgba(18,26,46,.64);
 --sky-top:#b4d4fb;--sky:#9cc3f5;--sky-bottom:#8ab6f0;--sky-shade:#7aa6e2;
 --coral:#ff6b5c;--coral-shade:#e04a3d;--sun:#ffd23c;--sun-shade:#ecb514;--grape:#3b1f6e;--grape-shade:#2a1452;--moon:#e9f2ff;--blush:#ff7f8e;
 --surface:rgba(255,255,255,.88);--surface-text:#121a2e;--bubble:#fff;--bar:rgba(244,249,255,.9);
 --rest:0 1px 2px rgba(20,45,90,.06),0 4px 14px -4px rgba(20,45,90,.14);
 --lift:0 2px 6px rgba(20,45,90,.06),0 18px 36px -14px rgba(20,45,90,.38);
 --spring-ui:cubic-bezier(.22,1.06,.36,1);--spring-play:cubic-bezier(.32,1.38,.48,1);--soft:cubic-bezier(.22,.8,.26,1);
 --display:"Bricolage",-apple-system,system-ui,sans-serif;--text:-apple-system,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
 --unit:1px;--u:1px;--m:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);color:var(--foreground,#121a2e);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
button:focus-visible,input:focus-visible,.namefield:focus-within{outline:2px solid #2f6fe4;outline-offset:3px}
/*SITE_CSS*/
/* ---------- the site's tiles, softened: no outline, no lip, a soft lifted shadow ---------- */
.blk::before{display:none}
.blk::after{transform:none!important;background:transparent;box-shadow:0 2px 6px rgba(20,45,90,.10),0 18px 32px -14px rgba(20,45,90,.48)}
.w{border:0!important}
.w-tap{border:0!important;box-shadow:0 4px 12px -2px rgba(0,0,0,.3)!important;transition:transform .28s var(--spring-play)!important}
.w-tap:active{transform:scale(.88)!important}
.w button,.w .pass,.w .who,.w .did,.w .in{box-shadow:none!important;border-width:0!important}
.count .w{background:linear-gradient(160deg,#d9573a,#c02f58)}
.count .w-small,.count .w-label{color:#fff;opacity:1}
.count .ticket{border:0;background:#fff;box-shadow:0 10px 20px -8px rgba(70,10,30,.45);-webkit-mask:radial-gradient(circle 7px at 0 63%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 63%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;mask:radial-gradient(circle 7px at 0 63%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 63%,transparent 6.5px,#000 7px) right/51% 100% no-repeat}
.count .ticket .cut::before,.count .ticket .cut::after{display:none}
.savings .track,.chores .bar{border:0;background:rgba(18,26,46,.12)}
.medal [stroke="#0b1430"]{stroke:none}
.mood .w{background:#dceafd}
/* a draft's refinements live on its tile, so they survive every redraw and the save */
.tinted .w{background:var(--bg)!important}
.big .w-huge{transform:scale(1.18);transform-origin:0 50%}
/* light faces dim at night, so Widgie stays the brightest thing on screen */
.night .groc .w{background:#1d3561;color:#eef4ff}
.night .groc li i{border-color:rgba(255,255,255,.5)}
.night .groc li .crossed i{background:rgba(255,255,255,.5)}
.night .savings .w{background:#183a3a;color:#eef4ff}
.night .savings .w-label{color:#7fd6a0}
.night .bins .w,.night .mood .w{filter:brightness(.82) saturate(.9)}
/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{font:600 13px var(--text);padding:7px 12px;border-radius:9px;border:1.5px solid var(--border,#ccd);background:var(--card,#fff);color:var(--foreground,#123)}
.controls button.on{background:var(--foreground,#123);color:var(--background,#fff)}
.phone{--shade:var(--sky-shade);width:402px;height:874px;border-radius:58px;overflow:clip;position:relative;color:var(--ink);font-family:var(--text);box-shadow:0 0 0 11px #0b0f1a,0 30px 60px rgba(0,0,0,.25);isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 45%,var(--sky-bottom) 100%);z-index:-3}
.sky.night{background:linear-gradient(180deg,#14284f 0%,#223f72 50%,#2b4e82 100%);opacity:0;transition:opacity .45s var(--soft)}
.phone.night .sky.night{opacity:1}
.moon{position:absolute;right:100px;top:-2px;width:22px;height:22px;border-radius:50%;background:#e9f2ff;box-shadow:0 0 40px 6px rgba(233,242,255,.3);opacity:0;transition:opacity .45s;pointer-events:none}
.night .moon{opacity:1}
.clouds{position:absolute;inset:0 0 auto;height:260px;z-index:-2;pointer-events:none;transition:opacity .45s}
.clouds svg{position:absolute;filter:blur(4px);opacity:.5;animation:drift linear infinite}
.phone.night .clouds{opacity:0}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(600px)}}
.stars{position:absolute;inset:0 0 60% 0;opacity:0;transition:opacity .45s;pointer-events:none;z-index:-2;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent);mask-image:linear-gradient(180deg,#000 50%,transparent)}
.phone.night .stars{opacity:1}
.stars i{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#e9f2ff;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
.topfade,.bottomfade{position:absolute;left:0;right:0;pointer-events:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topfade{top:0;height:66px;z-index:15;background:linear-gradient(180deg,rgba(180,212,251,.86) 48%,rgba(180,212,251,0));-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.bottomfade{bottom:0;height:120px;z-index:22;background:linear-gradient(0deg,rgba(138,182,240,.9) 30%,rgba(138,182,240,0));-webkit-mask-image:linear-gradient(0deg,#000 40%,transparent);mask-image:linear-gradient(0deg,#000 40%,transparent)}
.night .topfade{background:linear-gradient(180deg,rgba(20,40,79,.86) 48%,rgba(20,40,79,0))}
.night .bottomfade{background:linear-gradient(0deg,rgba(43,78,130,.9) 30%,rgba(43,78,130,0))}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:10px 32px 0 50px;font:600 17px var(--text);letter-spacing:-.2px;z-index:20;color:var(--ink);transition:color .45s}
.status svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.3;z-index:90}
.night .homebar{background:#fff}
.night .status,.night .page{color:#fff}
.night{--ink-2:rgba(233,242,255,.76);--ink-3:rgba(233,242,255,.64);--surface:rgba(255,255,255,.11);--surface-text:#fff;--bubble:#eef4ff;--bar:rgba(18,34,66,.9);--rest:0 1px 2px rgba(0,6,20,.2),0 4px 14px -4px rgba(0,6,20,.4),inset 0 0 0 .5px rgba(255,255,255,.14);--lift:0 2px 6px rgba(0,6,20,.2),0 18px 36px -14px rgba(0,6,20,.7)}
.night .blk::after{box-shadow:0 2px 6px rgba(0,6,20,.3),0 18px 32px -12px rgba(0,6,20,.75),0 0 0 .5px rgba(255,255,255,.12)}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:62px var(--m) 140px;transition:opacity .22s ease-out,transform .28s var(--soft)}
.page::-webkit-scrollbar{display:none}
.page.hidden{opacity:0;pointer-events:none}
.page.hidden.to-left{transform:translateX(-14px)}
.page.hidden.to-right{transform:translateX(14px)}
.display{font-family:var(--display);font-weight:800;font-stretch:82%;letter-spacing:-.025em;line-height:.98}
.eyebrow{font:600 14px var(--text);color:var(--ink-2);letter-spacing:-.1px}
.head{padding:6px 0 14px;position:relative}
.head h1{font-size:40px;margin-top:6px}
svg.i{width:15px;height:15px;flex:none}
/* ---------- Widgie: the drawing sways, the box hops, so a reaction never snaps the sway ---------- */
.widgie{position:absolute;transform-origin:50% 90%}
.widgie .caret{position:static;display:block;width:100%;transform-origin:50% 90%}
.widgie.sway .caret{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.widgie.hop{animation:hop .72s}
.widgie.hop.small{animation-name:hopsmall}
@keyframes hop{0%{transform:none;animation-timing-function:cubic-bezier(.2,.85,.3,1)}12%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.2,.8,.4,1)}40%{transform:translateY(-30px) scale(.94,1.08);animation-timing-function:cubic-bezier(.6,0,.85,.45)}62%{transform:translateY(0) scale(1.06,.93);animation-timing-function:cubic-bezier(.3,.7,.4,1)}80%{transform:scale(.98,1.02)}100%{transform:none}}
@keyframes hopsmall{0%{transform:none;animation-timing-function:cubic-bezier(.2,.85,.3,1)}12%{transform:scale(1.06,.92)}40%{transform:translateY(-16px) scale(.96,1.05);animation-timing-function:cubic-bezier(.6,0,.85,.45)}62%{transform:translateY(0) scale(1.04,.95)}100%{transform:none}}
.widgie.land{animation:land .36s var(--soft)}
@keyframes land{0%{transform:scale(1.12,.86)}60%{transform:scale(.97,1.03)}100%{transform:none}}
.widgie.glance{animation:glance 1.4s var(--soft)}
@keyframes glance{30%,70%{transform:rotate(-7deg)}}
.widgie .eyes{transform-box:fill-box;transform-origin:center;animation:blinkeyes 4.6s infinite}
.widgie.blink2 .eyes{animation:blink2 .6s}
@keyframes blinkeyes{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes blink2{0%,40%,100%{transform:scaleY(1)}20%,60%{transform:scaleY(.08)}}
.avatar{position:relative;flex:none;width:36px;height:36px;border-radius:12px;background:linear-gradient(160deg,#d8e8fd,#b0cff7);overflow:hidden;box-shadow:var(--rest)}
.avatar .widgie{width:104px;height:104px;left:-34px;top:-4px}
.night .avatar{background:linear-gradient(160deg,#3a5d96,#284a7c)}
.fadeswap{animation:fadeswap .32s var(--soft)}
@keyframes fadeswap{0%{opacity:0}100%{opacity:1}}
.shadow{position:absolute;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,26,46,.3),transparent);pointer-events:none}
.night .shadow{background:radial-gradient(closest-side,rgba(0,6,20,.5),transparent)}
/* ---------- speech ---------- */
.bubble{position:absolute;background:var(--bubble);color:#121a2e;border-radius:20px;padding:11px 15px;font:600 15px/1.32 var(--text);letter-spacing:-.15px;box-shadow:var(--lift);transform-origin:100% 30%;transition:transform .4s var(--spring-play),opacity .2s}
.bubble.right::after,.bubble.down::after,.bubble.left::after{content:"";position:absolute;width:13px;height:13px;background:inherit;transform:rotate(45deg)}
.bubble.right::after{right:-5px;top:16px;border-radius:0 3px 0 0}
.bubble.left::after{left:-5px;top:16px;border-radius:0 0 0 3px}
.bubble.down::after{bottom:-5px;left:var(--tx,50%);margin-left:-6px;border-radius:0 0 3px 0}
.bubble.left{transform-origin:0 30%}
.bubble.down{transform-origin:var(--tx,50%) 100%;white-space:nowrap}
.bubble.gone{transform:scale(.7);opacity:0}
.bubble.pop{animation:bubblepop .45s var(--spring-play)}
.bubble.swap{animation:swap .32s var(--soft)}
@keyframes bubblepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes swap{0%{opacity:.2}100%{opacity:1}}
.caretbar{display:inline-block;width:2.5px;height:17px;border-radius:2px;background:#121a2e;margin-left:3px;vertical-align:-3px;animation:blink 1.06s steps(1) infinite}
/* ---------- Widgets ---------- */
.top{position:relative;height:200px}
.top .eyebrow{position:absolute;left:0;top:6px}
.top h1{position:absolute;left:0;top:30px;font-size:40px}
.top .sub{position:absolute;left:0;top:80px;white-space:nowrap;font:500 14px var(--text);color:var(--ink-2)}
.top .sub b{font-weight:650;color:var(--ink)}
.night .top .sub b{color:#fff}
.top .shadow{right:40px;bottom:-4px;width:70px;z-index:3}
#w-widgie{right:6px;top:66px;width:148px;z-index:4}
#w-bubble{left:0;top:120px;width:206px;z-index:4}
.feed{display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.row{display:flex;gap:14px}
.pin{display:flex;flex-direction:column;gap:9px}
.pin .blk{position:relative;flex:none;transition:transform .3s var(--spring-play)}
.pin .blk.press{transform:scale(.965)}
.cap{display:flex;align-items:center;gap:6px;padding:0 4px;min-height:22px}
.cap .name{font:600 14px var(--text);letter-spacing:-.15px}
.cap .home{margin-left:auto;width:22px;height:20px;border-radius:7px;display:grid;place-items:center;color:rgba(18,26,46,.76);background:rgba(18,26,46,.12)}
.night .cap .home{background:rgba(255,255,255,.14);color:rgba(233,242,255,.82)}
.cap .home svg{width:12px;height:12px}
.tag{font:700 11px var(--text);color:#121a2e;background:var(--sun);padding:2px 6px;border-radius:6px}
.rise{animation:rise .42s var(--spring-ui) both}
@keyframes rise{0%{opacity:0;transform:translateY(18px) scale(.98)}100%{opacity:1;transform:none}}
.arrive .blk{animation:settle .8s .08s var(--spring-play) both}
@keyframes settle{0%{transform:scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:18px;right:18px;bottom:26px;height:68px;border-radius:26px;background:var(--bar);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.7);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;z-index:30;transition:background .45s}
.night .tabbar{box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.16)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px var(--text);letter-spacing:-.1px;color:var(--ink-3);transition:color .2s}
.tab.on{color:var(--ink)}
.night .tab.on{color:#fff}
.tab .glyph{height:28px;display:grid;place-items:center}
.tab .glyph > svg{width:24px;height:24px;transition:transform .32s var(--spring-play)}
.tab:active .glyph > *{transform:scale(.86)}
.tabpill{position:absolute;top:6px;height:56px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(20,45,90,.14);transition:left .32s var(--spring-ui),width .32s var(--spring-ui)}
.night .tabpill{background:rgba(255,255,255,.14);box-shadow:none}
.makekey{position:relative;width:40px;height:26px;border-radius:10px;background:linear-gradient(165deg,#ffecab,#f7d97a);overflow:hidden;transition:transform .32s var(--spring-play),box-shadow .2s,filter .2s}
.tab.on .makekey{transform:scale(1.04);background:linear-gradient(165deg,#ffe479,#ffc532);box-shadow:0 5px 12px -4px rgba(214,150,0,.6),inset 0 1px 0 rgba(255,255,255,.7)}
.night .makekey{filter:brightness(.82) saturate(.85)}
.night .tab.on .makekey{filter:none}
.makekey .widgie{width:96px;height:96px;left:-26px;top:-1px}
.badge{position:absolute;top:2px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#b34038;color:#fff;font:700 11px var(--text);display:grid;place-items:center;box-shadow:0 3px 8px rgba(179,64,56,.5);transform:scale(0);transition:transform .45s var(--spring-play)}
.badge.show{transform:scale(1)}
/* ---------- controls ---------- */
.chip{height:44px;padding:0 14px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--text);letter-spacing:-.15px;color:var(--surface-text);background:var(--surface);box-shadow:var(--rest);transition:transform .3s var(--spring-play),background .2s,color .2s;white-space:nowrap}
.chip:active{transform:scale(.94)}
.key{height:52px;padding:0 22px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:700 17px var(--display);font-stretch:92%;letter-spacing:-.01em;box-shadow:0 12px 24px -10px rgba(18,26,46,.65);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease-out,box-shadow .12s,opacity .2s}
.key::after{display:none!important}
.key:hover{border:0;transform:none;box-shadow:0 12px 24px -10px rgba(18,26,46,.65)}
.key:active{border:0;transform:scale(.97);box-shadow:0 6px 14px -6px rgba(18,26,46,.5)}
.key:disabled{opacity:.5;pointer-events:none}
.key.quiet{background:rgba(18,26,46,.07);color:var(--ink);box-shadow:none;font:600 15px var(--text);letter-spacing:-.15px}
.night .key:not(.quiet){background:#fff;color:#121a2e}
.night .key.quiet{background:rgba(255,255,255,.12);color:#fff}
.mini{height:36px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:600 14px var(--text);color:var(--ink);background:var(--surface);box-shadow:var(--rest);transition:transform .3s var(--spring-play)}
.night .mini{color:#fff}
.mini:active{transform:scale(.94)}
.mini svg{width:14px;height:14px}
.head .mini{position:absolute;right:0;bottom:16px}
/* ---------- Make ---------- */
#p-make{display:flex;flex-direction:column;padding-bottom:178px;scroll-padding-bottom:190px}
.hello{flex:1;display:flex;flex-direction:column;transition:opacity .22s ease-out}
.hello.entering{opacity:0}
.make-hello{position:relative;height:224px;margin:4px 0 0}
.make-hello .shadow{left:234px;top:198px;width:100px;height:13px}
#m-widgie{left:184px;top:20px;width:192px;transition:rotate .22s var(--soft)}
#m-widgie.lean{rotate:-6deg}
#m-bubble{left:0;top:58px;width:206px}
.hello .grow{flex:1;min-height:12px}
.ideas{display:flex;flex-direction:column;gap:10px}
.ideas .eyebrow{margin:0 4px 2px}
.idea{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);color:var(--surface-text);box-shadow:var(--rest);transition:transform .3s var(--spring-play);text-align:left;width:100%}
.idea:active{transform:scale(.97)}
.idea .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.idea .ic svg{width:20px;height:20px}
.idea .t{font:600 16px var(--text);letter-spacing:-.2px}
.idea .s{font:500 13px var(--text);color:var(--ink-2);margin-top:1px}
.idea .chev{margin-left:auto;color:var(--ink-3)}
.composer{position:absolute;left:18px;right:18px;bottom:108px;z-index:25;min-height:60px;border-radius:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--lift);display:flex;align-items:center;gap:8px;padding:8px;transition:opacity .22s ease-out,transform .28s var(--soft)}
.night .composer{background:rgba(34,62,108,.94);box-shadow:var(--lift),inset 0 0 0 1px rgba(233,242,255,.18)}
.composer.hidden{opacity:0;transform:scale(.98);pointer-events:none}
.composer .icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink);background:rgba(18,26,46,.06);flex:none}
.night .composer .icon{background:rgba(255,255,255,.1);color:#fff}
.composer .field{position:relative;flex:1;min-width:0;height:44px;display:flex;align-items:center}
.composer input{width:100%;height:44px;padding-left:8px;font:500 17px var(--text);letter-spacing:-.2px;color:var(--ink);caret-color:var(--ink);cursor:text}
.night .composer input{color:#fff;caret-color:#fff}
.composer input::placeholder{color:var(--ink-3)}
.composer .idlecaret{position:absolute;left:2px;top:12px;width:2.5px;height:20px;border-radius:2px;background:var(--ink);animation:blink 1.06s steps(1) infinite;pointer-events:none}
.night .composer .idlecaret{background:#fff}
.composer:focus-within .idlecaret,.composer.typed .idlecaret,.composer.busy .idlecaret{display:none}
.composer .send{width:44px;height:44px;border-radius:14px;background:rgba(18,26,46,.1);color:rgba(18,26,46,.35);display:grid;place-items:center;flex:none;transition:background .2s,color .2s,transform .3s var(--spring-play)}
.composer .send.ready{background:var(--ink);color:#fff}
.composer .send:active{transform:scale(.9)}
.night .composer .send{background:rgba(255,255,255,.12);color:rgba(233,242,255,.4)}
.night .composer .send.ready{background:#fff;color:#121a2e}
.thread{display:flex;flex-direction:column;gap:14px;transition:opacity .28s ease-out,transform .28s ease-out}
.thread.leaving{opacity:0;transform:translateY(-8px)}
.me{align-self:flex-end;max-width:262px;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px;padding:11px 15px;font:600 15.5px/1.32 var(--text);letter-spacing:-.15px;box-shadow:0 10px 20px -10px rgba(18,26,46,.6);animation:slidein .45s var(--spring-ui) both}
.night .me{background:#4b7bd6;color:#fff;box-shadow:0 10px 20px -10px rgba(0,6,20,.55)}

const cloud = (w) => `<svg width="${w}" height="${w * .42}" viewBox="0 0 100 42"><g fill="#fff"><ellipse cx="30" cy="30" rx="26" ry="12"/><ellipse cx="52" cy="22" rx="22" ry="17"/><ellipse cx="72" cy="30" rx="22" ry="11"/></g></svg>`;

  const c = CATS[cat];
  const fill = () => {
    const banner = $("#banner");
    banner.style.background = c.bg;
    banner.style.color = c.dark ? "#121a2e" : "#fff";
    $("#b-line").textContent = c.line;
    castBanner(c);
    $("#actors").classList.remove("out");
    if (swap) for (const w of document.querySelectorAll("#actors .widgie")) hop(w, true);
    // Small tiles lean up to 2.5 degrees, wide ones 1, alternating, so the pile reads as handled but stays in the gutters.
    $("#pile").innerHTML = c.items.map(([w, n, sub], i) => { const rot = (i % 2 ? 1 : -1) * (MEDIUM.has(w) ? 1 : [2.5, 2, 1.5][i % 3]); return `<button class="item ${MEDIUM.has(w) ? "wide" : ""} rise" style="animation-delay:${i * .05}s" data-i="${i}" aria-label="${n}: ${sub}">${tile(w, rot)}<div class="tmeta" aria-hidden="true"><div class="tname">${n}${CHEV}</div><div class="tsub">${sub}</div></div></button>`; }).join("");
    live($("#pile"));
    for (const b of document.querySelectorAll("#pile .blk button")) { b.tabIndex = -1; b.setAttribute("aria-hidden", "true"); }
    for (const it of document.querySelectorAll("#pile .item")) it.onclick = () => openSheet(c.items[it.dataset.i], it);
  };
  if (!swap) return fill();
  $("#actors").classList.add("out");
  for (const it of document.querySelectorAll("#pile .item")) it.classList.add("pop-out");
  setTimeout(fill, 170);
}
// Each template's blank: the question, the word it starts with here, and every word on the tile that follows it.
const BLANKS = {
  luna: { label: "Your pet's name", start: "Mochi", pairs: (v) => [["Luna", v], ...UNFED] },
  hearts: { label: "Who gets the hearts?", start: "Alex", pairs: (v) => [["Sam", v]] },
  count: { label: "Where are you going?", start: "Kyoto", pairs: (v) => [["Lisbon", v], ["LIS", code(v)]] },
  plant: { label: "Your plant", start: "Fern", pairs: (v) => [["Monstera", v]] },
  savings: { label: "What's the fund called?", start: "Japan fund", pairs: (v) => [["Japan fund", v]] },
  bins: { label: "Who's in the rota with you?", start: "Alex", pairs: (v) => [["Sam", v]] },
  baby: { label: "Who's on feeds with you?", start: "Alex", pairs: (v) => [["Sam", v]] },
  mood: { label: "Your partner's name", start: "Alex", pairs: (v) => [["Sam", v]] },
  chores: { label: "Who are you up against?", start: "Alex", pairs: (v) => [["Sam", v]] },
};
const savedName = (w, title, v) => ({ luna: v, hearts: `Hearts for ${v}`, count: `${v} trip`, plant: v, savings: v }[w] || title);
let sheetItem = null, opener = null, spotWidgie = null;
function openSheet(item, from) {
  sheetItem = item; opener = from;
  const [w, title, sub] = item, blank = BLANKS[w];
  $("#s-title").textContent = title;
  $("#s-line").textContent = sub + ".";
  $("#s-field").hidden = !blank;
  if (blank) { $("#s-label").textContent = blank.label; $("#s-name").value = blank.start; }
  $("#s-hint").textContent = WIDGETS[w].tap ? "It already works. Give it a tap." : "A live preview. Make it yours below.";
  const wide = MEDIUM.has(w), k = wide ? 330 / 364 : 1.08, W = (wide ? 364 : 170) * k, H = 170 * k;
  $("#s-spot").innerHTML = `<div class="stagebox" style="width:${W}px;height:${H}px">${tile(w, 0, k)}<div class="shadow"></div><div class="widgie perch sway"></div><div class="bubble gone"></div></div>`;
  const box = $("#s-spot").firstChild, blk = box.firstChild, shadow = box.querySelector(".shadow"), b = box.querySelector(".bubble");
  blk.style.position = "relative";
  live(box, () => hop(spotWidgie, true));
  if (blank) words(blk, blank.pairs(blank.start));
  spotWidgie = box.querySelector(".perch");
  if (wide) {
    // A wide tile: Widgie perches at its top left, clear of the art on the right, and talks to its right.
    const size = 96;
    Object.assign(spotWidgie.style, { width: size + "px", left: 30 - .5 * size + "px", top: -.9 * size + 2 + "px" });
    Object.assign(shadow.style, { left: "4px", top: "-5px", width: "52px", height: "10px" });
    b.className = "bubble left gone"; Object.assign(b.style, { left: "76px", top: "-86px" });
  } else {
    // A small tile: Widgie stands beside it on the spotlight floor and talks from above.
    const size = 120;
    Object.assign(spotWidgie.style, { width: size + "px", left: W - 8 + "px", top: H - .9 * size + "px" });
    Object.assign(shadow.style, { left: W + 34 + "px", top: H - 6 + "px", width: "64px" });
    b.className = "bubble down gone"; Object.assign(b.style, { right: W - 284 + "px", top: "30px" }); b.style.setProperty("--tx", "70%");
  }
  drawWidgie(spotWidgie, "lean", { mirror: wide ? undefined : "1" });
  $("#sheet").inert = false;
  for (const p of ["#p-widgets", "#p-make", "#p-tpl", "#tabbar", "#composer"]) $(p).inert = true;
  $("#scrim").classList.add("show");
  $("#sheet").classList.add("show");
  setTimeout(() => $("#sheet").focus({ preventScroll: true }), calm ? 0 : 300);
}
let nameTimer;
$("#s-name").addEventListener("input", () => {
  const blank = BLANKS[sheetItem[0]]; if (!blank) return;
  const blk = $("#s-spot .blk"), v = $("#s-name").value.trim() || blank.start;
  words(blk, blank.pairs(v));
  clearTimeout(nameTimer);
  nameTimer = setTimeout(() => { const bb = $("#s-spot .bubble"); say(bb, `${v} it is.`); hop(spotWidgie, true); clearTimeout(bb._g); bb._g = setTimeout(() => bb.classList.add("gone"), 1800); }, 500);
});
function closeSheet() {
  $("#scrim").classList.remove("show"); $("#sheet").classList.remove("show"); $("#s-name").blur();
  $("#sheet").inert = true; $("#tabbar").inert = false;
  go(tab, true);
  opener?.focus({ preventScroll: true });
}
$("#scrim").onclick = closeSheet;
$("#s-close").onclick = closeSheet;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet").classList.contains("show")) closeSheet(); });
function sheetChoice() {
  const [w, title] = sheetItem, blank = BLANKS[w];
  const v = blank ? ($("#s-name").value.trim() || blank.start) : null;
  return { w, title, name: v ? savedName(w, title, v) : title, words: v ? blank.pairs(v) : undefined, who: w === "hearts" ? v : undefined };
}
$("#s-chat").onclick = () => { const c = sheetChoice(); closeSheet(); setTimeout(() => { go("make"); adopt(c.w, c.name, c.words); say_.focus(); }, calm ? 0 : 240); };
$("#s-add").onclick = (e) => {
  const key = e.currentTarget; key.disabled = true;
  const blk = $("#s-spot .blk"), c = sheetChoice();
  burst(blk); hop(spotWidgie);
  setTimeout(() => {
    flyToTab(blk, () => { $("#badge").classList.add("show"); addToFeed({ w: c.w, name: c.name, words: c.words, who: c.who }); toast(`${c.name} is in your widgets.`); key.disabled = false; });
    setTimeout(closeSheet, 160);
  }, calm ? 0 : 200);
};

// ---------- tabs: each page renders once and keeps its state; switching is a quick slide ----------
function placePill() {
  const t = document.querySelector(`.tab[data-tab="${tab}"]`);
  const pill = $("#pill");
  pill.style.left = t.offsetLeft + "px";
  pill.style.width = t.offsetWidth + "px";
}
function go(next, quiet = false) {
  const to = ORDER.indexOf(next);
  if (next === "make" && tab !== "make") hop($("#tab-widgie"), true);
  tab = next;
  for (const k of ORDER) {
    const page = $(`#p-${k}`), i = ORDER.indexOf(k);
    page.classList.toggle("hidden", k !== next);
    page.classList.toggle("to-left", i < to);
    page.classList.toggle("to-right", i > to);
    page.inert = k !== next;
  }
  $("#composer").classList.toggle("hidden", next !== "make");
  $("#composer").inert = next !== "make";
  for (const t of document.querySelectorAll(".tab")) { t.classList.toggle("on", t.dataset.tab === next); t.setAttribute("aria-selected", t.dataset.tab === next); }
  placePill();
  if (next === "widgets") {
    $("#badge").classList.remove("show");
    if (pending && !quiet) { const it = pending; pending = null; $("#toast").classList.remove("show"); land(it); }
  }
}
for (const t of document.querySelectorAll("[data-tab]")) t.onclick = () => go(t.dataset.tab);
for (const b of document.querySelectorAll("[data-go]")) b.onclick = () => go(b.dataset.go);
function redrawCast() {
  for (const el of document.querySelectorAll(".widgie")) {
    if (!el._pose) continue;
    el.classList.remove("fadeswap"); void el.offsetWidth; el.classList.add("fadeswap");
    drawWidgie(el, ...el._pose);
  }
}
for (const b of document.querySelectorAll("[data-time]")) b.onclick = () => {
  night = b.dataset.time === "night";
  for (const x of document.querySelectorAll("[data-time]")) x.classList.toggle("on", x === b);
  phone.classList.toggle("night", night);
  $("#w-hello").textContent = night ? "Good evening" : "Good morning";
  redrawCast();
  say($("#w-bubble"), greet(), { swap: true });
};

// Widgie's idle life on Widgets: a double blink, a glance at your widgets, or a little hop, every 8 to 11 seconds.
let beat = 0;
function idle() {
  const w = $("#w-widgie");
  if (tab === "widgets" && !calm) { const n = beat++ % 3; if (n === 0) play(w, "blink2", 640); else if (n === 1) play(w, "glance", 1420); else hop(w, true); }
  setTimeout(idle, 8000 + (beat % 3) * 1500);
}

drawWidgie($("#w-widgie"), "lean", { mirror: "1" });
drawWidgie($("#tab-widgie"), "idle", { moon: "0" });
layoutFeed({ first: true });
makeReset();
renderCats();
renderPile(false);
go("widgets");
setTimeout(() => say($("#w-bubble"), greet()), 700);
setTimeout(idle, 9000);
window.proto = {
  go, ask: (i) => ask(IDEAS[i], IDEAS[i].t), openSheet: (i) => openSheet(CATS[cat].items[i], null),
  setNight: (n) => document.querySelector(`[data-time="${n ? "night" : "day"}"]`).click(),
  say: () => say($("#w-bubble"), greet()),
  cat: (k) => document.querySelector(`.cat[data-cat="${k}"]`).click(),
  add: (w, n, pairs, look) => addToFeed({ w, name: n, words: pairs, look }),
  refine: (i) => draft && refine(draft.chips[i][0], draft.chips[i]),
  saveDraft: () => draft && saved(),
  adopt,
};
})();
</script>
