:root{
 --ink:#121a2e;--ink-2:rgba(18,26,46,.76);--ink-3:rgba(18,26,46,.72);
 --sky-top:#b4d4fb;--sky:#9cc3f5;--sky-bottom:#8ab6f0;--sky-shade:#7aa6e2;
 --coral:#ff6b5c;--coral-shade:#e04a3d;--sun:#ffd23c;--sun-shade:#ecb514;--grape:#3b1f6e;--grape-shade:#2a1452;--moon:#e9f2ff;--blush:#ff7f8e;
 --surface:rgba(255,255,255,.88);--surface-text:#121a2e;--bubble:#fff;--bar:rgba(220,235,253,.88);
 --rest:0 1px 2px rgba(20,45,90,.06),0 4px 14px -4px rgba(20,45,90,.14);
 --lift:0 2px 6px rgba(20,45,90,.06),0 18px 36px -14px rgba(20,45,90,.38);
 --quiet:0 1px 3px rgba(20,45,90,.06),0 6px 14px -6px rgba(20,45,90,.24);
 --spring-ui:cubic-bezier(.22,1.06,.36,1);--spring-play:cubic-bezier(.32,1.38,.48,1);--soft:cubic-bezier(.22,.8,.26,1);
 --display:"Bricolage",-apple-system,system-ui,sans-serif;--text:-apple-system,system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
 --unit:1px;--u:1px;--m:20px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);color:var(--foreground,#121a2e);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
button:focus-visible,input:focus-visible,.namefield:focus-within,[role=tab]:focus-visible{outline:2.5px solid #121a2e;outline-offset:3px}
.night button:focus-visible,.night input:focus-visible,.night .namefield:focus-within,.night [role=tab]:focus-visible{outline-color:#ffd23c}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- The button: a toy key with a solid bottom edge ---------- */

.key {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    height: 64px;
    padding: 0 28px;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: var(--ink);
    color: #fff;
    font-family: var(--display);
    font-size: 21px;
    font-weight: 700;
    font-stretch: 90%;
    letter-spacing: -0.01em;
    text-decoration: none;
    box-shadow:
        0 7px 0 #000a1f,
        6px 13px 0 var(--shade);
    transition:
        transform 0.08s,
        box-shadow 0.08s;
}
.key::after {
    content: "";
    width: 4px;
    height: 24px;
    border-radius: 2px;
    background: var(--sky);
    animation: blink 1.1s steps(1) infinite;
}
.key:hover {
    transform: translateY(2px);
    box-shadow:
        0 5px 0 #000a1f,
        5px 10px 0 var(--shade);
}
.key:active {
    transform: translateY(7px);
    box-shadow:
        0 0 0 #000a1f,
        2px 4px 0 var(--shade);
}
@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* ---------- Blocks: a widget face sitting on a solid edge, with a hard shadow on the field ---------- */

.blk {
    --t: calc(12 * var(--u));
    --b: calc(3.5 * var(--u));
    --r: calc(26 * var(--u));
    position: absolute;
    width: calc(170 * var(--u));
    height: calc(170 * var(--u));
    transform: rotate(var(--rot, 0deg));
}
.blk.m {
    width: calc(364 * var(--u));
}
.blk::before,
.blk::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--r);
}
.blk::before {
    z-index: -1;
    top: var(--t);
    bottom: calc(-1 * var(--t));
    background: var(--edge, #000);
    border: var(--b) solid var(--ink);
}
.blk::after {
    z-index: -2;
    transform: translate(calc(16 * var(--u)), calc(30 * var(--u)));
    background: var(--shade);
}

.w {
    position: relative;
    height: 100%;
    padding: calc(15 * var(--u)) calc(16 * var(--u));
    border: var(--b) solid var(--ink);
    border-radius: var(--r);
    overflow: hidden;
    user-select: none;
    font-family: var(--text);
    letter-spacing: 0;
}
.w-label {
    display: flex;
    align-items: center;
    gap: calc(5 * var(--u));
    font-size: calc(13 * var(--u));
    font-weight: 750;
    white-space: nowrap;
}
.w-label svg {
    width: calc(15 * var(--u));
    height: calc(15 * var(--u));
    flex: none;
}
.w-label .aside {
    margin-left: auto;
    font-weight: 600;
    opacity: 0.55;
}
.w-big {
    margin-top: calc(8 * var(--u));
    font-family: var(--display);
    font-size: calc(36 * var(--u));
    font-weight: 800;
    font-stretch: 85%;
    letter-spacing: -0.03em;
    line-height: 1;
    white-space: nowrap;
}
.w-huge {
    font-family: var(--display);
    font-size: calc(76 * var(--u));
    font-weight: 800;
    font-stretch: 80%;
    letter-spacing: -0.04em;
    line-height: 0.9;
}
.w-small {
    margin-top: calc(5 * var(--u));
    font-size: calc(12.5 * var(--u));
    font-weight: 600;
    line-height: 1.3;
    opacity: 0.8;
}
.w-tap {
    position: absolute;
    right: calc(13 * var(--u));
    bottom: calc(13 * var(--u));
    display: grid;
    place-items: center;
    width: calc(46 * var(--u));
    height: calc(46 * var(--u));
    border: calc(2.5 * var(--u)) solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 calc(4 * var(--u)) 0 var(--ink);
    transition:
        transform 0.08s,
        box-shadow 0.08s;
}
.w-tap:active {
    transform: translateY(calc(4 * var(--u)));
    box-shadow: 0 0 0 var(--ink);
}
.w-tap svg {
    width: 50%;
    height: 50%;
}

/* Luna, with her face in the corner */
.luna .puppy {
    position: absolute;
    left: calc(8 * var(--u));
    bottom: calc(4 * var(--u));
    width: calc(74 * var(--u));
    transform-origin: 50% 90%;
    animation: wag 2.6s ease-in-out infinite;
}
@keyframes wag {
    0%,
    100% {
        rotate: -4deg;
    }
    50% {
        rotate: 4deg;
    }
}
/* Luna */
.luna {
    --edge: #120c06;
}
.luna .w {
    background: #2b1f14;
    color: #ffe9cf;
}
.luna .w-label {
    color: #ffbe1a;
}
.luna .w-tap {
    background: #ffbe1a;
    color: #2b1f14;
}

/* Hearts for Jo */
.hearts {

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0 8px}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.controls button{font:600 13px var(--text);padding:7px 12px;border-radius:9px;border:1.5px solid var(--border,#ccd);background:var(--card,#fff);color:var(--foreground,#123)}
.controls button.on{background:var(--foreground,#123);color:var(--background,#fff)}
.phone{--shade:var(--sky-shade);width:402px;height:874px;border-radius:58px;overflow:clip;position:relative;color:var(--ink);font-family:var(--text);box-shadow:0 0 0 11px #0b0f1a,0 30px 60px rgba(0,0,0,.25);isolation:isolate}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky) 45%,var(--sky-bottom) 100%);z-index:-3}
.sky.night{background:linear-gradient(180deg,#14284f 0%,#223f72 50%,#2b4e82 100%);opacity:0;transition:opacity .45s var(--soft)}
.phone.night .sky.night{opacity:1}
.moon{position:absolute;right:28px;top:66px;width:22px;height:22px;opacity:0;transition:opacity .45s;pointer-events:none;z-index:-2;filter:drop-shadow(0 0 14px rgba(233,242,255,.35))}
.night .moon{opacity:.85}
.night.thread .moon{opacity:.25}
.clouds{position:absolute;inset:0 0 auto;height:260px;z-index:-2;pointer-events:none;transition:opacity .45s}
.clouds svg{position:absolute;filter:blur(4px);opacity:.5;animation:drift linear infinite}
.phone.night .clouds{opacity:0}
@keyframes drift{from{transform:translateX(-180px)}to{transform:translateX(600px)}}
.stars{position:absolute;inset:0 0 60% 0;opacity:0;transition:opacity .45s;pointer-events:none;z-index:-2;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent);mask-image:linear-gradient(180deg,#000 50%,transparent)}
.phone.night .stars{opacity:1}
.stars i{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:#e9f2ff;animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.5)}}
.topfade,.bottomfade{position:absolute;left:0;right:0;pointer-events:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topfade{top:0;height:58px;z-index:15;background:linear-gradient(180deg,rgba(180,212,251,.86) 48%,rgba(180,212,251,0));-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.bottomfade{bottom:0;height:96px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:22;background:linear-gradient(0deg,rgba(138,182,240,.9) 30%,rgba(138,182,240,0));-webkit-mask-image:linear-gradient(0deg,#000 40%,transparent);mask-image:linear-gradient(0deg,#000 40%,transparent)}
.night .topfade{background:linear-gradient(180deg,rgba(20,40,79,.86) 48%,rgba(20,40,79,0))}
.night .bottomfade{background:linear-gradient(0deg,rgba(43,78,130,.9) 30%,rgba(43,78,130,0))}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:10px 28px 0 34px;font:600 17px var(--text);letter-spacing:-.2px;z-index:20;color:var(--ink);transition:color .45s}
.status svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.3;z-index:90}
.night .homebar{background:#fff}
.night .status,.night .page{color:#fff}
.night{--ink-2:rgba(233,242,255,.8);--ink-3:rgba(233,242,255,.74);--surface:rgba(255,255,255,.11);--surface-text:#fff;--bubble:#d6e2f5;--bar:rgba(18,34,66,.9);--rest:0 1px 2px rgba(0,6,20,.2),0 4px 14px -4px rgba(0,6,20,.4),inset 0 0 0 .5px rgba(255,255,255,.14);--lift:0 2px 6px rgba(0,6,20,.2),0 18px 36px -14px rgba(0,6,20,.7)}
.night .blk::after{box-shadow:0 2px 6px rgba(0,6,20,.14),0 10px 24px -12px rgba(0,6,20,.4),0 0 0 .5px rgba(255,255,255,.1)}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:62px var(--m) 140px;transition:opacity .22s ease-out .04s,transform .28s var(--soft) .04s}
.page.hidden{transition:opacity .12s linear,transform 0s .12s}
.page::-webkit-scrollbar{display:none}
.page.hidden{opacity:0;pointer-events:none}
.page.hidden.to-left{transform:translateX(-14px)}
.page.hidden.to-right{transform:translateX(14px)}
.display{font-family:var(--display);font-weight:800;font-stretch:82%;letter-spacing:-.025em;line-height:.98}
.eyebrow{font:600 14px var(--text);color:var(--ink-2);letter-spacing:-.1px}
.head{padding:6px 0 14px;position:relative}
.head h1{font-size:40px;margin-top:6px}
svg.i{width:15px;height:15px;flex:none}
/* ---------- Widgie: the drawing sways, the box hops, so a reaction never snaps the sway ---------- */
.widgie{position:absolute;transform-origin:50% 90%}
.widgie .caret{position:static;display:block;width:100%;transform-origin:50% 90%}
.widgie.sway .caret{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.2deg)}}
.widgie.hop{animation:hop .72s}
.widgie.hop.small{animation-name:hopsmall}
@keyframes hop{0%{transform:none;animation-timing-function:cubic-bezier(.2,.85,.3,1)}12%{transform:scale(1.1,.88);animation-timing-function:cubic-bezier(.2,.8,.4,1)}40%{transform:translateY(-30px) scale(.94,1.08);animation-timing-function:cubic-bezier(.6,0,.85,.45)}62%{transform:translateY(0) scale(1.06,.93);animation-timing-function:cubic-bezier(.3,.7,.4,1)}80%{transform:scale(.98,1.02)}100%{transform:none}}
@keyframes hopsmall{0%{transform:none;animation-timing-function:cubic-bezier(.2,.85,.3,1)}12%{transform:scale(1.06,.92)}40%{transform:translateY(-16px) scale(.96,1.05);animation-timing-function:cubic-bezier(.6,0,.85,.45)}62%{transform:translateY(0) scale(1.04,.95)}100%{transform:none}}
.widgie.land{animation:land .36s var(--soft)}
@keyframes land{0%{transform:scale(1.12,.86)}60%{transform:scale(.97,1.03)}100%{transform:none}}
.widgie.glance{animation:glance 1.4s var(--soft)}
@keyframes glance{30%,70%{transform:rotate(-7deg)}}
.widgie .eyes{transform-box:fill-box;transform-origin:center;animation:blinkeyes 4.6s infinite}
.widgie.blink2 .eyes{animation:blink2 .6s}
@keyframes blinkeyes{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes blink2{0%,40%,100%{transform:scaleY(1)}20%,60%{transform:scaleY(.08)}}
.avatar{position:relative;flex:none;width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#d8e8fd,#b0cff7);overflow:hidden;box-shadow:var(--rest)}
.avatar .widgie{width:92px;height:92px;left:-28px;top:-1px}
.night .avatar{background:linear-gradient(160deg,#3a5d96,#284a7c)}
.fadeswap{animation:fadeswap .32s var(--soft)}
@keyframes fadeswap{0%{opacity:0}100%{opacity:1}}
.shadow{position:absolute;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(18,26,46,.3),transparent);pointer-events:none}
.shadow.onface,.night .shadow.onface{height:5px;width:36px;background:radial-gradient(closest-side,rgba(0,0,0,.22),transparent)}
.night .shadow{background:radial-gradient(closest-side,rgba(0,6,20,.5),transparent)}
/* ---------- speech ---------- */
.bubble{position:absolute;background:var(--bubble);color:#121a2e;border-radius:20px;padding:11px 15px;font:600 15px/1.32 var(--text);letter-spacing:-.15px;box-shadow:var(--quiet),0 0 0 .5px rgba(18,26,46,.06);transform-origin:100% 30%;transition:transform .4s var(--spring-play),opacity .2s}
.bubble.right::after,.bubble.down::after,.bubble.left::after{content:"";position:absolute;width:13px;height:13px;background:inherit;transform:rotate(45deg)}
.bubble.right::after{right:-5px;top:11px;border-radius:0 3px 0 0}
.bubble.left::after{left:-5px;top:11px;border-radius:0 0 0 3px}
.bubble.down::after{bottom:-5px;left:var(--tx,50%);margin-left:-6px;border-radius:0 0 3px 0}
.bubble.left{transform-origin:0 30%}
.bubble.down{transform-origin:var(--tx,50%) 100%;white-space:nowrap}
.bubble.gone{transform:scale(.7);opacity:0}
.bubble.pop{animation:bubblepop .45s var(--spring-play)}
.bubble.swap{animation:swap .32s var(--soft)}
@keyframes bubblepop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes swap{0%{opacity:.2}100%{opacity:1}}
.caretbar{display:inline-block;width:2.5px;height:17px;border-radius:2px;background:#121a2e;margin-left:3px;vertical-align:-3px;animation:blink 1.06s steps(1) infinite}
/* ---------- Widgets ---------- */
.top{position:relative;height:200px}
.top .eyebrow{position:absolute;left:0;top:6px}
.top h1{position:absolute;left:0;top:30px;font-size:40px}
.top .sub{position:absolute;left:0;top:80px;white-space:nowrap;transition:color .45s var(--soft);font:500 14px var(--text);color:var(--ink-2)}
.top .sub b{font-weight:650;color:var(--ink)}
.night .top .sub b{color:#fff}
.top .shadow{width:70px;z-index:3}
#w-widgie{z-index:4}
#w-bubble{z-index:4}
.feed{display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.row{display:flex;gap:14px}
.pin{display:flex;flex-direction:column;gap:9px}
.pin .blk{position:relative;flex:none;transition:transform .3s var(--spring-play)}
.pin .blk.press{transform:scale(.965)}
.cap{display:flex;align-items:center;gap:6px;padding:0 4px;min-height:22px}
.cap .name{font:600 15px var(--text);letter-spacing:-.2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap .tag,.cap .home{flex:none}
.cap .home svg{width:18px;height:18px}
.cap .home{color:var(--ink-2)}
.top .sub svg{width:15px;height:15px;vertical-align:-3px;margin:0 3px 0 0}
.top .sub .dot{color:var(--ink-3);margin:0 5px}
.tag{font:700 12px var(--text);color:#121a2e;background:var(--sun);padding:2px 7px;border-radius:6px}
.cap .home{margin-left:auto;display:inline-flex;align-items:center;color:var(--ink-2)}
.rise{animation:rise .42s var(--spring-ui) both}
@keyframes rise{0%{opacity:0;transform:translateY(18px) scale(.98)}100%{opacity:1;transform:none}}
.arrive .blk{animation:settle .26s var(--soft) both}
@keyframes settle{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
/* ---------- tab bar ---------- */
.tabbar{position:absolute;left:20px;right:20px;bottom:26px;height:68px;border-radius:26px;background:var(--bar);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.7);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;z-index:30;transition:background .45s}
.night .tabbar{box-shadow:var(--lift),inset 0 0 0 .5px rgba(255,255,255,.16)}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px var(--text);letter-spacing:-.1px;color:rgba(18,26,46,.6);transition:color .2s}
.tab.on{color:var(--ink)}
.night .tab{color:rgba(233,242,255,.66)}
.tab.on .glyph > svg{stroke-width:2.4}
.night .tab.on{color:#fff}
.tab .glyph{height:28px;display:grid;place-items:center}
.tab .glyph > svg{width:24px;height:24px;transition:transform .32s var(--spring-play)}
.tab:active .glyph > *{transform:scale(.86)}
.tabpill{position:absolute;top:6px;height:56px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(20,45,90,.12),0 0 0 .5px rgba(20,45,90,.06);transition:left .32s var(--spring-ui),width .32s var(--spring-ui)}
.night .tabpill{background:rgba(255,255,255,.14);box-shadow:none}
.makekey{position:relative;width:40px;height:26px;border-radius:10px;background:rgba(18,26,46,.07);overflow:hidden;transition:transform .32s var(--spring-play),box-shadow .2s,filter .2s}
.tab.on .makekey{transform:scale(1.04);background:linear-gradient(165deg,#ffe479,#ffc532);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.night .makekey{background:rgba(255,255,255,.1)}
.night .tab.on .makekey{background:linear-gradient(165deg,#ffe479,#ffc532)}
.makekey .widgie{width:46px;height:46px;left:-3px;top:1px}
.badge{position:absolute;top:2px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral-shade);color:#fff;font:700 11px var(--text);display:grid;place-items:center;box-shadow:0 3px 8px rgba(224,74,61,.45);transform:scale(0);transition:transform .45s var(--spring-play)}
.badge.show{transform:scale(1)}
/* ---------- controls ---------- */
.chip{height:44px;padding:0 14px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--text);letter-spacing:-.15px;color:var(--surface-text);background:var(--surface);box-shadow:var(--rest);transition:transform .3s var(--spring-play),background .2s,color .2s;white-space:nowrap}
.chip:active{transform:scale(.94)}
.chip.working{opacity:.6;pointer-events:none}
.key{height:52px;padding:0 22px;border:0;border-radius:15px;background:var(--ink);color:#fff;font:700 17px var(--display);font-stretch:92%;letter-spacing:-.01em;box-shadow:0 12px 24px -10px rgba(18,26,46,.65);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease-out,box-shadow .12s,opacity .2s}
.key::after{display:none!important}
.key:hover{border:0;transform:none;box-shadow:0 12px 24px -10px rgba(18,26,46,.65)}
.key:active{border:0;transform:scale(.97);box-shadow:0 6px 14px -6px rgba(18,26,46,.5)}
.key:disabled{opacity:.5;pointer-events:none}
.key.quiet{background:#fff;color:var(--ink);box-shadow:var(--rest),inset 0 0 0 1px rgba(18,26,46,.1)}
.night .key:not(.quiet){background:#ffd23c;color:#121a2e;box-shadow:0 2px 6px rgba(0,6,20,.25),0 12px 24px -10px rgba(0,6,20,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.night .key.quiet{background:rgba(255,255,255,.12);color:#fff}
.mini{height:36px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font:600 14px var(--text);color:var(--ink);background:var(--surface);box-shadow:var(--rest);transition:transform .3s var(--spring-play)}
.night .mini{color:#fff}
.mini:active{transform:scale(.94)}
.mini svg{width:14px;height:14px}
.mini{position:relative}
.mini::after{content:"";position:absolute;inset:-4px}
.head .mini{position:absolute;right:0;bottom:16px}
.make-bar{position:sticky;top:-62px;z-index:16;display:flex;align-items:center;justify-content:space-between;margin:-62px -20px 8px;padding:60px 20px 10px;background:rgba(177,210,250,.8);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1)}
.make-bar::after{content:"";position:absolute;left:0;right:0;top:100%;height:28px;background:linear-gradient(rgba(177,210,250,.8),rgba(177,210,250,0));pointer-events:none}
.night .make-bar{background:rgba(23,46,87,.8)}
.night .make-bar::after{background:linear-gradient(rgba(23,46,87,.8),rgba(23,46,87,0))}
.make-bar h2{font-size:28px}
/* ---------- Make ---------- */
#p-make{display:flex;flex-direction:column;padding-bottom:180px;scroll-padding-bottom:196px;scroll-padding-top:120px}
#p-make.drafting{padding-bottom:226px;scroll-padding-bottom:240px}
.hello{flex:1;display:flex;flex-direction:column;transition:opacity .22s ease-out}
.hello.entering{opacity:0}
.make-hello{position:relative;height:224px;margin:0}
.hello.leaving{opacity:0;transform:translateY(-8px);transition:opacity .18s var(--soft),transform .18s var(--soft)}
.hello .grow-top{flex:1;max-height:40px}
.make-hello .shadow{left:240px;top:200px;width:100px;height:13px}
#m-widgie{transition:rotate .22s var(--soft)}
#m-widgie.lean{rotate:-6deg}
#m-bubble{right:138px;top:38px;width:max-content;max-width:212px}
.hello .grow{flex:1;min-height:12px}
.ideas{display:flex;flex-direction:column;gap:10px}
.ideas .eyebrow{margin:0 4px 2px}
.idea{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:var(--surface);color:var(--surface-text);box-shadow:var(--rest);transition:transform .3s var(--spring-play);text-align:left;width:100%}
.idea:active{transform:scale(.97)}
.idea .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--ib);color:var(--if)}
.night .idea .ic{background:var(--nb);color:var(--nf)}
.idea .ic svg{width:20px;height:20px}
.idea .t{font:600 16px var(--text);letter-spacing:-.2px}
.idea .s{font:500 13px var(--text);color:var(--ink-2);margin-top:1px}
.idea .chev{margin-left:auto;color:var(--ink-3)}
.composer{position:absolute;left:20px;right:20px;bottom:108px;z-index:25;min-height:60px;border-radius:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--lift);display:flex;align-items:center;gap:8px;padding:8px;transition:opacity .22s ease-out,transform .28s var(--soft)}
.night .composer{background:rgba(16,30,58,.94);box-shadow:var(--lift),inset 0 0 0 .5px rgba(233,242,255,.22)}
.composer.hidden{opacity:0;transform:scale(.98);pointer-events:none}
.composer .field{position:relative;flex:1;min-width:0;height:44px;display:flex;align-items:center}
.composer input{width:100%;height:44px;padding-left:14px;font:500 17px var(--text);letter-spacing:-.2px;color:var(--ink);caret-color:var(--ink);cursor:text}
.night .composer input{color:#fff;caret-color:#fff}
.composer input::placeholder{color:var(--ink-3)}
.composer .idlecaret{position:absolute;left:6px;top:12px;width:2.5px;height:20px;border-radius:2px;background:var(--ink);opacity:.4;animation:blink 1.06s steps(1) infinite;pointer-events:none}
.night .composer .idlecaret{background:#fff}
.composer:focus-within .idlecaret,.composer.typed .idlecaret,.composer.busy .idlecaret{display:none}
.composer:focus-within input,.composer.typed input,.composer.busy input{padding-left:8px}
.composer .send:disabled:not(.ready){cursor:default}
.composer .send{width:44px;height:44px;border-radius:14px;background:rgba(18,26,46,.1);color:rgba(18,26,46,.35);display:grid;place-items:center;flex:none;transition:background .2s,color .2s,transform .3s var(--spring-play)}
.composer .send.ready{background:var(--ink);color:#fff}
.composer .send:active{transform:scale(.9)}
.night .composer .send{background:rgba(255,255,255,.12);color:rgba(233,242,255,.4)}
.night .composer .send.ready{background:#ffd23c;color:#121a2e}
.thread{display:flex;flex-direction:column;gap:14px;padding-top:20px;transition:opacity .28s ease-out,transform .28s ease-out}

    draw: { p: [0.22, 0.94, 0.339, 0.644, 0.474, 0.364, 0.576, 0.16], width: 0.186 },
    jump: { p: [0.5, 0.94, 0.528, 0.626, 0.472, 0.383, 0.5, 0.16], width: 0.153 },

function bezier(p, t) {
    const u = 1 - t;
    const [a, b, c, d] = [u * u * u, 3 * u * u * t, 3 * u * t * t, t * t * t];
    return [
        a * p[0][0] + b * p[1][0] + c * p[2][0] + d * p[3][0],
        a * p[0][1] + b * p[1][1] + c * p[2][1] + d * p[3][1],
    ];
}

function derivative(p, t) {
    const u = 1 - t;
    const [a, b, c] = [3 * u * u, 6 * u * t, 3 * t * t];
    return [0, 1].map((k) => a * (p[1][k] - p[0][k]) + b * (p[2][k] - p[1][k]) + c * (p[3][k] - p[2][k]));
}

/// options: pose, size, x, y (top-left of the square), color, eye, cheek, eyes ("open" | "happy"), cheeks (scale),
/// mirror (lean left), shadow (color or null), shadowOpacity.
// biome-ignore lint/correctness/noUnusedVariables: a global, for the classic scripts and modules that draw the caret.
function caretSVG(o) {
    const pose = POSES[o.pose || "idle"];
    const s = o.size;
    const pts = [0, 1, 2, 3].map((i) => {
        let x = pose.p[i * 2];
        if (o.mirror) x = 1 - x;
        return [o.x + x * s, o.y + pose.p[i * 2 + 1] * s];
    });
    const w = pose.width * s;
    let out = "";
    if (o.shadow) {
        const f = pts[0];
        out += `<ellipse cx="${f[0]}" cy="${f[1] + 2}" rx="${1.5 * w}" ry="${0.28 * w}" fill="${o.shadow}" opacity="${o.shadowOpacity ?? 0.16}"/>`;
    }
    out += `<path d="M${pts[0]} C${pts[1]} ${pts[2]} ${pts[3]}" fill="none" stroke="${o.color}" stroke-width="${w}" stroke-linecap="round"/>`;
    const along = (t) => {
        const c = bezier(pts, t);
        const d = derivative(pts, t);
        const len = Math.hypot(d[0], d[1]) || 1;
        return { c, n: [-d[1] / len, d[0] / len] };
    };
    const face = along(0.88);
    const rx = 0.134 * w;
    const ry = 0.169 * w;
    for (const sign of [-1, 1]) {
        const cx = face.c[0] + sign * face.n[0] * 0.22 * w;
        const cy = face.c[1] + sign * face.n[1] * 0.22 * w;
        if ((o.eyes || "open") === "open") {
            out += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${o.eye}"/>`;
        } else {
            out += `<path d="M${cx - 1.35 * rx} ${cy} Q${cx} ${cy - 1.6 * ry} ${cx + 1.35 * rx} ${cy}" fill="none" stroke="${o.eye}" stroke-width="${0.1 * w}" stroke-linecap="round"/>`;
        }
    }
    const cheeks = o.cheeks ?? 1;
    if (cheeks > 0 && o.cheek) {
        const blush = along(0.77);
        for (const sign of [-1, 1]) {
            const cx = blush.c[0] + sign * blush.n[0] * 0.3 * w;
            const cy = blush.c[1] + sign * blush.n[1] * 0.3 * w;
            out += `<ellipse cx="${cx}" cy="${cy}" rx="${0.14 * w * cheeks}" ry="${0.095 * w * cheeks}" fill="${o.cheek}" opacity=".95"/>`;
        }
    }
    return out;
}

    return `<svg class="puppy" viewBox="0 0 64 60" aria-hidden="true"><path d="M12 13 C2 17 2 37 11 41 C17 37 19 24 17 14Z" fill="#8a5527"/><path d="M52 13 C62 17 62 37 53 41 C47 37 45 24 47 14Z" fill="#8a5527"/><ellipse cx="32" cy="30" rx="20" ry="19" fill="#f2b46b"/><ellipse cx="32" cy="40" rx="11" ry="8.5" fill="#fff1dc"/>${eyes}<ellipse cx="18.5" cy="34.5" rx="3" ry="2" fill="#ff9aa8" opacity=".85"/><ellipse cx="45.5" cy="34.5" rx="3" ry="2" fill="#ff9aa8" opacity=".85"/><ellipse cx="32" cy="35.5" rx="4" ry="3" fill="${ink}"/><path d="M32 38.6v2.4M28.4 41.8q3.6 2.6 7.2 0" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/>${tongue}</svg>`;

/// A progress ring toward a goal, with an icon in the middle.
function ring(fraction, glyph) {
    const r = 21;
    const length = 2 * Math.PI * r;
    const shown = Math.min(1, Math.max(0, fraction)) * length;
    return `<div class="ring" aria-hidden="true"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="6"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-dasharray="${shown.toFixed(1)} ${length.toFixed(1)}" transform="rotate(-90 27 27)"/></svg>${glyph}</div>`;
}

const MEDIUM = new Set(["groc", "baby", "count", "quest", "chores", "grid", "savings", "word"]);

/// Draws the widget named by `el.dataset.widget` into `el` and makes it tappable.
function mountWidget(el) {
    const spec = WIDGETS[el.dataset.widget];
    el.classList.add(el.dataset.widget);
    const state = spec.state();
    const render = () => {
        el.innerHTML = spec.draw(state, el);
    };
    render();
    if (spec.tap) {
        el.addEventListener("click", (event) => {
            const target = event.target.closest("[data-tap]");
            if (target && spec.tap(state, target, el)) render();
        });
    }
    // Times like "2h 14m" keep moving while the page is open.
    if (["luna", "baby"].includes(el.dataset.widget)) setInterval(render, 30000);
}

/// Where each pose's body crosses its middle, in the caret's 100-unit box (from the curves in /caret.js).
const MIDDLE = { idle: [50, 55], lean: [46.4, 46.5], jump: [50, 52], draw: [40.5, 52] };

/// A flexed arm on the caret's right side: upper arm out, a round bicep, forearm up, a fist on top.
function flexArm(pose, mirror, color, shine) {
    const [mx, my] = MIDDLE[pose] ?? MIDDLE.idle;
    const x = (mirror ? 100 - mx : mx) + 5;
    const y = my + 5;
    return `<g class="arm" fill="${color}" stroke="${color}" stroke-linecap="round" stroke-linejoin="round"><path d="M${x} ${y} L${x + 19} ${y - 1}" stroke-width="9.5" fill="none"/><ellipse cx="${x + 10.5}" cy="${y - 6}" rx="10.5" ry="8.4" stroke="none"/><path d="M${x + 19} ${y - 1} L${x + 22} ${y - 19}" stroke-width="8.5" fill="none"/><circle cx="${x + 22.5}" cy="${y - 23}" r="6.8" stroke="none"/><path d="M${x + 5.5} ${y - 9.5} Q${x + 10.5} ${y - 14} ${x + 15.5} ${y - 9.5}" fill="none" stroke="${shine}" stroke-width="1.8" opacity=".7"/></g>`;
}

/// Draws a caret from data attributes: pose, mirror, eyes ("happy"), moon (light on dark), shadow, and halo (a cut
/// line in the field color that separates the caret from ink it touches, like a sticker).
function mountCaret(el) {
    const d = el.dataset;
    const moon = d.moon === "1";
    const eye = moon ? "#2B4E82" : d.eye || "#C4D8F3";
    const body = globalThis.caretSVG({
        pose: d.pose || "idle",
        size: 100,
        x: 0,
        y: 0,
        color: moon ? "#E9F2FF" : INK,
        eye,
        cheek: "#FF7F8E",
        eyes: d.eyes || "open",
        mirror: d.mirror === "1",
        cheeks: 1.15,
        shadow: d.shadow ? "#000" : null,
        shadowOpacity: 0.16,
    });
    const halo = d.halo
        ? (body.match(
              /<path d="([^"]+)" fill="none" stroke="[^"]+" stroke-width="([\d.]+)" stroke-linecap="round"\/>/,
          ) ?? [])[0]
              ?.replace(/stroke="[^"]+"/, `stroke="${d.halo}"`)
              .replace(/stroke-width="([\d.]+)"/, (_, w) => `stroke-width="${Number(w) + 7}"`)
        : "";
    // data-arm="flex": a bicep curled up beside the body, for the growth page. It starts at the body's middle.
    const arm = d.arm === "flex" ? flexArm(d.pose || "idle", d.mirror === "1", moon ? "#E9F2FF" : INK, eye) : "";
    // The eyes get two wrappers: the outer one looks toward the pointer, the inner one blinks.
    const withEyes = body.replace(
        /(stroke-linecap="round"\/>)(<(?:ellipse|path)[^>]*\/>)(<(?:ellipse|path)[^>]*\/>)/,
        '$1<g class="look"><g class="eyes">$2$3</g></g>',
    );
    el.innerHTML = `<svg viewBox="0 4 100 100" aria-hidden="true">${halo || ""}${arm}${withEyes}</svg>`;
}

// ---------- Scenes ----------

/// `still` marks a block a caret holds or stands on: it does not drift with scroll, so the pair stays together.
const block = (w, x, y, r, still = false) =>
    `<div class="blk ${MEDIUM.has(w) ? "m" : ""}" data-widget="${w}"${still ? " data-still" : ""} style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); --rot: ${r}deg"></div>`;
const caret = (pose, x, y, w, extra = "") =>
    `<span class="caret" data-pose="${pose}" ${extra} style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); width: calc(${w} * var(--u))"></span>`;
const floatingHeart = (x, y, w) =>
    `<div class="caret heart-float" style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); width: calc(${w} * var(--u))">${icon.heart}</div>`;
const note = (x, y, w, text, arrow = "") =>
    `<div class="scrawl" style="left: calc(${x} * var(--u)); top: calc(${y} * var(--u)); width: calc(${w} * var(--u))">${text}${arrow}</div>`;
const ARROW = `<svg viewBox="0 0 60 60" style="left: calc(-46 * var(--u)); top: calc(40 * var(--u)); width: calc(50 * var(--u))"><path d="M54 6 C40 10 24 22 12 44" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/><path d="M5 31 L12 46 L27 41" fill="none" stroke="${INK}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/// Caret confetti, as on the app's Saved screen: short round bars in the section colors.
const confettiBits = (cx, cy) =>
    [
        [-150, -40, 30, "#ffd23c"],
        [-120, 60, -40, "#ff7f8e"],
        [-170, 140, 70, "#a9e9cd"],
        [130, -60, -25, "#a9e9cd"],
        [150, 40, 50, "#ffd23c"],
        [120, 130, -60, "#ff7f8e"],
        [-60, -110, 80, "#ff7f8e"],
        [60, -120, 15, "#ffd23c"],
    ]
        .map(
            ([x, y, r, c]) =>
                `<i class="bit" style="left: calc(${cx + x} * var(--u)); top: calc(${cy + y} * var(--u)); transform: rotate(${r}deg); background: ${c}"></i>`,
        )
        .join("");
const tall = (height, inner) => `<div class="mob-scene" style="height: calc(${height} * var(--u))">${inner}</div>`;

/// A phone arrangement built from a list: small widgets pair up side by side, medium widgets and carets take a row,
/// and a small widget with no partner sits in the middle of its row. Entries are widget names, or ["caret", pose, extra].
const isSmall = (entry) => typeof entry === "string" && !MEDIUM.has(entry);
function stack(entries) {

    // A small tile: Widgie stands beside it on the spotlight floor, the pair centred, and talks from above.
    const size = 116, x = W + 50;
    drawWidgie(spotWidgie, "lean", { mirror: "1" });
    stand(spotWidgie, size, "lean", true, x, H);
    Object.assign(shadow.style, { left: x - 32 + "px", top: H - 5 + "px", width: "64px" });
    b.classList.add("down"); Object.assign(b.style, { left: W + 4 + "px", bottom: "120px", top: "auto", maxWidth: "134px" }); b.style.setProperty("--tx", "26px");
    box.style.transform = "translateX(-46px)";
  }
  const sheet = $("#sheet");
  sheet.inert = false;
  for (const p of ["#p-widgets", "#p-make", "#p-tpl", "#tabbar", "#composer"]) $(p).inert = true;
  phone.classList.add("sheet-open");
  $("#scrim").classList.add("show");
  sheet.scrollTop = 0;
  sheet.classList.add("show");
  sheet.focus({ preventScroll: true });
  // The tile you tapped grows up into the sheet's tile, so it reads as the same thing coming closer.
  const src = from?.querySelector(".blk"), dst = $("#s-spot .blk");
  if (src && dst && !calm) {
    const a = src.getBoundingClientRect(), bR = dst.getBoundingClientRect();
    const dx = (a.left + a.width / 2 - (bR.left + bR.width / 2)) / ZOOM, dy = (a.top + a.height / 2 - (bR.top + bR.height / 2)) / ZOOM;
    dst.animate([{ transform: `translate(${dx}px,${dy}px) scale(${a.width / bR.width}) rotate(${src.style.getPropertyValue("--rot") || "0deg"})` }, { transform: "none" }], { duration: 420, easing: SPRING });
    from.style.visibility = "hidden";
  }
  setTimeout(() => { if (run !== sheetRun) return; say(b, HINTS[w] || "It works. Tap it!"); hop(spotWidgie, true); }, calm ? 0 : 440);
}
$("#s-name").addEventListener("input", () => {
  const blank = BLANKS[sheetItem[0]]; if (!blank) return;
  const raw = $("#s-name").value.trim(), v = raw || blank.start;
  words($("#s-spot .blk"), blank.pairs(v));
  clearTimeout(nameTimer);
  if (!raw) return;
  const run = sheetRun;
  nameTimer = setTimeout(() => { if (run !== sheetRun) return; say($("#s-spot .bubble"), (blank.said || named)(raw)); hop(spotWidgie, true); }, 500);
});
// Closing is opening in reverse: the sheet's tile shrinks back into its card in the pile while the sheet slides away.
function flyBack(o) {
  const src = $("#s-spot .blk"), dst = o.querySelector(".blk");
  if (!src || !dst || calm) return Promise.resolve();
  const a = local(src.getBoundingClientRect()), b = local(dst.getBoundingClientRect());
  const copy = src.cloneNode(true);
  copy.classList.remove("press", "squish", "fadein"); copy.classList.add("flyer");
  Object.assign(copy.style, { position: "absolute", left: a.x + "px", top: a.y + "px", margin: 0, transform: "none" });
  phone.appendChild(copy);
  src.style.visibility = "hidden";
  const dx = b.x + b.w / 2 - (a.x + a.w / 2), dy = b.y + b.h / 2 - (a.y + a.h / 2);
  return copy.animate([{ transform: "none" }, { transform: `translate(${dx}px,${dy}px) scale(${b.w / a.w}) rotate(${dst.style.getPropertyValue("--rot") || "0deg"})` }], { duration: 340, easing: "cubic-bezier(.4,0,.2,1)", fill: "forwards" }).finished.then(() => copy.remove());
}
function closeSheet({ flying = false } = {}) {
  const sheet = $("#sheet");
  if (!sheet.classList.contains("show")) return;
  sheetRun++; clearTimeout(nameTimer);
  $("#scrim").classList.remove("show"); $("#scrim").style.opacity = "";
  sheet.classList.remove("show", "dragging"); sheet.style.transform = "";
  $("#s-name").blur();
  phone.classList.remove("sheet-open");
  sheet.inert = true;
  go(tab, true);
  const o = opener; opener = null;
  if (!o) return;
  const back = () => { o.style.visibility = ""; o.focus({ preventScroll: true }); };
  if (flying || calm) setTimeout(back, calm ? 0 : 260); else flyBack(o).then(back);
}
$("#scrim").onclick = () => closeSheet();
$("#s-close").onclick = () => closeSheet();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#sheet").classList.contains("show")) closeSheet(); });
// The focus stays inside the sheet while it is open.
$("#sheet").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const f = [...$("#sheet").querySelectorAll("button, input")].filter((x) => !x.disabled && x.getClientRects().length && !x.closest("[hidden]"));
  if (!f.length) return;
  const i = f.indexOf(document.activeElement);
  if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && (i === -1 || i === f.length - 1)) { e.preventDefault(); f[0].focus(); }
});
// The sheet follows a drag down from its grabber or its title, and closes past 120 points or on a quick flick.
(() => {
  const sheet = $("#sheet"), scrim = $("#scrim");
  let y0 = 0, dy = 0, trail = [], on = false;
  sheet.addEventListener("pointerdown", (e) => {
    if (!sheet.classList.contains("show") || !e.target.closest("#s-grab, #s-title, #s-line")) return;
    on = true; y0 = e.clientY; dy = 0; trail = [[e.timeStamp, 0]];
    sheet.classList.add("dragging"); sheet.setPointerCapture(e.pointerId);
  });
  sheet.addEventListener("pointermove", (e) => {
    if (!on) return;
    const raw = (e.clientY - y0) / ZOOM;
    dy = raw > 0 ? raw : raw * .2;
    sheet.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - Math.max(0, dy) / 400));
    trail.push([e.timeStamp, dy]); if (trail.length > 5) trail.shift();
  });
  const end = () => {
    if (!on) return;
    on = false;
    const [ta, ya] = trail[0], [tb, yb] = trail[trail.length - 1], v = tb > ta ? (yb - ya) / (tb - ta) : 0;
    sheet.classList.remove("dragging");
    if (dy > 120 || v > .5) closeSheet(); else { sheet.style.transform = ""; scrim.style.opacity = ""; }
  };
  sheet.addEventListener("pointerup", end);
  sheet.addEventListener("pointercancel", end);
})();
function sheetChoice() {
  const [w, title] = sheetItem, blank = BLANKS[w];
  const v = blank ? ($("#s-name").value.trim() || blank.start) : null;
  return { w, title, name: v ? savedName(w, title, v) : title, words: [...(v ? blank.pairs(v) : []), ...(FRESH[w] || [])], who: w === "hearts" ? v : undefined };
}
$("#s-chat").onclick = () => {
  const c = sheetChoice();
  closeSheet();
  setTimeout(() => {
    go("make");
    const open = () => { adopt(c.w, c.name, c.words, undefined, c.who); say_.focus(); };
    if (draft) confirmReplace(`Swap your draft for ${c.name}?`, open); else open();
  }, calm ? 0 : 240);
};
$("#s-add").onclick = (e) => {
  const key = e.currentTarget; key.disabled = true;
  const blk = $("#s-spot .blk"), c = sheetChoice();
  burst(blk); hop(spotWidgie);
  setTimeout(() => {
    const flight = flyToTab(blk, 480);
    $("#sheet").classList.add("leaving"); closeSheet({ flying: true });
    setTimeout(() => $("#sheet").classList.remove("leaving"), 200);
    flight.then(() => {
      squishGlyph();
      addToFeed({ w: c.w, name: c.name, words: c.words, who: c.who, look: petLook(c.w) });
      if (tab !== "widgets") toast(`${c.name} is in your widgets.`);
      key.disabled = false;
    });
  }, calm ? 0 : 200);
};

// ---------- tabs: each page renders once and keeps its state; switching is a quick slide ----------
function placePill() {
  const t = $(`.tab[data-tab="${tab}"]`), pill = $("#pill");
  pill.style.left = t.offsetLeft + "px";
  pill.style.width = t.offsetWidth + "px";
}
function go(next, quiet = false) {
  const to = ORDER.indexOf(next);
  if (next === "make" && tab !== "make") hop($("#tab-widgie"), true);
  tab = next;
  for (const k of ORDER) {
    const page = $(`#p-${k}`), i = ORDER.indexOf(k);
    page.classList.toggle("hidden", k !== next);
    page.classList.toggle("to-left", i < to);
    page.classList.toggle("to-right", i > to);
    page.inert = k !== next;
  }
  // The composer is part of the Make canvas, so it slides with it.
  const comp = $("#composer"), mi = ORDER.indexOf("make");
  comp.classList.toggle("hidden", next !== "make");
  comp.classList.toggle("to-left", mi < to);
  comp.classList.toggle("to-right", mi > to);
  comp.inert = next !== "make";
  for (const t of $$(".tab")) { const on = t.dataset.tab === next; t.classList.toggle("on", on); if (on) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); t.removeAttribute("aria-selected"); }
  placePill();
  keyFace();
  if (next === "widgets") {
    unseen = 0; badge();
    if (pending.length && !quiet) { const a = pending; pending = []; $("#toast").classList.remove("show"); land(a); }
  }
}
for (const t of $$("[data-tab]")) t.onclick = () => go(t.dataset.tab);
for (const b of $$("[data-go]")) b.onclick = () => go(b.dataset.go);
function keyFace() { drawWidgie($("#tab-widgie"), "idle", { moon: night && tab !== "make" ? "1" : "0" }); }
function redrawCast() {
  for (const el of $$(".widgie")) {
    if (!el._pose) continue;
    el.classList.remove("fadeswap"); void el.offsetWidth; el.classList.add("fadeswap");
    drawWidgie(el, ...el._pose);
  }
}
// Day and night: the sky, every surface and every Widgie cross-fade; the pile stays as it is.
for (const b of $$("[data-time]")) b.onclick = () => {
  night = b.dataset.time === "night";
  for (const x of $$("[data-time]")) x.classList.toggle("on", x === b);
  phone.classList.toggle("night", night);
  $("#w-hello").textContent = night ? "Good evening" : "Good morning";
  redrawCast(); keyFace();
  paintBanner(CATS[cat]); castBanner(CATS[cat]);
  say($("#w-bubble"), greet(), { swap: true });
};

// Widgie's idle life on Widgets: a double blink, a glance at your widgets, or a little hop, every 8 to 11 seconds,
// only while you are not busy with something.
let beat = 0, lastTouch = 0;
for (const ev of ["pointerdown", "keydown", "wheel"]) phone.addEventListener(ev, () => (lastTouch = Date.now()), true);
$("#p-widgets").addEventListener("scroll", () => (lastTouch = Date.now()), { passive: true });
function idle() {
  const w = $("#w-widgie");
  const quiet = Date.now() - lastTouch > 4000 && $("#p-widgets").scrollTop < 140 && !$("#sheet").classList.contains("show");
  if (tab === "widgets" && !calm && quiet) { const n = beat++ % 3; if (n === 0) play(w, "blink2", 640); else if (n === 1) play(w, "glance", 1420); else hop(w, true); }
  setTimeout(idle, 8000 + (beat % 3) * 1500);
}

layoutFeed({ first: true });
makeReset();
renderCats();
renderPile(false);
go("widgets");
badge();
setTimeout(() => say($("#w-bubble"), greet()), 700);
setTimeout(idle, 9000);
window.proto = {
  go, ask: (i) => ask(IDEAS[i], IDEAS[i].t, $$(".idea")[i]), openSheet: (i) => openSheet(CATS[cat].items[i], $$("#pile .item")[i] || null),
  setNight: (n) => $(`[data-time="${n ? "night" : "day"}"]`).click(),
  say: () => say($("#w-bubble"), greet()),
  cat: (k) => pickCat(k),
  add: (w, n, pairs, look) => addToFeed({ w, name: n, words: pairs, look }),
  refine: (i) => draft && refine(draft.chips[i][0], draft.chips[i]),
  send: (text) => { say_.value = text; composerMode(); $("#composer").requestSubmit(); },
  saveDraft: () => draft && saved(),
  adopt, closeSheet,
};
})();
</script>
