<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1024px;height:1024px;overflow:hidden}svg{display:block}</style></head><body>
<script src="../../../Site/public/caret.js"></script><script src="icons.js"></script>
<script>
// render.html?icon=peek&variant=light|dark|tinted draws one 1024 x 1024 icon for the snapshot tool.
const q = new URLSearchParams(location.search);
const key = q.get("icon"), kind = q.get("variant");
const light = ICONS[key].svg();
document.body.innerHTML = kind === "tinted" ? tinted(key) : kind === "dark" ? variant(light, "dark") : light;
</script></body></html>
