# The app project. `scripts/build` generates Widgie.xcodeproj from this file with XcodeGen; the project and
# the Info.plist files it writes are git-ignored, so this file is the only source of truth.
name: Widgie
options:
  bundleIdPrefix: dev.krutikpatel
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Z23KXVBB26
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # The Keychain group the app and the extension share, which holds the account token (Hosting.account). The
    # entitlements list it, and both Info.plist files name it as WidgieKeychainGroup for the Keychain queries.
    WIDGIE_KEYCHAIN_GROUP: $(AppIdentifierPrefix)dev.krutikpatel.widgie.shared
  # The backend the app builds through and both processes reach the account on: the dev Worker in Debug, production
  # in Release (ModelService.swift, Hosting.account).
  configs:
    Debug:
      WIDGIE_MODEL_SERVICE: https://widgie-dev.krutikpatel-patel.workers.dev
    Release:
      WIDGIE_MODEL_SERVICE: https://widgie.krutikpatel-patel.workers.dev
packages:
  WidgetEngine:
    path: ../Engine
targets:
  Widgie:
    type: application
    platform: iOS
    sources:
      - Widgie
      # The four reference widgets, so the app can install them before the AI builder exists. Debug only.
      - path: ../Engine/Fixtures
        type: folder
        buildPhase: resources
      # The ready-made widgets the Templates tab offers. Every build ships them.
      - path: Templates
        type: folder
        buildPhase: resources
    dependencies:
      - package: WidgetEngine
        products: [WidgetEngine, WidgetBuilder, WidgetHosting]
      - target: WidgieWidgets
    # Entitlements are two checked-in files, set per configuration below: XcodeGen's `entitlements:` writes one
    # file, and App Attest's environment differs. Both keep the App Group and the shared Keychain group.
    info:
      path: Widgie/Info.plist
      properties:
        CFBundleDisplayName: Widgie
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        EngineAppGroup: group.dev.krutikpatel.widgie
        EngineURLScheme: widgie
        # The backend a phone builds through and the account lives on (ModelService.swift, Hosting.account).
        WidgieModelService: $(WIDGIE_MODEL_SERVICE)
        WidgieKeychainGroup: $(WIDGIE_KEYCHAIN_GROUP)
        # What App Attest puts in this build's attestations, which the Debug capture writes into its fixture: the
        # app id the Worker's APP_ID must equal, and the entitlements file's appattest-environment.
        WidgieAppAttestAppId: $(DEVELOPMENT_TEAM).$(PRODUCT_BUNDLE_IDENTIFIER)
        WidgieAppAttestEnvironment: $(WIDGIE_APP_ATTEST_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: dev.krutikpatel.widgie
            CFBundleURLSchemes: [widgie]
    # Debug only: the dev bridge on the Mac and plain HTTP to it, which the simulator uses because it has no App
    # Attest. A phone uses WidgieModelService over HTTPS, and a Release build keeps App Transport Security whole.
    # Also only in a Debug build for the simulator: WidgieDevSecret, the dev Worker's DEV_REGISTRATION_SECRET, with
    # which the simulator registers its account (Registration.swift), when the build has WIDGIE_DEV_SECRET: from the
    # environment of xcodebuild, or from App/Secrets.xcconfig (`WIDGIE_DEV_SECRET = ...`), which git ignores and
    # Debug.xcconfig includes. Never committed; a Release build and a build for a phone have no such key. The script
    # keeps its environment out of the build log, which would print the secret.
    postBuildScripts:
      - name: Debug model bridge
        basedOnDependencyAnalysis: false
        showEnvVars: false
        # Names the processed Info.plist so the build edits it after writing it, not before.
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        script: |
          [ "$CONFIGURATION" = Debug ] || exit 0
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          for key in WidgieModelBridge NSAppTransportSecurity WidgieDevSecret; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true
          done
          /usr/libexec/PlistBuddy -c "Add :WidgieModelBridge string http://127.0.0.1:8787" \
            -c "Add :NSAppTransportSecurity dict" \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$plist"
          if [ "$PLATFORM_NAME" = iphonesimulator ] && [ -n "${WIDGIE_DEV_SECRET:-}" ]; then
            /usr/libexec/PlistBuddy -c "Add :WidgieDevSecret string \"$WIDGIE_DEV_SECRET\"" "$plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.krutikpatel.widgie
        # `Color(.widgieGround)` for each colorset in Widgie/Design/WidgieColors.xcassets, so a renamed or
        # missing token fails the build instead of drawing clear.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        # Widgie/AppIcon.xcassets: the Peek caret cropped close (B3), drawn by docs/design/app-icon/ (light, dark, tinted).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Widgie/Widgie-Debug.entitlements
          WIDGIE_APP_ATTEST_ENVIRONMENT: development
        Release:
          CODE_SIGN_ENTITLEMENTS: Widgie/Widgie-Release.entitlements
          WIDGIE_APP_ATTEST_ENVIRONMENT: production
          EXCLUDED_SOURCE_FILE_NAMES: Fixtures
    configFiles:
      Debug: Debug.xcconfig
  # Unit tests of the app's view models, hosted in the app so UIKit is there. They use a scripted model and
  # temporary engines, never the bridge or the App Group store.
  WidgieTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WidgieTests]
    dependencies:
      - target: Widgie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.krutikpatel.widgie.tests
        GENERATE_INFOPLIST_FILE: YES
  WidgieWidgets:
    type: app-extension
    platform: iOS
    sources: [WidgieWidgets]
    # Never WidgetBuilder: the extension cannot build, ingest images, or encode PNGs (docs/engine/USAGE.md).
    dependencies:
      - package: WidgetEngine
        products: [WidgetEngine, WidgetHosting]
    entitlements:
      path: WidgieWidgets/WidgieWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.krutikpatel.widgie]
        keychain-access-groups: [$(WIDGIE_KEYCHAIN_GROUP)]
    info:
      path: WidgieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Widgie
        EngineAppGroup: group.dev.krutikpatel.widgie
        EngineURLScheme: widgie
        # The pull before a render reaches the account here, with the token the app saved in the shared group.
        WidgieModelService: $(WIDGIE_MODEL_SERVICE)
        WidgieKeychainGroup: $(WIDGIE_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.krutikpatel.widgie.widgets
schemes:
  Widgie:
    build:
      targets:
        Widgie: all
        WidgieWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      # Serial on purpose: suspending writes reaches every shared store in the process, so suites must not overlap.
      targets:
        - name: WidgieTests
          parallelizable: false
